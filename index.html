    if(pendingWithdrawal>prevPendingRef.current+1000)setProfitDismissed(false);
    prevPendingRef.current=pendingWithdrawal;
  },[pendingWithdrawal]);

  const addTrade   =useCallback(t=>{
    tradeEvents.insert(t.id,"opened",{entry_price:t.entryPrice,contracts:t.contracts,direction:t.direction,product_id:t.productId});
    setTrades(p=>{
      // Arm CB if new open trade AND balance has grown >= 1 step
      if(t.status==="open"||t.status==="draft"){
        const closedPL=p.filter(x=>x.status==="closed").reduce((s,x)=>{
          const prod=resolveProduct(products,x.productId);
          return s+(tradeNetPL(x,prod)||0);
        },0);
        setPortfolio(pf=>{
          if(pf.cb_armed)return pf;
          const txs=pf.transactions||[];
          const txBal=txs.reduce((s,tx)=>s+(tx.type==="deposit"?tx.amount:-tx.amount),0);
          const bal=txBal+closedPL;
          const base=calcStepBaseline(txs);
          if(base<=0)return pf;
          const thresh=Array.from({length:21},(_,i)=>base*Math.pow(1.5,i+1));
          const step=thresh.filter(th=>bal>=th).length;
          if(step>=1)return{...pf,cb_armed:true,cb_baseline:bal,cb_threshold:Math.round(bal*0.70)};
          return pf;
        });
      }
      return[...p,t];
    });
  },[products]);
  const addTrades  =useCallback(ts=>{
    setTrades(p=>{
      const next=[...p,...ts];
      const hasOpen=ts.some(x=>x.status==="open"||x.status==="draft");
      if(hasOpen){
        const closedPL=next.filter(x=>x.status==="closed").reduce((s,x)=>{
          const prod=resolveProduct(products,x.productId);
          return s+(tradeNetPL(x,prod)||0);
        },0);
        setPortfolio(pf=>{
          if(pf.cb_armed)return pf;
          const txs=pf.transactions||[];
          const txBal=txs.reduce((s,tx)=>s+(tx.type==="deposit"?tx.amount:-tx.amount),0);
          const bal=txBal+closedPL;
          const base=calcStepBaseline(txs);
          if(base<=0)return pf;
          const thresh=Array.from({length:21},(_,i)=>base*Math.pow(1.5,i+1));
          const step=thresh.filter(th=>bal>=th).length;
          if(step>=1)return{...pf,cb_armed:true,cb_baseline:bal,cb_threshold:Math.round(bal*0.70)};
          return pf;
        });
      }
      return next;
    });
  },[products]);
  const handleImportTransactions=useCallback(function(txs){
    if(!txs||txs.length===0)return;
    setPortfolio(function(p){
      // Remove old placeholder entries, merge new ones, dedup by date+amount+type
      var existing=(p.transactions||[]).filter(function(t){return t.note!=="เงินเริ่มต้น (จาก Import)";});
      var existingKeys=new Set(existing.map(function(t){return t.type+"|"+t.date+"|"+t.amount;}));
      var toAdd=txs.filter(function(t){return!existingKeys.has(t.type+"|"+t.date+"|"+t.amount);});
      var merged=[...existing,...toAdd].sort(function(a,b){return new Date(a.date)-new Date(b.date);});
      // Clear stepHistory and peakEquity so backfill rebuilds from scratch with correct data
      return{...p,transactions:merged,stepHistory:[],peakEquity:0};
    });
  },[]);
  const handleImportBalance=useCallback(({amount,date})=>{
    if(!amount||amount<=0)return;
    setPortfolio(p=>{
      const tx={id:uid(),type:"deposit",date:date||new Date().toISOString().slice(0,16),amount,note:"เงินเริ่มต้น (จาก Import)"};
      // Remove any existing setup deposit, then add fresh one (idempotent replace)
      const others=(p.transactions||[]).filter(t=>t.note!=="เงินเริ่มต้น (จาก Import)");
      return{...p,transactions:[...others,tx]};
    });
  },[]);
  const updateTrade=useCallback(t=>{
    if(t.status==="closed"&&t.exitPrice!=null){
      tradeEvents.insert(t.id,"closed",{exit_price:t.exitPrice,contracts:t.contracts});
    }
    setTrades(p=>{
      const next=p.map(x=>x.id===t.id?t:x);
      // Disarm CB when all positions closed
      if(t.status==="closed"){
        const stillOpen=next.filter(x=>x.status==="open").length;
        if(stillOpen===0){
          setPortfolio(pf=>pf.cb_armed?{...pf,cb_armed:false,cb_baseline:0,cb_threshold:0}:pf);
        }
      }
      return next;
    });
  },[]);
  // ── Close-save durability (C+A+D) — narrow exception to the frozen persistence
  // architecture, scoped to the close path ONLY. SAVE-FIRST: AWAIT a durable single-row
  // write (db.saveTrade via saveTradesSerialized) on the EXPLICIT updatedTrade object,
  // and mutate local state (updateTrade → CB-disarm) ONLY on res.ok — so no React state
  // shows the trade closed and no circuit-breaker disarm fires before the server confirms.
  // No flushSync, no snapshot capture, no schema, no loadAll/hydration change. Caller owns success UX.
  const commitClose=useCallback(async(updatedTrade)=>{
    try{
      clearTimeout(dbTimers.current.trades);   // cancel any pending debounced autosave so it can't race the close save
      const ext=(await externalizeTradeImages(authUid,updatedTrade)).trade;   // P2-5-C: base64 → Storage path before save
      const res=await saveTradesSerialized(ext,{source:"close",affectedTradeId:ext.id});
      if(res&&res.ok){
        updateTrade(ext);   // ONLY now: apply the EXTERNALIZED close to state + CB-disarm (local converges to path refs)
        return {ok:true,trade:ext};
      }
      // Failure: state untouched (trade stays open, CB armed); caller keeps modal open + retry. Any uploaded objects orphan (v1).
      return {ok:false,error:(res&&res.error)||new Error("close save failed"),guard:res&&res.guard};
    }catch(e){console.warn("[close-save] commitClose error",e);return {ok:false,error:e};}
  },[updateTrade,saveTradesSerialized,authUid]);
  // ── Open-save durability — same SAVE-FIRST single-row pattern as the close path, applied to
  // NEW opens (addTrade) and draft→open execute (updateTrade). AWAIT a durable single-row
  // db.saveTrade (via saveTradesSerialized source:"open"); apply local state + report success
  // ONLY on res.ok, so the UI never shows an open trade that didn't reach Supabase. The
  // full-array autosave stays background-only; it is no longer the primary persistence for opens.
  const commitTradeWrite=useCallback(async(trade,apply)=>{
    try{
      clearTimeout(dbTimers.current.trades);   // cancel any pending debounced full-array autosave so it can't race this save
      const ext=(await externalizeTradeImages(authUid,trade)).trade;   // P2-5-C: base64 → Storage path before save
      const res=await saveTradesSerialized(ext,{source:"open",affectedTradeId:ext.id});
      if(res&&res.ok){
        apply(ext);   // ONLY now: new open → addTrade (append); draft execute → updateTrade (replace) — local gets path refs
        return {ok:true,trade:ext};
      }
      return {ok:false,error:(res&&res.error)||new Error("open save failed"),guard:res&&res.guard};
    }catch(e){console.warn("[open-save] commitTradeWrite error",e);return {ok:false,error:e};}
  },[saveTradesSerialized,authUid]);
  const commitOpen=useCallback(t=>commitTradeWrite(t,addTrade),[commitTradeWrite,addTrade]);
  const commitExecuteDraft=useCallback(t=>commitTradeWrite(t,updateTrade),[commitTradeWrite,updateTrade]);
  // ── Pure local row replacement — used ONLY by the durable update path. No CB logic,
  // no tradeEvents insert, no close/open side effects, no toast, no Supabase write,
  // no reconcile/delete. Deliberately separate from updateTrade (which is NOT pure).
  const replaceTradeLocal=useCallback((updatedTrade)=>{
    setTrades(prev=>prev.map(x=>x.id===updatedTrade.id?updatedTrade:x));
  },[]);
  // ── Update-save durability — SAVE-FIRST durable single-row write for update-like edits
  // (edit existing order, update current price, TradeDetailModal note/image/meta). Mirrors the
  // close/open pattern but applies a PURE replaceTradeLocal on success — NOT updateTrade — so a
  // metadata edit never triggers CB-disarm or a tradeEvents("closed") insert. Full-array autosave
  // stays background-only. Caller owns success/failure UX (toast, modal close).
  const commitUpdateTrade=useCallback(async(updatedTrade)=>{
    try{
      clearTimeout(dbTimers.current.trades);   // cancel any pending debounced full-array autosave so it can't race this save
      const ext=(await externalizeTradeImages(authUid,updatedTrade)).trade;   // P2-5-C: base64 → Storage path before save
      const res=await saveTradesSerialized(ext,{source:"update",affectedTradeId:ext.id});
      if(res&&res.ok){
        replaceTradeLocal(ext);   // ONLY now: pure local row replace with the EXTERNALIZED trade (local converges to path refs)
        return {ok:true,trade:ext};   // caller (detail modal) re-applies res.trade so its view shows path-backed images, not stale base64
      }
      return {ok:false,error:(res&&res.error)||new Error("update save failed"),guard:res&&res.guard};
    }catch(e){console.warn("[update-save] commitUpdateTrade error",e);return {ok:false,error:e};}
  },[replaceTradeLocal,saveTradesSerialized,authUid]);
  // ── Import durability (P2-3) — SAVE-FIRST per-row durable writes for Excel / MT5 file import.
  // Replaces the old "addTrades → full-array debounced autosave" persistence: each confirmed
  // imported row is written via the single-row path (saveTradesSerialized source:"open") BEFORE it
  // is added to local state, so a failed row never appears locally and import no longer depends on
  // the 57014-prone full-array autosave. Additive only — imported rows carry no base64 images, no
  // merged/subTrades, no partialCloses; status (open/closed) is preserved verbatim by db.saveTrade.
  // Continue-on-failure with a {saved,failed,skipped} report. Within-batch mt5PositionId dedup.
  // clearTimeout first (like the other commit wrappers) so a stale autosave can't reconcile-delete a
  // just-saved row while its id is in lastSeenRef but not yet in local trades. Succeeded rows are
  // batch-added via addTrades ONCE at the end to preserve its CB-arm recompute semantics exactly.
  const commitImportTrades=useCallback(async(ts,onProgress)=>{
    const report={saved:[],failed:[],skipped:[]};
    if(!ts||ts.length===0)return report;
    clearTimeout(dbTimers.current.trades);   // cancel any pending debounced full-array autosave so it can't race / reconcile-delete the per-row saves
    // Within-batch dedup by mt5PositionId (MT5 rows only; thus-format rows carry none and are never deduped here).
    const seenPos=new Set();
    const queue=[];
    for(const t of ts){
      const pid=t&&t.mt5PositionId;
      if(pid!=null&&pid!==""){
        if(seenPos.has(pid)){report.skipped.push({id:t&&t.id,mt5PositionId:pid,reason:"duplicate_mt5_position_in_batch"});continue;}
        seenPos.add(pid);
      }
      queue.push(t);
    }
    const saved=[];
    for(let i=0;i<queue.length;i++){
      const t=queue[i];
      if(onProgress)onProgress(i+1,queue.length);
      let res;
      try{res=await saveTradesSerialized(t,{source:"open",affectedTradeId:t.id});}
      catch(e){res={ok:false,error:e};}
      if(res&&res.ok){saved.push(t);report.saved.push(t);}
      else{report.failed.push({id:t&&t.id,mt5PositionId:(t&&t.mt5PositionId)||null,error:((res&&res.error&&res.error.message)||"save failed")});}
    }
    // Local add of ONLY server-confirmed rows — ONE batch so addTrades' CB-arm recompute matches the
    // pre-P2-3 behavior exactly. lastSeenRef.current.tradeIds already holds each saved id (source:"open").
    if(saved.length>0)addTrades(saved);
    return report;
  },[saveTradesSerialized,addTrades]);
  const removeTradeLocal=useCallback(id=>{
    setTrades(p=>{
      const deleted=p.find(x=>x.id===id);
      const next=p.filter(x=>x.id!==id);
      if(deleted&&deleted.status==="open"){
        const stillOpen=next.filter(x=>x.status==="open").length;
        if(stillOpen===0){
          setPortfolio(pf=>pf.cb_armed?{...pf,cb_armed:false,cb_baseline:0,cb_threshold:0}:pf);
        }
      }
      return next;
    });
  },[]);
  const deleteTrade=useCallback(async(id)=>{
    const requestedId=String(id);
    clearTimeout(dbTimers.current.trades);   // cancel queued autosave; the promise chain below waits out any already-running one
    const deleteAfterSaves=async()=>{
      const knownIds=lastSeenRef.current.tradeIds||new Set();
      const onServer=[...knownIds].some(x=>String(x)===requestedId);
      if(!onServer)return{ok:true,localOnly:true,id:requestedId};
      const del=await db.deleteTrades(authUid,[id]);
      const deletedIds=((del&&del.deletedIds)||[]).map(String);
      const deleted=deletedIds.includes(requestedId);
      if(del&&del.ok&&deleted)return{ok:true,id:requestedId};
      return{ok:false,error:(del&&del.error)||new Error("delete did not confirm target row"),result:del,id:requestedId};
    };
    try{
      const prev=(tradesSavePromiseRef.current||Promise.resolve()).catch(()=>{});
      const p=prev.then(async()=>{
        savingRef.current.trades=true;
        try{return await deleteAfterSaves();}
        catch(e){console.warn("[delete] durable delete error",e);return{ok:false,error:e,id:requestedId};}
        finally{savingRef.current.trades=false;}
      });
      tradesSavePromiseRef.current=p;
      const res=await p;
      if(res&&res.ok){
        lastSeenRef.current.tradeIds=new Set([...lastSeenRef.current.tradeIds].filter(x=>String(x)!==requestedId));
        removeTradeLocal(id);
        return res;
      }
      console.warn("[delete] durable delete failed — local state kept",res);
      showToast&&showToast("ลบ trade ไม่สำเร็จ ลองอีกครั้ง","error");
      return res||{ok:false,error:new Error("delete failed"),id:requestedId};
    }catch(e){
      console.warn("[delete] deleteTrade error",e);
      showToast&&showToast("ลบ trade ไม่สำเร็จ ลองอีกครั้ง","error");
      return{ok:false,error:e,id:requestedId};
    }
  },[authUid,removeTradeLocal,showToast]);
  // ── Durable merge (P2-1B) — browser-only, merged-FIRST with marker-based repair. Replaces the
  // old local-only merge (forEach deleteTrade + addTrade) that relied on the full-array autosave.
  // Sequence: (1) cancel any pending debounced autosave so it can't race/resurrect sources;
  // (2) durably save the merged row FIRST (serialized → waits out any in-flight autosave) with
  // mergeDeletePending:true; (3) batch-delete the sources; (4) ONLY on full delete success apply
  // local state using TODAY'S removeTradeLocal+addTrade semantics (identical CB/portfolio behavior) +
  // fix lastSeenRef; (5) best-effort finalize marker (pending:false). Sources are NEVER removed
  // locally before they are durably deleted, so the autosave can never resurrect them. Final-marker
  // failure is non-fatal — repair-on-load finalizes. No db.saveTrade/commit* semantic change; the
  // full-array autosave is left intact. On source-delete failure the merged row is left pending for
  // repair-on-load (it self-completes on next reload by deleting the sources + finalizing).
  const commitMerge=useCallback(async(mergedBase,sourceIds)=>{
    try{
      clearTimeout(dbTimers.current.trades);   // cancel pending full-array autosave so it can't race/resurrect
      const commitId=uid();
      const mergedPending={...mergedBase,durableMergeVersion:1,mergeCommitId:commitId,mergeDeletePending:true};
      // (2) merged-FIRST durable save (source:"open" → serialized chain + registers id in lastSeenRef)
      const r1=await saveTradesSerialized(mergedPending,{source:"open",affectedTradeId:mergedPending.id});
      if(!(r1&&r1.ok)){console.warn("[merge] merged save failed — aborting, no local change",r1&&r1.error);return{ok:false,stage:"merged_save",error:r1&&r1.error};}
      console.log("[merge] durable saved",{id:String(mergedPending.id),commitId});
      // (3) delete sources (direct batch; safe — autosave canceled, local state not yet changed)
      const del=await db.deleteTrades(authUid,sourceIds);
      // Success = the atomic .in() DELETE statement executed (del.ok). Postgres deletes ALL matching
      // rows in ONE statement, so del.ok ⇒ every source that still existed is gone (a requested id
      // absent from deletedIds was already gone — NOT a half-failure). A FAILED statement deletes
      // nothing. We must NOT leave an orphan pending merged on failure: a retry would then mint a
      // second merged row → permanent double-count after repair finalizes the orphan.
      if(!(del&&del.ok)){
        // Clean ABORT + rollback: delete the just-saved merged row and drop it from lastSeenRef so
        // neither a retry nor the autosave reconcile can act on it. Nothing was deleted server-side,
        // so the sources are intact → this reverts to the exact pre-merge state. Retry is then safe.
        const rb=await db.deleteTrades(authUid,[mergedPending.id]);
        lastSeenRef.current.tradeIds=new Set([...lastSeenRef.current.tradeIds].filter(id=>String(id)!==String(mergedPending.id)));
        if(rb&&rb.ok)console.warn("[merge] source delete failed — rolled back merged (clean revert, retry-safe)",{id:String(mergedPending.id),error:del&&del.error});
        // Rollback ALSO failed: the orphan merged persists on the server (sources still intact, since the
        // source delete is what failed). It is NOT auto-reverted this session, but repair-on-load handles it
        // on the next reload — completing it if its sources survived, or DELETING it as a duplicate if a retry
        // already consumed them (sibling-dedup guard). No double-count, no source loss.
        else console.warn("[merge] source delete AND rollback both failed — repair-on-load will reconcile the orphan on next reload; sources intact",{id:String(mergedPending.id)});
        return{ok:false,stage:"source_delete",error:del&&del.error};
      }
      console.log("[merge] sources deleted",{count:((del&&del.deletedIds)||[]).length});
      // (4) apply local state with TODAY'S semantics (removeTradeLocal removes + CB-disarm; addTrade appends + CB-arm)
      const mergedFinal={...mergedPending,mergeDeletePending:false,mergeCompletedAt:new Date().toISOString()};
      sourceIds.forEach(id=>removeTradeLocal(id));
      addTrade(mergedFinal);
      // lastSeenRef coherence: drop source ids (merged id already registered by source:"open" above)
      const srcStr=new Set(sourceIds.map(String));
      lastSeenRef.current.tradeIds=new Set([...lastSeenRef.current.tradeIds].filter(id=>!srcStr.has(String(id))));
      lastSeenRef.current.tradeIds.add(String(mergedFinal.id));
      // (5) best-effort finalize marker on server (non-fatal — repair-on-load finalizes if this fails)
      const r2=await saveTradesSerialized(mergedFinal,{source:"update",affectedTradeId:mergedFinal.id});
      if(r2&&r2.ok)console.log("[merge] finalized",{id:String(mergedFinal.id)});
      else console.warn("[merge] finalize marker save failed — repair-on-load will finalize",r2&&r2.error);
      return{ok:true,id:String(mergedFinal.id)};
    }catch(e){console.warn("[merge] commitMerge error",e);return{ok:false,error:e};}
  },[authUid,saveTradesSerialized,removeTradeLocal,addTrade]);

      <div hidden aria-hidden="true" data-tj-trade-index>

            <NotificationCenter
        history={notifHistory}

        onMarkAllRead={markAllRead}
        onDeleteAll={deleteAllNotifs}

        checkinItems={checkinItems}
        checkinTagMap={checkinTagMap}
        checkinLoading={checkinLoading}
        checkinError={checkinError}
      />
<nav className="bg-card border-b border-border sticky top-0 z-30">

          <div className="flex items-center gap-5">
            <div className="flex items-center gap-2 select-none">
              <div style={{background:"rgba(240,185,11,0.08)",border:"1px solid rgba(240,185,11,0.3)",borderRadius:"8px",padding:"4px 10px"}}>

              </div>
              <button onClick={()=>setShowNotif(v=>!v)}
                className="relative text-muted hover:text-txt transition mr-1"
                title={`Notifications${unreadCount>0?" ("+unreadCount+" ใหม่)":""}`}>

                {unreadCount>0&&(
                  <span className="absolute -top-1 -right-1 min-w-[16px] h-4 rounded-full text-[9px] font-bold flex items-center justify-center text-white px-0.5"
                    style={{background:"#F6465D"}}>
                    {unreadCount>9?"9+":unreadCount}

        </div>
      {mobileMenu&&(
        <div className="md:hidden border-t border-border bg-card">
          <div className="max-w-screen-xl mx-auto px-4 py-2 grid grid-cols-3 gap-1">
            {navItems.map(n=>(
              <button key={n.k}
                onClick={()=>{goPage(n.k);setMobileMenu(false);}}
                className={`py-2.5 px-2 rounded-lg text-sm font-medium transition text-center
                  ${page===n.k?"bg-input text-yellow":"text-muted hover:text-txt hover:bg-input/50"}`}>
                {n.l}
              </button>
            ))}
          </div>
        </div>
      )}
      </nav>

      {cbStatusApp.breached&&(
        <div className="max-w-screen-xl mx-auto px-4 pt-3">
          <div className="bg-red/20 border border-red rounded-xl p-3 text-red text-sm font-bold text-center">
            🚨 CIRCUIT BREAKER — ออกจากไม้ทันที | Threshold {fmtTHB(cbStatusApp.threshold,0)} ฿ | Equity {fmtTHB(cbStatusApp.equity,0)} ฿
          </div>
        </div>
      )}
      {cbStatusApp.armed&&!cbStatusApp.breached&&(
        <div className="max-w-screen-xl mx-auto px-4 pt-3">
          <div className="bg-yellow/10 border border-yellow/40 rounded-xl p-2 text-yellow text-xs text-center">
            ⚡ CB Active — threshold {fmtTHB(cbStatusApp.threshold,0)} ฿ | Equity {fmtTHB(cbStatusApp.equity,0)} ฿
          </div>
        </div>
      )}

      <main className="max-w-screen-xl mx-auto px-4 py-5">
        {page==="positions"&&<PagePositions trades={trades} products={products} productRegistry={productRegistry} balance={balance} portfolio={portfolio} onCommitOpen={commitOpen} onCommitExecuteDraft={commitExecuteDraft} onCommitClose={commitClose} onCommitUpdate={commitUpdateTrade} onCommitMerge={commitMerge} onDeleteTrade={deleteTrade} showConfirm={showConfirm} showToast={showToast} livePrices={livePrices} liveTimestamps={liveTimestampsAll} liveErrors={liveErrorsAll} fetchPricesFn={fetchPrices}/>}
        {page==="journal"  &&<PageJournal   trades={trades} products={products} balance={balance} portfolio={portfolio} onCommitUpdate={commitUpdateTrade} onDeleteTrade={deleteTrade} onCommitImport={commitImportTrades} onProductsChange={setProducts} onBalanceSet={handleImportBalance} onTransactions={handleImportTransactions} showConfirm={showConfirm} showToast={showToast}/>}
        {page==="steps"    &&<PageSteps     trades={trades} products={products} portfolio={portfolio} livePrices={livePrices} onPortfolioChange={setPortfolio} authUid={authUid}/>}
        {page==="dashboard"&&<PageDashboard trades={trades} products={products} balance={balance} portfolio={portfolio}/>}
        {page==="calendar" &&<PageCalendar  trades={trades} products={products} uid={authUid} syncNotesToCloud={syncNotesToCloud}/>}
        {page==="notes"    &&<PageNotes uid={authUid} syncNotesToCloud={syncNotesToCloud} onPatternsChange={handlePatternsChange} initialPatterns={appPatterns}/>}
        {page==="settings" &&<PageSettings portfolio={portfolio} products={products} trades={trades} onPortfolioChange={setPortfolio} onProductsChange={setProducts} showToast={showToast} showConfirm={showConfirm} authUid={authUid}/>}
      </main>

      {pendingWithdrawal>0&&page!=="settings"&&!profitDismissed&&(
        <div className="fixed bottom-5 right-5 z-40 fade-in"
          style={{maxWidth:290,background:"#1E2329",border:"1px solid rgba(240,185,11,0.4)",borderRadius:14,padding:"12px 16px",boxShadow:"0 8px 32px rgba(0,0,0,0.5)"}}>
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <span style={{fontSize:22}}>💰</span>
            <div style={{flex:1}}>
              <div style={{fontSize:11,color:"#848E9C",marginBottom:2}}>Profit Withdrawal</div>
              <div style={{fontSize:15,fontWeight:700,color:"#F0B90B"}}>{fmtTHB(pendingWithdrawal,0)} ฿</div>
              <div style={{fontSize:10,color:"#848E9C"}}>ควรถอนออกจาก port</div>
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:4}}>
              <button onClick={()=>goPage("settings")}
                style={{padding:"4px 10px",borderRadius:7,border:"1px solid rgba(240,185,11,0.4)",background:"rgba(240,185,11,0.12)",color:"#F0B90B",cursor:"pointer",fontSize:11,fontWeight:600}}>
                ถอน
              </button>
              <button onClick={()=>setProfitDismissed(true)}
                style={{padding:"2px 10px",borderRadius:7,border:"1px solid #2B3139",background:"transparent",color:"#848E9C",cursor:"pointer",fontSize:10}}>
                ✕ ปิด
              </button>
            </div>
          </div>
        </div>
      )}
      <ConfirmDialog state={confirmState} onCancel={hideConfirm}/>
      <ToastContainer toasts={toasts} onDismiss={dismissToast}/>
      {showSetup&&<SetupJourney onComplete={completeSetup} products={products} onProductsChange={setProducts} onBalanceSet={handleImportBalance}/>}
    </div>
  );
}

// ─── Supabase Auth ────────────────────────────────────────────────────────────
function useAuth(){
  const[session,setSession]=useState(null);
  const[loading,setLoading]=useState(true);
  useEffect(()=>{
    SUPA.auth.getSession().then(({data})=>{
      setSession(data.session);
      setLoading(false);
    });
    const{data:{subscription}}=SUPA.auth.onAuthStateChange((_e,s)=>setSession(s));
    return()=>subscription.unsubscribe();
  },[]);
  return{session,loading};
}

function AuthScreen(){
  const[mode,setMode]=useState("login");
  const[email,setEmail]=useState("");
  const[pw,setPw]=useState("");
  const[err,setErr]=useState("");
  const[msg,setMsg]=useState("");
  const[busy,setBusy]=useState(false);

  const switchMode=m=>{ setMode(m);setErr("");setMsg(""); };

  const handleAuth=async()=>{
    if(!email||!pw)return;
    setErr("");setMsg("");setBusy(true);
    try{
      if(mode==="login"){
        const{error}=await SUPA.auth.signInWithPassword({email,password:pw});
        if(error)setErr(error.message);
      }else{
        const{error}=await SUPA.auth.signUp({email,password:pw});
        if(error)setErr(error.message);
        else setMsg("ส่งอีเมลยืนยันแล้ว — กรุณาตรวจสอบ inbox");
      }
    }catch(e){setErr(e.message);}
    setBusy(false);
  };

  return(
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"#0B0E11",padding:"16px"}}>
      <div style={{width:"100%",maxWidth:380,background:"#1E2329",borderRadius:16,border:"1px solid #2B3139",padding:"32px 28px"}}>
        <div style={{textAlign:"center",marginBottom:28}}>
          <div style={{background:"rgba(240,185,11,0.08)",border:"1px solid rgba(240,185,11,0.3)",borderRadius:8,padding:"6px 14px",display:"inline-block",marginBottom:8}}>
            <span style={{color:"#F0B90B",fontWeight:800,fontSize:18,letterSpacing:3,fontFamily:"'JetBrains Mono', monospace"}}>THUS</span>
          </div>
          <div style={{fontSize:12,color:"#848E9C"}}>Trading Journal • TFEX</div>
        </div>
        <div style={{display:"flex",background:"#0B0E11",borderRadius:8,padding:3,gap:3,marginBottom:22}}>
          {["login","signup"].map(m=>(
            <button key={m} onClick={()=>switchMode(m)}
              style={{flex:1,padding:"8px 0",borderRadius:6,border:"none",cursor:"pointer",fontSize:13,fontWeight:600,
                background:mode===m?"#F0B90B":"transparent",color:mode===m?"#0B0E11":"#848E9C",transition:"all .18s"}}>
              {m==="login"?"เข้าสู่ระบบ":"สมัครสมาชิก"}
            </button>
          ))}
        </div>
        <div style={{display:"flex",flexDirection:"column",gap:13}}>
          <div>
            <div style={{fontSize:11,color:"#848E9C",marginBottom:5}}>อีเมล</div>
            <input type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="your@email.com"
              style={{width:"100%",padding:"10px 13px",background:"#2B3139",border:"1px solid #3C434E",
                borderRadius:8,color:"#EAECEF",fontSize:14,outline:"none",boxSizing:"border-box"}}/>
          </div>
          <div>
            <div style={{fontSize:11,color:"#848E9C",marginBottom:5}}>รหัสผ่าน</div>
            <input type="password" value={pw} onChange={e=>setPw(e.target.value)} placeholder="••••••••"
              onKeyDown={e=>e.key==="Enter"&&handleAuth()}
              style={{width:"100%",padding:"10px 13px",background:"#2B3139",border:"1px solid #3C434E",
                borderRadius:8,color:"#EAECEF",fontSize:14,outline:"none",boxSizing:"border-box"}}/>
          </div>
          {err&&<div style={{color:"#F6465D",fontSize:12,padding:"8px 11px",background:"rgba(246,70,93,0.1)",borderRadius:6}}>{err}</div>}
          {msg&&<div style={{color:"#0ECB81",fontSize:12,padding:"8px 11px",background:"rgba(14,203,129,0.1)",borderRadius:6}}>{msg}</div>}
          <button onClick={handleAuth} disabled={busy||!email||!pw}
            style={{width:"100%",padding:"11px 0",background:busy||!email||!pw?"#2B3139":"#F0B90B",
              border:"none",borderRadius:8,cursor:busy||!email||!pw?"not-allowed":"pointer",
              fontSize:14,fontWeight:700,color:busy||!email||!pw?"#848E9C":"#0B0E11",transition:"all .18s",marginTop:2}}>
            {busy?"กำลังดำเนินการ...":(mode==="login"?"เข้าสู่ระบบ":"สมัครสมาชิก")}
          </button>
        </div>
        {mode==="login"&&(
          <div style={{textAlign:"center",marginTop:16,fontSize:11,color:"#848E9C"}}>
            ลืมรหัสผ่าน?{" "}
            <button onClick={async()=>{
              if(!email){setErr("กรุณาใส่อีเมลก่อน");return;}
              const{error}=await SUPA.auth.resetPasswordForEmail(email);
              if(error)setErr(error.message);
              else setMsg("ส่งลิงก์รีเซ็ตรหัสผ่านไปที่อีเมลแล้ว");
            }} style={{background:"none",border:"none",color:"#F0B90B",cursor:"pointer",fontSize:11,padding:0}}>
              รีเซ็ตรหัสผ่าน
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

function Root(){
  const{session,loading}=useAuth();
  const handleSignOut=async()=>{ await SUPA.auth.signOut(); };
  // Remove splash overlay once React has mounted
  useEffect(()=>{
    // Delay slightly so any injected content (Netlify badge etc) is covered
    const t=setTimeout(()=>{
      const el=document.getElementById("splash");
      if(el){el.style.transition="opacity 0.15s";el.style.opacity="0";setTimeout(()=>el.remove(),150);}
    },200);
    return()=>clearTimeout(t);
  },[]);
  if(loading)return null;
  if(!session)return <AuthScreen/>;
  return <App session={session} onSignOut={handleSignOut}/>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<Root/>);
</script>
</body>
</html>
