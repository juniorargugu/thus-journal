function Mt5InboxPanel({authUid,products}){
  const[on,setOn]=useState(()=>ls.get(MT5_INBOX_FLAG,false));
  const[loading,setLoading]=useState(false);
  const[rows,setRows]=useState([]);
  const[err,setErr]=useState(null);
  const[loadedAt,setLoadedAt]=useState(null);
  const[view,setView]=useState("needs");   // needs | dismissed | all (local-only triage view)
  const[dismissed,setDismissed]=useState(()=>{const a=ls.get(MT5_DISMISSED_KEY,[]);return new Set(Array.isArray(a)?a.map(String):[]);});
  // Local-only: flip a row's dismissed state and persist to localStorage. No network, no DB, no RPC.
  const toggleDismiss=(key)=>{setDismissed(prev=>{const next=new Set(prev);if(next.has(key))next.delete(key);else next.add(key);ls.set(MT5_DISMISSED_KEY,Array.from(next));return next;});};
  const[preview,setPreview]=useState(()=>{const o=ls.get(MT5_PREVIEW_KEY,{});return(o&&typeof o==="object"&&!Array.isArray(o))?o:{};});
  // Local-only: set/clear a row's PREVIEW product. Persists to localStorage. No network, no DB, no draft.
  const setRowPreview=(key,product_id,label)=>{setPreview(prev=>{const next={...prev,[key]:{product_id:(product_id===undefined?null:product_id),label:label||"",saved_at:new Date().toISOString()}};ls.set(MT5_PREVIEW_KEY,next);return next;});};
  const clearRowPreview=(key)=>{setPreview(prev=>{const next={...prev};delete next[key];ls.set(MT5_PREVIEW_KEY,next);return next;});};

  const load=async()=>{
    if(!authUid){setRows([]);return;}   // effect guards this; reload button is no-op without a uid
    setLoading(true);setErr(null);
    const res=await db.loadMt5Staging(authUid);
    setLoading(false);
    if(res&&res.ok){setRows(res.rows||[]);setLoadedAt(new Date());}
    else{setErr((res&&res.error)||"load failed");setRows([]);}
  };

  // Load ONLY when the flag is ON and we have a uid. Flag OFF (or no uid) → no query fires at all.
  useEffect(()=>{
    if(on&&authUid){load();}
    else{setRows([]);setErr(null);setLoadedAt(null);}
  },[on,authUid]);

  const toggle=()=>{const v=!on;ls.set(MT5_INBOX_FLAG,v);setOn(v);};

  // Derived (read-only): view-filtered sections; summary + openIds from ALL loaded rows (stable across views).
  const isDismissed=(r)=>dismissed.has(_mt5RowKey(r));
  const viewRows=rows.filter(r=>view==="all"?true:(view==="dismissed"?isDismissed(r):!isDismissed(r)));
  const openRows=viewRows.filter(r=>_mt5Bucket(r)==="open").slice().sort((a,b)=>_mt5OpenSortKey(b)-_mt5OpenSortKey(a));
  const closedRows=viewRows.filter(r=>_mt5Bucket(r)==="closed").slice().sort((a,b)=>_mt5ClosedSortKey(b)-_mt5ClosedSortKey(a));
  const otherRows=viewRows.filter(r=>_mt5Bucket(r)==="other").slice().sort((a,b)=>_mt5TimeKey(b.mt5_time)-_mt5TimeKey(a.mt5_time));
  const openIds=new Set(rows.filter(r=>_mt5Bucket(r)==="open").map(r=>String(r.position_id)).filter(x=>x&&x!=="null"&&x!=="undefined"));
  const needsMappingCount=rows.filter(r=>r.state==="needs_mapping").length;
  const noProductCount=rows.filter(r=>_mt5NoProduct(r)).length;
  const accounts=Array.from(new Set(rows.map(r=>_mt5MaskAccount(r.source_account))));
  const dismissedCount=rows.filter(isDismissed).length;
  const needsActionCount=rows.length-dismissedCount;
  const previewCount=rows.filter(r=>preview[_mt5RowKey(r)]).length;

  const renderSection=(title,secRows)=>(
    <div className="mb-3">
      <div className="text-xs font-semibold text-txt mb-1.5">{title} <span className="text-muted font-normal">({secRows.length})</span></div>
      {secRows.length===0
        ? <div className="text-[11px] text-muted bg-input/20 rounded px-2 py-1.5">— ไม่มี —</div>
        : <div className="space-y-2">{secRows.map(r=><Mt5InboxRow key={r.id} r={r} openIds={openIds} dismissed={isDismissed(r)} onToggleDismiss={()=>toggleDismiss(_mt5RowKey(r))} products={products} preview={preview[_mt5RowKey(r)]} onSetPreview={(pid,label)=>setRowPreview(_mt5RowKey(r),pid,label)} onClearPreview={()=>clearRowPreview(_mt5RowKey(r))}/>)}</div>}
    </div>
  );

  return(
    <section className="bg-card border border-border rounded-xl p-5">
      <div className="flex items-center justify-between mb-2">
        <h2 className="font-semibold text-txt">🧪 MT5 Inbox <span className="text-muted text-xs font-normal">— diagnostic, read-only</span></h2>
        <button onClick={toggle} className={clsBtn(on?"yellow":"ghost","sm")}>{on?"ON":"OFF"}</button>
      </div>
      <div className="text-xs text-muted mb-3 leading-relaxed">
        Read-only MT5 mirror — not Journal trades. Rows need mapping before they could ever become a trade.<br/>
        ข้อมูลจาก MT5 แบบอ่านอย่างเดียว — ยังไม่ใช่เทรดใน Journal
      </div>
      {!on&&(
        <div className="text-xs text-muted bg-input/30 rounded-lg px-3 py-2">
          ปิดอยู่ (diagnostic). กดปุ่ม <span className="text-txt font-medium">OFF→ON</span> ด้านบนเพื่อดูแถว staging จาก MT5 แบบอ่านอย่างเดียว (ไม่มีการเขียนข้อมูล).
        </div>
      )}
      {on&&!authUid&&(
        <div className="text-xs text-muted bg-input/30 rounded-lg px-3 py-2">
          ต้อง sign in ก่อน — ไม่มี auth session จึงไม่ดึงข้อมูล (RLS SELECT-own). No query is sent.
        </div>
      )}
      {on&&authUid&&(
        <div>
          <div className="flex items-center justify-between mb-3 text-xs">
            <span className="text-muted">
              {loading?"กำลังโหลด…":`${rows.length} row(s)`}
              {loadedAt&&!loading?` · loaded ${fmtTime(loadedAt)}`:""}
            </span>
            <button onClick={load} disabled={loading} className={clsBtn("ghost","sm")}>↻ Reload</button>
          </div>
          {err&&(
            <div className="text-xs text-red bg-red/10 border border-red/20 rounded-lg px-3 py-2 mb-3">
              Could not load MT5 staging rows. <button onClick={load} className="underline ml-1">Try again</button>
            </div>
          )}
          {!err&&!loading&&rows.length===0&&(
            <div className="text-xs text-muted bg-input/30 rounded-lg px-3 py-2">
              No MT5 staging rows found for this user. The local writer mirrors MT5 open positions / closed deals here (read-only).
            </div>
          )}
          {!err&&rows.length>0&&(
            <div>
              <div className="flex flex-wrap gap-x-3 gap-y-1 text-[11px] text-muted mb-2 bg-input/20 rounded-lg px-3 py-2">
                <span>total <b className="text-txt">{rows.length}</b></span>
                <span>open <b className="text-txt">{openRows.length}</b></span>
                <span>close/partial <b className="text-txt">{closedRows.length}</b></span>
                {otherRows.length>0&&<span>other <b className="text-txt">{otherRows.length}</b></span>}
                <span>needs_mapping <b className="text-txt">{needsMappingCount}</b></span>
                <span>no product <b className="text-txt">{noProductCount}</b></span>
                <span>needs action <b className="text-txt">{needsActionCount}</b></span>
                <span>dismissed <b className="text-txt">{dismissedCount}</b></span>
                <span>local previews <b className="text-txt">{previewCount}</b></span>
                <span>accounts <b className="text-txt">{accounts.join(", ")}</b></span>
              </div>
              <div className="text-[11px] text-muted mb-3">Read-only mirror of MT5 — nothing here is a trade in your journal.</div>
              <div className="flex flex-wrap items-center gap-1.5 mb-2">
                <button onClick={()=>setView("needs")} className={clsBtn(view==="needs"?"yellow":"ghost","sm")}>Needs action ({needsActionCount})</button>
                <button onClick={()=>setView("dismissed")} className={clsBtn(view==="dismissed"?"yellow":"ghost","sm")}>Dismissed ({dismissedCount})</button>
                <button onClick={()=>setView("all")} className={clsBtn(view==="all"?"yellow":"ghost","sm")}>All ({rows.length})</button>
              </div>
              <div className="text-[11px] text-muted mb-3">Dismiss is local-only. It does not change MT5, Supabase, or Journal.</div>
              {renderSection("📂 Open MT5 positions",openRows)}
              {renderSection("✅ Closed MT5 deals",closedRows)}
              {otherRows.length>0&&renderSection("• Other staging rows",otherRows)}
            </div>
          )}
        </div>
      )}
    </section>
  );
}

function PageSettings({portfolio,products,trades,onPortfolioChange,onProductsChange,showToast,showConfirm,authUid}){
  const[txModal,setTxModal]=useState(null);
  // Journal AI-key feature deprecated 2026-05-12: old mentor-note AI route
  // (NoteFormModal "✨ ให้ AI ช่วย") was unreliable and encouraged plaintext
  // API-key storage in localStorage. Settings input was never wired into JSX
  // (state was declared but no consumer existed). Removed dead state. One-time
  // local cleanup of any stale tj_ai_key value runs on PageSettings mount.
  useEffect(()=>{try{localStorage.removeItem("tj_ai_key");}catch{}},[]);
  const[sheetsUrl,setSheetsUrl]=useState(()=>sheetsSync.getUrl());
  const[sheetsStatus,setSheetsStatus]=useState(null);
  const[sheetsSyncing,setSheetsSyncing]=useState(false);
  const handleSheetsSync=async()=>{
    sheetsSync.setUrl(sheetsUrl);
    setSheetsSyncing(true);setSheetsStatus(null);
    const res=await sheetsSync.push(trades,products,portfolio,balance,null);
    setSheetsSyncing(false);
    setSheetsStatus(res.ok?`OK — sync ${res.count} positions`:`Error: ${res.err}`);
  };
  const[editProduct,setEditProduct]=useState(null);
  const[editField,setEditField]=useState({});
  const[addMode,setAddMode]=useState(false);
  const[showWithdrawModal,setShowWithdrawModal]=useState(false);
  const txBalance=portfolio.transactions.reduce((s,t)=>s+(t.type==="deposit"?t.amount:-(t.amount)),0);
  const totalDeposited=portfolio.transactions.filter(t=>t.type==="deposit").reduce((s,t)=>s+t.amount,0);
  const totalWithdrawals=portfolio.transactions.filter(t=>t.type!=="deposit").reduce((s,t)=>s+t.amount,0);

  const realizedPL=useMemo(()=>(trades||[]).filter(t=>t.status==="closed").reduce((s,t)=>{
    const p=resolveProduct(products||[],t.productId);
    return s+tradeNetPL(t,p);
  },0),[trades,products]);

  const balance=txBalance+realizedPL;

  const withdrawalTarget=portfolio?.withdrawalTarget??0.10;
  const targetWithdrawal=Math.max(0,calcWinningPL(trades, products)*withdrawalTarget);
  const totalWithdrawn=portfolio.transactions.filter(t=>t.type==="profit_withdrawal").reduce((s,t)=>s+t.amount,0);
  const pendingWithdrawal=Math.max(0,targetWithdrawal-totalWithdrawn);

  const handleTx=(tx)=>{onPortfolioChange({...portfolio,transactions:[...portfolio.transactions,tx]});setTxModal(null);};
  const handleDeleteTx=(id,label)=>{showConfirm({title:`ลบ ${label||"รายการ"}?`,message:"ไม่สามารถกู้คืนได้",variant:"danger",onConfirm:()=>onPortfolioChange({...portfolio,transactions:portfolio.transactions.filter(t=>t.id!==id)})});};
  const saveProduct=()=>{
    if(addMode){
      const np={...editField,id:"p_"+uid(),contractSize:+editField.contractSize,tickSize:+editField.tickSize,tickValue:+editField.tickValue,digits:+editField.digits||1,initialMargin:+editField.initialMargin||0,commissionPerLeg:+editField.commissionPerLeg||100};
      onProductsChange([...products,np]);
      setAddMode(false);setEditField({});return;
    }
    if(!editProduct)return;
    onProductsChange(products.map(p=>p.id===editProduct.id?{...p,...editField}:p));
    setEditProduct(null);setEditField({});
  };
  const setRate=(r)=>onPortfolioChange({...portfolio,withdrawalTarget:r});
  const breakevenPct=portfolio?.breakevenPct??1.0;
  const setBreakevenPct=(v)=>onPortfolioChange({...portfolio,breakevenPct:v});

  return(
    <div className="space-y-6 max-w-4xl">
      <section className="bg-card border border-border rounded-xl p-5">
        <div className="flex items-center justify-between mb-4">
          <h2 className="font-semibold text-txt">Portfolio</h2>
          <div className="flex gap-2">
            <button onClick={()=>setTxModal("deposit")} className={clsBtn("green","sm")}>+ ฝากเงิน</button>
            <button onClick={()=>setTxModal("withdraw")} className={clsBtn("red","sm")}>− ถอนเงิน</button>
          </div>
        </div>
        <div className="bg-input/40 rounded-xl px-4 py-3 mb-4">
          <div className="flex items-center justify-between">
            <span className="text-muted text-sm">Current Balance</span>
            <span className="text-xl font-bold text-txt">{fmtTHB(balance,0)} ฿</span>
          </div>
          <div className="flex flex-wrap gap-x-4 gap-y-1 mt-2 text-xs text-muted">
            <span>ฝากรวม: <span className="text-green tabular-nums">+{fmtTHB(totalDeposited,0)} ฿</span></span>
            {totalWithdrawals>0&&<span>ถอนรวม: <span className="text-red tabular-nums">−{fmtTHB(totalWithdrawals,0)} ฿</span></span>}
            <span>ทุนสุทธิ: <span className="text-txt tabular-nums">{fmtTHB(txBalance,0)} ฿</span></span>
            <span>Realized P/L: <span className={`tabular-nums font-medium ${realizedPL>=0?"text-green":"text-red"}`}>{realizedPL>=0?"+":""}{fmtTHB(realizedPL,0)} ฿</span></span>
          </div>
        </div>
        <div className="overflow-x-auto">
          <table className="w-full text-sm">
            <thead><tr className="border-b border-border text-muted text-xs">
              <th className="pb-2 text-left">Date</th><th className="pb-2 text-left">Type</th>
              <th className="pb-2 text-right">Amount</th><th className="pb-2 text-left px-3">Note</th><th></th>
            </tr></thead>
            <tbody>
              {[...portfolio.transactions].reverse().map(tx=>{
                const isProfit=tx.type==="profit_withdrawal";
                const isDeposit=tx.type==="deposit";
                return(
                  <tr key={tx.id} className="border-b border-border/30">
                    <td className="py-2 text-muted text-xs">{fmtDate(tx.date)}</td>
                    <td className="py-2 space-x-1"><span className={`px-2 py-0.5 rounded text-xs font-semibold ${isDeposit?"bg-green/10 text-green":isProfit?"bg-yellow/10 text-yellow":"bg-red/10 text-red"}`}>
                      {isDeposit?"ฝาก":isProfit?"ถอนกำไร":"ถอน"}

                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </section>

      
      <section className="bg-card border border-border rounded-xl p-5">
        <div className="flex items-center justify-between mb-4">
          <h2 className="font-semibold text-txt">💰 Profit Withdrawal Tracker</h2>

        </div>
        <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4">

function useTFEXMarketStatus(){
  const HOLIDAYS=["01-01","06-04","13-04","14-04","15-04","01-05","05-05","28-07","12-08","23-10","05-12","10-12","31-12"];
  const getStatus=(now)=>{
    const bkk=new Date(now.toLocaleString("en-US",{timeZone:"Asia/Bangkok"}));
    const dow=bkk.getDay();
    if(dow===0||dow===6)return{isOpen:false,sessionName:null,nextOpen:null,holiday:true};
    const mmdd=String(bkk.getMonth()+1).padStart(2,"0")+"-"+String(bkk.getDate()).padStart(2,"0");
    if(HOLIDAYS.includes(mmdd))return{isOpen:false,sessionName:null,nextOpen:null,holiday:true};
    const hm=bkk.getHours()*60+bkk.getMinutes();
    if(hm>=18*60+50||hm<3*60){
      const nextDay=new Date(bkk);
      if(hm>=18*60+50)nextDay.setDate(nextDay.getDate()+1);
      const nextDow=nextDay.getDay();
      const nextMmdd=String(nextDay.getMonth()+1).padStart(2,"0")+"-"+String(nextDay.getDate()).padStart(2,"0");
      if(nextDow===0||nextDow===6||HOLIDAYS.includes(nextMmdd))return{isOpen:false,sessionName:null,nextOpen:"09:45",holiday:false};
      return{isOpen:true,sessionName:"ดึก",nextOpen:null,holiday:false};
    }
    if(hm>=9*60+45&&hm<12*60+30)return{isOpen:true,sessionName:"เช้า",nextOpen:null,holiday:false};
    if(hm>=13*60+45&&hm<16*60+55)return{isOpen:true,sessionName:"บ่าย",nextOpen:null,holiday:false};
    if(hm<9*60+45)return{isOpen:false,sessionName:null,nextOpen:"09:45",holiday:false};
    if(hm>=12*60+30&&hm<13*60+45)return{isOpen:false,sessionName:null,nextOpen:"13:45",holiday:false};
    if(hm>=16*60+55&&hm<18*60+50)return{isOpen:false,sessionName:null,nextOpen:"18:50",holiday:false};
    return{isOpen:false,sessionName:null,nextOpen:"09:45",holiday:false};
  };
  const[status,setStatus]=useState(()=>getStatus(new Date()));
  useEffect(()=>{
    const tick=()=>setStatus(getStatus(new Date()));
    const t=setInterval(tick,30000);
    return()=>clearInterval(t);
  },[]);
  return status;
}

function SetupJourney({onComplete,products,onProductsChange,onBalanceSet}){
  const[step,setStep]=useState(0);
  // Step 0: Welcome  Step 1: Balance  Step 2: Products
  const TOTAL=4;

  // Balance step state
  const today=new Date();
  const yesterday=new Date(today);yesterday.setDate(today.getDate()-1);
  const defDate=yesterday.toISOString().slice(0,10);

  const[seriesEdits,setSeriesEdits]=useState(()=>{

  function handleBalanceNext(){
    var n=parseFloat(String(balAmt).replace(/,/g,""));
    if(n>0&&!balanceSavedRef.current){

      onBalanceSet&&onBalanceSet({amount:n,date:txDate});
      balanceSavedRef.current=true;
    }
    setStep(2);
  }

  function handleProductSave(){
    onProductsChange&&onProductsChange(function(prev){
      return prev.map(function(p){
        if(p._isLegacy)return p;
        var newComm=parseFloat(comms[p.id]);
        var newSeries=seriesEdits[p.id]||p.series||"";
        var CYCLE=["H","M","U","Z"];
        var newContract=p.baseSymbol+newSeries;
        var ni=(CYCLE.indexOf(newSeries[0])+1)%4;
        var yy=newSeries.slice(1);
        var ny=ni===0?(+yy+1)%100:"";
        var nextSer=CYCLE[ni]+(ni===0?String(ny).padStart(2,"0"):yy);
        var nextContract=p.baseSymbol+nextSer;
        var out={...p,series:newSeries,currentContract:newContract,nextContract:nextContract};
        if(!isNaN(newComm)&&newComm>=0)out.commissionPerLeg=newComm;
        return out;
      });
    });
  }

  function finish(){
    handleProductSave();
    onComplete();
  }

  var stepContent=[renderStep0,renderStep1,renderStep2,renderStep3];

        </div>
      </div>
    </div>
  );
}

// DEPRECATED 2026-05-12: Journal AI-mentor-note route. The "✨ ให้ AI ช่วย"
// button in NoteFormModal was removed in the same patch. This function and the
// surrounding aiLoading/aiResult/aiError state in NoteFormModal are now dead
// code, kept for one release to make rollback trivial. Do not re-wire without
// a security review — calling Anthropic from the browser requires an api key
// stored in plaintext localStorage, which is exactly what we are getting rid of.
async function aiProcessNote(rawText,existingTags,apiKey){
  const tagList=existingTags.join(", ")||"#mindset, #risk, #entry, #rule, #psychology";
  const res=await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",
    headers:{"Content-Type":"application/json","x-api-key":apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
    body:JSON.stringify({
      model:"claude-sonnet-4-20250514",
      max_tokens:600,
      messages:[{role:"user",content:`You are a trading knowledge assistant for a Thai TFEX trader.
Process this raw note and return ONLY valid JSON (no markdown, no extra text):
{
  "type": "quote or rule or lesson or idea",
  "content": "refined clear actionable version (Thai or English matching original, 1-3 sentences)",
  "source": "extracted source name if mentioned, else empty string",
  "tags": ["#tag1","#tag2"],
  "reasoning": "one line explanation"
}

Rules:
- type "quote" = from book/person, "rule" = trading rule, "lesson" = personal experience, "idea" = hypothesis
- content must be concise and actionable
- max 4 tags, reuse from existing when appropriate: ${tagList}
- tags must start with #

Raw note: "${rawText}"`}]
    })
  });
  if(!res.ok)throw new Error("API Error: "+res.status);
  const data=await res.json();
  const text=data.content?.[0]?.text||"";
  const clean=text.replace(/```json|```/g,"").trim();
  return JSON.parse(clean);
}

function MarketPatternModal({pattern,onSave,onCancel}){

  const[action,setAction]=useState(pattern?.action||"");

        <div><Label>บทเรียน</Label><textarea value={lesson} onChange={e=>setLesson(e.target.value)} rows={2} placeholder="เช่น: มักตาม heavy sell-off" className="w-full bg-input border border-border rounded-lg px-3 py-2 text-sm text-txt mt-1 resize-none"/></div>
        <div><Label>Action *</Label><textarea value={action} onChange={e=>setAction(e.target.value)} rows={2} placeholder="เช่น: ลด size 50%" className="w-full bg-input border border-border rounded-lg px-3 py-2 text-sm text-txt mt-1 resize-none"/></div>

}
function PageNotes({uid,syncNotesToCloud,onPatternsChange,initialPatterns}){
  const[notes,setNotes]=useState(()=>{
    const saved=ls.get("tj_notes",null);
    return saved||STARTER_NOTES;
  });
  const[search,setSearch]=useState("");
  const[activeTag,setActiveTag]=useState(null);
  const[sortMode,setSortMode]=useState("newest");
  const[showForm,setShowForm]=useState(false);
  const[editNote,setEditNote]=useState(null);
  const[randomNote,setRandomNote]=useState(null);
  const[patterns,setPatterns]=useState(()=>initialPatterns||ls.get("tj_patterns",[]));
  const[showPM,setShowPM]=useState(false);
  const[editP,setEditP]=useState(null);
  function savePat(p){const u=editP?patterns.map(x=>x.id===p.id?p:x):[p,...patterns];setPatterns(u);ls.set("tj_patterns",u);if(onPatternsChange)onPatternsChange(u);setShowPM(false);setEditP(null);}
  function delPat(id){const u=patterns.filter(x=>x.id!==id);setPatterns(u);ls.set("tj_patterns",u);if(onPatternsChange)onPatternsChange(u);}

  useEffect(()=>{
    if(notes.length>0){
      const idx=Math.floor(Math.random()*notes.length);
      setRandomNote(notes[idx]);
    }
  },[]);

  // Skip the first fire on PageNotes mount: hydration already wrote LS and
  // cloud is already in sync, so the initial fire was a redundant write per
  // ROADMAP P3 (deferred until 2026-05-12).
  const notesDidMountRef=useRef(false);
  useEffect(()=>{
    if(!notesDidMountRef.current){notesDidMountRef.current=true;return;}
    ls.set("tj_notes",notes);
    if(syncNotesToCloud)syncNotesToCloud(notes,ls.get("tj_daily_notes",{}));
  },[notes]);

  const saveNote=(n)=>{
    if(editNote){
      setNotes(p=>p.map(x=>x.id===n.id?n:x));

    setShowForm(false);setEditNote(null);

  const deleteNote=(id)=>setNotes(p=>p.filter(x=>x.id!==id));
  const reviewNote=(id)=>{
    setNotes(p=>p.map(x=>x.id===id?{...x,reviewCount:(x.reviewCount||0)+1,lastReviewed:new Date().toISOString().slice(0,10)}:x));
    const remaining=notes.filter(x=>x.id!==id);

  const allTags=useMemo(()=>{
    const m={};
    notes.forEach(n=>(n.tags||[]).forEach(t=>{m[t]=(m[t]||0)+1;}));

  const filtered=useMemo(()=>{
    let r=[...notes];
    if(search)r=r.filter(n=>n.content.toLowerCase().includes(search.toLowerCase())||

function PageCalendar({trades,products,uid,syncNotesToCloud}){
  const PROD_COLORS={gold:"#F0B90B",s50:"#3B82F6",silver:"#9CA3AF",usdjpy:"#8B5CF6"};
  const[calMode,setCalMode]=useState("heatmap");
  const[calLightbox,setCalLightbox]=useState(null);
  const[calMonth,setCalMonth]=useState(()=>{
    const n=new Date();
    return n.getFullYear()+"-"+String(n.getMonth()+1).padStart(2,"0");
  });
  const[calTooltip,setCalTooltip]=useState(null);
  const[dailyNotes,setDailyNotes]=useState(()=>ls.get("tj_daily_notes",{}));
  const[noteModal,setNoteModal]=useState(null);
  const[ganttDetail,setGanttDetail]=useState(null);

  const saveDailyNote=(dateKey,mood,note)=>{
    if(!mood){
      const updated={...dailyNotes};
      delete updated[dateKey];
      setDailyNotes(updated);
      ls.set("tj_daily_notes",updated);
      if(syncNotesToCloud)syncNotesToCloud(ls.get("tj_notes",[]),updated);
    }else{
      const updated={...dailyNotes,[dateKey]:{mood,note}};
      setDailyNotes(updated);
      ls.set("tj_daily_notes",updated);
      if(syncNotesToCloud)syncNotesToCloud(ls.get("tj_notes",[]),updated);
    }
  };

  const changeMonth=(delta)=>{
    const parts=calMonth.split("-"),yr=+parts[0],mo=+parts[1];
    const d=new Date(yr,mo-1+delta,1);
    setCalMonth(d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"));
  };

  const calData=useMemo(()=>{
    const m={};
    (trades||[]).forEach(t=>{
      const prod=resolveProduct(products||[],t.productId);
      // closed trades
      if(t.status==="closed"&&t.exitDateTime){
        const net=calcNetPL(prod,t.contracts,t.entryPrice,t.exitPrice,t.direction);
        const d=t.exitDateTime.slice(0,10);
        if(!m[d])m[d]={pnl:0,count:0};
        m[d].pnl+=net;m[d].count++;
      }
      // partial closes from merged open trades
      (t.partialCloses||[]).forEach(pc=>{
        if(!pc.exitDateTime||!pc.exitPrice)return;
        const net=calcNetPL(prod,pc.contracts,t.entryPrice,pc.exitPrice,t.direction);
        const d=pc.exitDateTime.slice(0,10);
        if(!m[d])m[d]={pnl:0,count:0};
        m[d].pnl+=net;m[d].count++;
      });
    });
    return m;
  },[trades,products]);

  const parts=calMonth.split("-"),yr=+parts[0],moNum=+parts[1];
  const days=new Date(yr,moNum,0).getDate();
  const first=new Date(yr,moNum-1,1).getDay();
  const maxPnl=Math.max(...Object.values(calData).map(v=>Math.abs(v.pnl)),1);
  const moName=new Date(yr,moNum-1,1).toLocaleDateString("th-TH",{month:"long",year:"numeric"});
  const cells=Array.from({length:days},(_,i)=>{
    const d=String(i+1).padStart(2,"0");
    const k=calMonth+"-"+d;
    return{day:i+1,key:k,data:calData[k]||null};
  });
  const moPnl=cells.reduce((s,c)=>s+(c.data?c.data.pnl:0),0);
  const moTrades=cells.reduce((s,c)=>s+(c.data?c.data.count:0),0);
  const today=new Date().toISOString().slice(0,10);

  const moStartStr=calMonth+"-01";
  const moEndStr=calMonth+"-"+String(days).padStart(2,"0");
  const timelineTrades=useMemo(()=>(trades||[]).filter(t=>{
    if(!t.openDateTime)return false;
    const tStart=t.openDateTime.slice(0,10);
    const tEnd=t.status==="open"?today:(t.exitDateTime?.slice(0,10)||today);
    return tStart<=moEndStr&&tEnd>=moStartStr;
  }),[trades,calMonth,today]);

  return(
    <div className="space-y-4">
      <div className="bg-card border border-border rounded-xl p-4">
        <div className="flex items-center justify-between flex-wrap gap-3">
          <div className="flex items-center gap-3">
            <div className="flex rounded-lg overflow-hidden border border-border text-xs">
              <button onClick={()=>setCalMode("heatmap")}
                className={`px-3 py-1.5 font-medium transition
                  ${calMode==="heatmap"?"bg-yellow text-black":"text-muted hover:text-txt hover:bg-input"}`}>
                🔥 Heatmap
              </button>
              <button onClick={()=>setCalMode("timeline")}
                className={`px-3 py-1.5 font-medium transition
                  ${calMode==="timeline"?"bg-yellow text-black":"text-muted hover:text-txt hover:bg-input"}`}>
                📊 Timeline
              </button>
            </div>
            {calMode==="heatmap"&&moTrades>0&&(
              <span className={"text-sm font-semibold tabular-nums "+(moPnl>=0?"text-green":"text-red")}>
                {moPnl>=0?"+":""}{fmtTHB(moPnl,0)} ฿ · {moTrades}t
              </span>
            )}
          </div>
          <div className="flex items-center gap-2">
            <button onClick={()=>changeMonth(-1)} className="w-8 h-8 rounded-lg bg-input hover:bg-input/80 text-muted hover:text-txt flex items-center justify-center transition">‹</button>
            <span className="font-semibold min-w-[120px] text-center">{moName}</span>
            <button onClick={()=>changeMonth(1)} className="w-8 h-8 rounded-lg bg-input hover:bg-input/80 text-muted hover:text-txt flex items-center justify-center transition">›</button>
            <button onClick={()=>setCalMonth(()=>{const n=new Date();return n.getFullYear()+"-"+String(n.getMonth()+1).padStart(2,"0");})}
              className="px-2.5 py-1.5 rounded-lg bg-input hover:bg-input/80 text-muted hover:text-txt text-xs transition">
              วันนี้
            </button>
          </div>
        </div>
      </div>

      <div className="bg-card border border-border rounded-xl p-5">
        {calMode==="heatmap"&&(
          <>
            <div className="border border-border/30 rounded-xl overflow-hidden">
            <div className="grid grid-cols-7">
              {["อา","จ","อ","พ","พฤ","ศ","ส"].map(d=>(
                <div key={d} className="py-1 text-center text-muted text-[10px] font-medium border-r border-b border-border/20 last:border-r-0">{d}</div>
              ))}
              {Array.from({length:first},(_,i)=><div key={"e"+i}/>)}
              {cells.map(cell=>{
                const{day,key:k,data}=cell;
                const has=!!data,profit=data&&data.pnl>0;
                const intensity=has?Math.min(1.0,0.35+Math.abs(data.pnl)/maxPnl*0.65):0;
                const bg=has?(profit?"rgba(14,203,129,"+intensity+")":"rgba(246,70,93,"+intensity+")"):"#1E2329";
                const isToday=k===today;
                const dn=dailyNotes[k];
                const isSelected=calTooltip&&calTooltip.key===k;
                return(
                  <div key={k}
                    onClick={()=>{
                      if(k>today)return;
                      setCalTooltip({key:k,day,data:data||null});
                    }}
                    className={"relative aspect-square flex flex-col items-center justify-center gap-0 cursor-pointer select-none border-r border-b border-border/20 "
                      +(isToday?"ring-2 ring-inset ring-yellow/60 ":"")
                      +(isSelected?"ring-2 ring-inset ring-white/30 ":"")}
                    style={{background:bg,minHeight:"44px"}}>
                    <span className="text-xs font-semibold leading-tight"
                      style={{color:has?"#EAECEF":"#4B5563"}}>{day}</span>
                    {data&&(
                      <span className="text-[9px] font-bold tabular-nums leading-tight mt-0.5"
                        style={{color:"#FFFFFF",textShadow:"0 1px 2px rgba(0,0,0,0.7)"}}>
                        {data.pnl>=0?"+":""}{fmtTHB(data.pnl,0)}
                      </span>
                    )}
                    {data&&data.count>1&&(
                      <span className="text-[8px] leading-none text-white/70">{data.count} ไม้</span>
                    )}
                    {dn&&(
                      <span className="absolute bottom-0.5 right-0.5 text-[9px] leading-none">{dn.mood}</span>
                    )}
                    {!data&&!dn&&(
                      <span className="absolute bottom-0.5 right-0.5 text-[8px] text-border/60 leading-none">+</span>
                    )}
                  </div>
                );
              })}
            </div>
            </div>

            {calTooltip&&(
              <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-4"
                style={{background:"rgba(11,14,17,0.7)",backdropFilter:"blur(2px)"}}
                onClick={e=>{if(e.target===e.currentTarget)setCalTooltip(null);}}>
                <div className="bg-card border border-border rounded-2xl w-full max-w-sm shadow-2xl fade-in">
                  <div className="flex items-center justify-between px-4 pt-4 pb-2 border-b border-border/40">
                    <span className="font-semibold text-sm">{calTooltip.key}</span>
                    <button onClick={()=>setCalTooltip(null)} className="text-muted hover:text-txt text-lg leading-none">✕</button>
                  </div>
                  <div className="p-4 space-y-3 overflow-y-auto max-h-[70vh]">
                    {(()=>{
                      const selectedDate=calTooltip.key;
                      const isActiveOnDate=(t,dateStr)=>{
                        const openDate=(t.openDateTime||t.entryDate||"").slice(0,10);
                        const closeDate=t.exitDateTime?t.exitDateTime.slice(0,10):"9999-12-31";
                        return openDate<=dateStr&&dateStr<=closeDate;
                      };
                      const dayTrades=(trades||[]).filter(t=>isActiveOnDate(t,selectedDate));
                      const closedToday=dayTrades.filter(t=>t.status==="closed"&&t.exitDateTime?.startsWith(selectedDate));
                      const activePositions=dayTrades.filter(t=>t.status==="open"||!t.exitDateTime?.startsWith(selectedDate));
                      const w=closedToday.filter(t=>{const p=resolveProduct(products||[],t.productId);return t.exitPrice!=null&&calcNetPL(p,t.contracts,t.entryPrice,t.exitPrice,t.direction)>0;}).length;
                      const l=closedToday.filter(t=>t.exitPrice!=null).length-w;

                      const renderTradeCard=(t)=>{
                        const p=resolveProduct(products||[],t.productId);
                        const netPL=t.exitPrice!=null?calcNetPL(p,t.contracts,t.entryPrice,t.exitPrice,t.direction):null;
                        const isWin=netPL!=null&&netPL>0;
                        const isOpen=t.exitPrice==null;
                        return(
                          <div key={t.id} className={"border rounded-xl p-2.5 "+(isOpen?"border-yellow/20 bg-yellow/5":isWin?"border-green/20 bg-green/5":"border-red/20 bg-red/5")}>
                            <div className="flex items-center gap-2">
                              {isOpen
                                ?<span className="text-[10px] font-bold px-1.5 py-0.5 rounded-full bg-yellow/20 text-yellow shrink-0">OPEN</span>
                                :isWin
                                  ?<span className="text-[10px] font-bold px-1.5 py-0.5 rounded-full bg-green/20 text-green shrink-0">WIN</span>
                                  :<span className="text-[10px] font-bold px-1.5 py-0.5 rounded-full bg-red/20 text-red shrink-0">LOSS</span>
                              }
                              <span className="font-semibold text-xs text-txt">{t.contractCode||p?.currentContract||t.productId}</span>
                              <DirBadge dir={t.direction}/>
                              <span className="text-muted text-[10px]">{t.contracts}สัญญา</span>
                              {netPL!=null&&(
                                <span className={"ml-auto font-bold tabular-nums text-xs "+(isWin?"text-green":"text-red")}>
                                  {isWin?"+":""}{fmtTHB(netPL,0)} ฿
                                </span>
                              )}
                            </div>
                            <div className="flex items-center gap-2 mt-1 text-[10px] text-muted">
                              <span className="tabular-nums">{fmtNum(t.entryPrice,p?.digits)} → {t.exitPrice!=null?fmtNum(t.exitPrice,p?.digits):"?"}</span>
                              <span>·</span>
                              <span>{t.openDateTime?.slice(11,16)} → {t.exitDateTime?.slice(11,16)||"?"}</span>
                              {t.setupType&&<><span>·</span><span className="text-yellow/60">{t.setupType}</span></>}
                            </div>
                            {((t.preImages||[]).length>0||(t.postImages||[]).length>0||t.preNote||t.postNote)&&(
                              <div className="mt-2 space-y-1.5 border-t border-border/20 pt-2">
                                {(t.preImages||[]).length>0&&(
                                  <div className="flex gap-1 flex-wrap">
                                    {(t.preImages||[]).slice(0,3).map((src,idx)=>(
                                      <ResolvedImage key={idx} src={src}
                                        onClick={e=>{e.stopPropagation();setCalLightbox(src);}}
                                        className="w-24 h-16 object-cover rounded-lg cursor-pointer hover:opacity-80 transition border border-green/20"
                                        title="Pre-trade — กดขยาย"/>
                                    ))}
                                    {t.preNote&&<p className="w-full text-[10px] text-muted/80 leading-snug">{t.preNote.slice(0,80)}{t.preNote.length>80?"...":""}</p>}
                                  </div>
                                )}
                                {(t.postImages||[]).length>0&&(
                                  <div className="flex gap-1 flex-wrap">
                                    {(t.postImages||[]).slice(0,3).map((src,idx)=>(
                                      <ResolvedImage key={idx} src={src}
                                        onClick={e=>{e.stopPropagation();setCalLightbox(src);}}
                                        className="w-24 h-16 object-cover rounded-lg cursor-pointer hover:opacity-80 transition border border-blue-400/20"
                                        title="Post-trade — กดขยาย"/>
                                    ))}
                                    {t.postNote&&<p className="w-full text-[10px] text-muted/80 leading-snug">{t.postNote.slice(0,80)}{t.postNote.length>80?"...":""}</p>}
                                  </div>
                                )}
                                {!((t.preImages||[]).length>0||(t.postImages||[]).length>0)&&(t.preNote||t.postNote)&&(
                                  <p className="text-[10px] text-muted/80 leading-snug">{(t.preNote||t.postNote||"").slice(0,100)}</p>
                                )}
                              </div>
                            )}
                          </div>
                        );
                      };

                      return(
                        <>
                          {calTooltip.data&&closedToday.length>0&&(
                            <div className="flex items-center gap-4 flex-wrap pb-2 border-b border-border/30">
                              <div>
                                <span className="text-muted text-xs block">P/L</span>
                                <div className={"text-xl font-bold tabular-nums "+(calTooltip.data.pnl>=0?"text-green":"text-red")}>
                                  {calTooltip.data.pnl>=0?"+":""}{fmtTHB(calTooltip.data.pnl,0)} ฿
                                </div>
                              </div>
                              <div className="text-center">
                                <span className="text-muted text-xs block">ปิดวันนี้</span>
                                <span className="text-txt font-semibold">{closedToday.length} ไม้ · <span className="text-green">{w}W</span> <span className="text-red">{l}L</span></span>
                              </div>
                              <div className="text-center">
                                <span className="text-muted text-xs block">เฉลี่ย/ไม้</span>
                                <span className={"font-semibold tabular-nums "+(calTooltip.data.pnl>=0?"text-green":"text-red")}>
                                  {calTooltip.data.pnl>=0?"+":""}{fmtTHB(calTooltip.data.count>0?calTooltip.data.pnl/calTooltip.data.count:0,0)} ฿
                                </span>
                              </div>
                            </div>
                          )}
                          {activePositions.length>0&&(
                            <div className="space-y-2">
                              <span className="text-muted text-xs font-medium">📊 ถือไว้วันนี้ ({activePositions.length})</span>
                              {activePositions.map(renderTradeCard)}
                            </div>
                          )}
                          {closedToday.length>0&&(
                            <div className="space-y-2">
                              <span className="text-muted text-xs font-medium">✅ ปิดวันนี้ ({closedToday.length})</span>
                              {closedToday.map(renderTradeCard)}
                            </div>
                          )}
                          {dayTrades.length===0&&!calTooltip.data&&(
                            <div className="text-muted text-sm text-center py-2 italic">ไม่มีไม้วันนี้</div>
                          )}
                          {dailyNotes[calTooltip.key]?(
                            <div className="flex items-start gap-3 bg-input/30 rounded-xl p-3">
                              <span className="text-2xl flex-shrink-0">{dailyNotes[calTooltip.key].mood}</span>
                              <p className="text-sm text-txt leading-relaxed flex-1">
                                {dailyNotes[calTooltip.key].note||<span className="text-muted italic">ไม่มี note</span>}
                              </p>
                            </div>
                          ):(
                            <div className="text-muted text-sm text-center py-1 italic">ยังไม่มี note วันนี้</div>
                          )}
                          <button
                            onClick={()=>{setNoteModal({key:calTooltip.key});setCalTooltip(null);}}
                            className={clsBtn("yellow")+" w-full"}>
                            {dailyNotes[calTooltip.key]?"✏️ แก้ไข Note":"+ เพิ่ม Note"}
                          </button>
                        </>
                      );
                    })()}
                  </div>
                </div>
              </div>
            )}

            <div className="flex items-center gap-4 mt-3 text-xs text-muted flex-wrap">
              <div className="flex items-center gap-1.5"><span className="w-3 h-3 rounded" style={{background:"rgba(14,203,129,0.65)"}}/>Profit</div>
              <div className="flex items-center gap-1.5"><span className="w-3 h-3 rounded" style={{background:"rgba(246,70,93,0.65)"}}/>Loss</div>
              <div className="flex items-center gap-1.5"><span className="w-3 h-3 rounded" style={{background:"#1E2329",border:"1px solid #2B3139"}}/>No trade</div>
              <div className="flex items-center gap-1.5"><span className="text-[10px]">😊</span>มี daily note</div>
            </div>
          </>
        )}

        {calMode==="timeline"&&(
          <div className="space-y-2">
            <div className="flex" style={{marginLeft:"88px"}}>
              {Array.from({length:days},(_,i)=>(
                <div key={i} className="flex-1 text-center text-[9px] text-muted select-none"
                  style={{minWidth:0}}>
                  {i+1===1||i+1===8||i+1===15||i+1===22||i+1===days||i+1===today.slice(-2)*1?i+1:""}
                </div>
              ))}
            </div>

            {timelineTrades.length===0&&(
              <div className="text-center text-muted text-sm py-10">ไม่มี trade ในเดือนนี้</div>
            )}

            {timelineTrades.map(t=>{
              const p=resolveProduct(products||[],t.productId);
              const tStart=t.openDateTime.slice(0,10);
              const rawEnd=t.status==="open"?today:(t.exitDateTime?.slice(0,10)||today);
              const clampedStart=tStart<moStartStr?moStartStr:tStart;
              const clampedEnd=rawEnd>moEndStr?moEndStr:rawEnd;
              const startDay=new Date(clampedStart).getDate();
              const endDay=new Date(clampedEnd).getDate();
              const leftPct=(startDay-1)/days*100;
              const widthPct=Math.max(1/days*100,(endDay-startDay+1)/days*100);
              const isOpen=t.status==="open";
              const netPL=!isOpen?calcNetPL(p,t.contracts,t.entryPrice,t.exitPrice,t.direction):null;
              const color=isOpen
                ?(PROD_COLORS[t.productId]||"#848E9C")
                :(netPL>=0?"#0ECB81":"#F6465D");
              return(
                <React.Fragment key={t.id}>
                <div className="flex items-center gap-2 cursor-pointer"
                  onClick={()=>setGanttDetail(ganttDetail===t.id?null:t.id)}>
                  <div className="flex-shrink-0 text-right" style={{width:"88px"}}>
                    <div className="text-xs font-semibold text-txt leading-tight truncate">{p?.currentContract||t.productId}</div>
                    <div className={`text-[9px] leading-tight ${t.direction==="Long"?"text-green":"text-red"}`}>
                      {t.direction==="Long"?"▲ Long":"▼ Short"} · {t.contracts}c
                    </div>
                  </div>
                  <div className="flex-1 relative h-9 bg-input/20 rounded-lg overflow-hidden">
                    <div className="absolute top-1 bottom-1 rounded-md flex items-center overflow-hidden"
                      style={{
                        left:leftPct+"%",
                        width:widthPct+"%",
                        background:color+"25",
                        border:"1.5px solid "+color+(isOpen?"cc":"66"),
                        minWidth:"6px",
                        boxShadow:isOpen?"0 0 8px "+color+"44":"none",
                      }}>
                      <span className="px-1.5 text-[9px] font-semibold whitespace-nowrap truncate" style={{color}}>
                        {isOpen?(
                          <span className="flex items-center gap-0.5">
                            <span className="w-1.5 h-1.5 rounded-full live-dot inline-block" style={{background:color}}/>
                            {" open · "+t.contracts+"c"+(t.partialCloses?.length>0?" ("+t.partialCloses.length+"TP)":"")}{/* partial TP count */}
                          </span>
                        ):((netPL>=0?"+":"")+fmtCompact(netPL||0)+" ฿")}
                      </span>
                      {/* Partial close markers on bar */}
                      {isOpen&&(t.partialCloses||[]).map((pc,pi)=>{
                        if(!pc.exitDateTime)return null;
                        const pcDay=new Date(pc.exitDateTime.slice(0,10)).getDate();
                        const pcLeft=(pcDay-1)/days*100;
                        return<div key={pi} className="absolute top-0 bottom-0 w-0.5" style={{left:pcLeft+"%",background:"#F0B90B88",pointerEvents:"none"}} title={"Partial TP: "+pc.contracts+"c @ "+pc.exitPrice}/>;
                      })}
                    </div>
                    {today.slice(0,7)===calMonth&&(()=>{
                      const td=new Date(today).getDate();
                      return<div className="absolute top-0 bottom-0 w-0.5 bg-yellow/50 pointer-events-none"
                        style={{left:((td-0.5)/days*100)+"%"}}/>;
                    })()}
                  </div>
                </div>
                {ganttDetail===t.id&&(
                  <div className="ml-[92px] mt-1 mb-1 fade-in bg-input/80 border border-border rounded-xl px-3 py-2.5 text-xs space-y-1.5">
                    <div className="flex items-center justify-between">
                      <span className="font-semibold text-txt">{p?.currentContract} · {t.direction} · {t.contracts}c</span>
                      <button onClick={e=>{e.stopPropagation();setGanttDetail(null);}} className="text-muted hover:text-txt">✕</button>
                    </div>
                    <div className="flex gap-4 flex-wrap text-muted">
                      <span>Entry: <span className="text-txt font-medium">{fmtNum(t.entryPrice,p?.digits)}</span></span>
                      {!isOpen&&<span>Exit: <span className="text-txt font-medium">{fmtNum(t.exitPrice,p?.digits)}</span></span>}
                      <span>เปิด: <span className="text-txt">{t.openDateTime?.slice(0,10)}</span></span>
                      {!isOpen&&<span>ปิด: <span className="text-txt">{t.exitDateTime?.slice(0,10)}</span></span>}
                      {t.setupType&&<span>Setup: <span className="text-yellow">{t.setupType}</span></span>}
                    </div>
                    {!isOpen&&netPL!=null&&(
                      <div className={`font-bold text-sm tabular-nums ${netPL>=0?"text-green":"text-red"}`}>
                        {netPL>=0?"+":""}{fmtTHB(netPL,0)} ฿
                      </div>
                    )}
                  </div>
                )}
                </React.Fragment>
              );
            })}

            <div className="flex items-center gap-2 mt-3 pt-3 border-t border-border/30">
              <div className="w-24 flex-shrink-0 flex items-center justify-end pr-2">
                <span className="text-[10px] text-muted font-medium">📝 Note</span>
              </div>
              <div className="flex-1 flex">
                {Array.from({length:days},(_,i)=>{
                  const d=String(i+1).padStart(2,"0");
                  const k=calMonth+"-"+d;
                  const dn=dailyNotes[k];
                  const isFuture=k>today;
                  return(
                    <button key={k}
                      onClick={()=>{if(!isFuture)setNoteModal({key:k});}}
                      disabled={isFuture}
                      title={dn?(dn.mood+" "+(dn.note||"").slice(0,40)+(dn.note&&dn.note.length>40?"...":"")):(isFuture?"—":("กด + เพิ่ม note วัน "+k))}
                      className={`flex-1 flex items-center justify-center h-8 rounded transition
                        ${isFuture?"opacity-20 cursor-not-allowed":"hover:bg-input/60 cursor-pointer"}`}
                      style={{minWidth:0}}>
                      {dn
                        ?<span className="text-[12px] leading-none">{dn.mood}</span>
                        :<span className={`text-[9px] font-bold ${isFuture?"text-border/30":k===today?"text-yellow/60":"text-border/50 group-hover:text-muted"}`}>
                          {k===today?"＋":"·"}
                        </span>}
                    </button>
                  );
                })}
              </div>
            </div>
            {/* Gantt instruction hint */}
            <div className="mt-2 flex items-center gap-1.5 text-[10px] text-muted/60">
              <span>💡</span>
              <span>กดที่ emoji 📝 เพื่อดู/แก้ไข note · กดที่ · เพื่อเพิ่ม note ในวันนั้น · วันอนาคตเพิ่มไม่ได้</span>
            </div>

            <div className="flex items-center gap-3 mt-1 text-[10px] text-muted flex-wrap">
              <span className="flex items-center gap-1">
                <span className="w-1.5 h-1.5 rounded-full bg-yellow live-dot inline-block"/>open trade
              </span>
              <span className="flex items-center gap-1.5">
                <span className="w-0.5 h-3 bg-yellow/50 inline-block"/>วันนี้
              </span>

function App({session,onSignOut}){

  // ─── Notification generator (persisted) ────────────────────
  useEffect(()=>{

    const txBalance2=(portfolio?.transactions||[]).reduce((s,t)=>s+(t.type==="deposit"?t.amount:-t.amount),0);

      const p=resolveProduct(products,t.productId);

    const bal2=txBalance2+realizedPL2;
    const candidates=[];

    // IM Alert
    const usedM=trades.filter(t=>t.status==="open").reduce((s,t)=>{
      const p=resolveProduct(products,t.productId);

    if(bal2>0&&usedM/bal2>=0.8){

      // Broker-style margin level estimate = equity / usedM. Omitted if any open trade's

      let imUnreal=0,imPriceComplete=true;

          :`Usage ${usagePct.toFixed(0)}% ของ balance`,
        msg:"Margin usage สูง — ตรวจสอบ Margin Level จริงใน MT5",time:now});
    }

    // Circuit Breaker — step-threshold based
    const cbTxs=portfolio?.transactions||[];
    const cbStatus=calcCBStatus(cbTxs,trades,portfolio,products,livePrices);
    if(cbStatus.breached){
      candidates.push({id:`cb_${today}`,type:"danger",icon:"🚨",
        title:"CIRCUIT BREAKER!",
        detail:`Equity ${fmtTHB(cbStatus.equity,0)}฿ ต่ำกว่า threshold ${fmtTHB(cbStatus.threshold,0)}฿`,

    } else if(cbStatus.armed&&cbStatus.threshold>0){
      const pct=cbStatus.equity>0?((cbStatus.equity-cbStatus.threshold)/cbStatus.threshold*100).toFixed(1):"0";
      if(+pct<15){
        candidates.push({id:`cbw_${today}`,type:"warn",icon:"🔴",
          title:"Circuit Breaker ใกล้!",
          detail:`Equity เหลือห่าง threshold แค่ ${pct}% (${fmtTHB(cbStatus.threshold,0)}฿)`,
          msg:"ใกล้ถึง circuit breaker — ระวัง",time:now});
      }
    }

    // Profit reminder per open trade
    trades.filter(t=>t.status==="open"&&t.entryPrice).forEach(t=>{
      const p=resolveProduct(products,t.productId);
      if(!p)return;
      const lp=getLivePrice(livePrices,t,p)||t.currentPrice||t.entryPrice;
      const unreal=((lp-t.entryPrice)/p.tickSize)*p.tickValue*(t.remainingContracts||t.contracts)*(t.direction==="Long"?1:-1);
      const profAlertPct=(portfolio?.profitAlertPct??5)/100;
      if(bal2<=0||unreal/bal2<=profAlertPct)return;
      const pct=unreal/bal2*100;
      const ticks=((lp-t.entryPrice)/p.tickSize)*(t.direction==="Long"?1:-1);
      const daysOpen=t.openDateTime?Math.floor((Date.now()-new Date(t.openDateTime))/86400000):0;
      const gearPV=p.contractSize*(t.entryPrice||0)*(t.remainingContracts||t.contracts);
      const gearX=bal2>0?(gearPV/bal2).toFixed(1):"?";
      const bucket=Math.floor(pct/5)*5;
      candidates.push({id:`profit_${t.id}_${today}_${bucket}`,type:"info",icon:"⚡",
        title:`${t.contractCode||p.currentContract} ${t.direction==="Long"?"▲":"▼"} ${t.remainingContracts||t.contracts}c`,
        detail:`+${pct.toFixed(1)}% port · +${ticks.toFixed(0)} ticks · Gearing ${gearX}X · ถือ ${daysOpen} วัน`,
        msg:"ทอดสมอกลางพายุ 🪝 ล็อค profit อย่ารอตอนย่อ",
        time:now});
    });

    // Big Win Cooldown Alert
    const cooldownPct=portfolio?.cooldownPct??20;
    const todayClosedTrades=trades.filter(t=>t.status==="closed"&&t.exitDateTime&&t.exitDateTime.slice(0,10)===today);
    todayClosedTrades.forEach(t=>{
      const p=resolveProduct(products,t.productId);

          title:"Big Win — Cooldown Mode",
          detail:(t.contractCode||p?.currentContract||t.productId)+" +"+fmtTHB(n,0)+"฿ (+"+(n/bal2*100).toFixed(1)+"%)",
          msg:"กำไรใหญ่เกิน "+cooldownPct+"% — ลด position size ลงครึ่งนึงในไม้ถัดไป เพื่อรักษากำไรไว้",
          time:now});

    const pRB=ls.get("tj_patterns",[]);
    if(pRB.length>0){
      const dRB=["อาทิตย์","จันทร์","อังคาร","พุธ","พฤหัส","ศุกร์","เสาร์"][new Date().getDay()];
      trades.filter(t=>t.status==="open").forEach(t=>{
        const p=resolveProduct(products,t.productId);
        const base=p?.baseSymbol||t.productId||"";
        pRB.forEach(pat=>{if((pat.product==="ทุก Product"||pat.product===base||pat.product===t.productId)&&(pat.day==="ทุกวัน"||pat.day===dRB)){candidates.push({id:"pat_"+pat.id+"_"+t.id+"_"+today,type:pat.severity==="danger"?"danger":pat.severity==="info"?"info":"warn",icon:"🧠",title:"Pattern: "+pat.trigger.slice(0,40),detail:(t.contractCode||p?.currentContract||t.productId)+" · "+t.direction,msg:pat.action,time:now});}});
      });

    // Append only NEW ids to history
    setNotifHistory(prev=>{

  const unreadCount=notifHistory.filter(n=>!n.read).length;
  const markRead=(id)=>setNotifHistory(prev=>{

  const markAllRead=()=>setNotifHistory(prev=>{
    const updated=prev.map(n=>({...n,read:true}));

  const deleteAllNotifs=()=>{
    ls.set("tj_notif_history",[]);setNotifHistory([]);
    // setNotifHistory([]) re-triggers the debounced notif save effect; the direct call
    // here is a fast-path. If a debounced save is already in flight (savingRef.notif),

    if(authUid&&!savingRef.current.notif){
      savingRef.current.notif=true;

      }).finally(()=>{savingRef.current.notif=false;});

  };
  const deleteOneNotif=(id)=>setNotifHistory(prev=>{

  });

  const completeSetup=useCallback(()=>{
    ls.set("tj_tutorial_done",true);

    if(authUid){
      db.saveUserData(authUid,"tj_tutorial_done",true,lastSeenRef.current.userData["tj_tutorial_done"]).then(res=>{
        if(res&&res.ok)lastSeenRef.current.userData["tj_tutorial_done"]=res.updated_at;
        else if(res&&res.conflict)console.warn("[persist] tj_tutorial_done CONFLICT — reload to merge");
      });
    }
  },[authUid]);

  useEffect(()=>{if(!dbReady)return;ls.set("tj_trades",   trades);   },[trades]);
  useEffect(()=>{if(!dbReady)return;ls.set("tj_portfolio",portfolio); },[portfolio]);
  useEffect(()=>{if(!dbReady)return;ls.set("tj_products", products);  },[products]);

  // ─── Supabase sync ───────────────────────────────────────────────────────
  const authUid=session?.user?.id;
  // Lazy, read-only check-in activity load — only when the Center is opened.
  // Never writes, never persists, never touches notifHistory/badge/toast.
  useEffect(()=>{
    if(!showNotif||!authUid)return;
    let cancelled=false;
    setCheckinLoading(true);setCheckinError(null);
    db.loadCheckinActivity(authUid).then(res=>{
      if(cancelled)return;
      if(res&&res.ok){
        setCheckinItems(buildCheckinActivity(res.rows));
        setCheckinTagMap(res.tags||{});
      }else{
        setCheckinError((res&&res.error)||"load failed");
        setCheckinItems([]);
      }
    }).finally(()=>{if(!cancelled)setCheckinLoading(false);});
    return()=>{cancelled=true;};
  },[showNotif,authUid]);
  const dbTimers=useRef({});
  // Optimistic-concurrency tokens — track server-side updated_at per table/key
  // and the loaded set of trade ids. Updated on load + on every successful save.
  const lastSeenRef=useRef({portfolio:null,products:null,notes:null,userData:{},tradeIds:new Set()});
  // In-flight save flags per logical resource. tryFire defers when its flag is true,
  // so a second save for the same resource never starts before the previous one returns.
  // Unrelated resources are independent (separate flags).
  const savingRef=useRef({trades:false,portfolio:false,products:false,notes:false,notif:false,patterns:false});
  // ── Close-save durability (C+A+D) — serialize ALL trades writes (debounced autosave
  // + immediate close save) on ONE promise chain so they never overlap or clobber
  // lastSeenRef. Autosave → ids-only db.reconcileDeletedTrades; close/open/update → db.saveTrade
  // (single row). The full-array db.saveTrades writer was retired in P2-4C. Never rejects.
  const tradesSavePromiseRef=useRef(null);
  // (D) Post-hydration autosave-echo suppressor — rising-edge detector on dbReady. Stays
  // false until the dbReady false→true edge (the render where `trades` first holds the
  // hydrated array); that one redundant full-array write-back is skipped. The first real
  // user edit (a later render, dbReady already true) autosaves normally. Batching-robust.
  const prevDbReadyRef=useRef(false);
  // P2-1B durable-merge repair guard — mergeCommitIds (or merged ids) being repaired this
  // session, so the marker-gated repair effect never storms or re-enters the same pending merge.
  const mergeRepairInFlight=useRef(new Set());
  const saveTradesSerialized=useCallback((payload,meta)=>{
    const info=meta||{};
    const isSingleRow=info.source==="close"||info.source==="open"||info.source==="update";   // close/open/update → payload is a single trade OBJECT; else an ARRAY
    const isReconcile=info.source==="autosave_reconcile";   // P2-4B: ids-only delete reconcile; NEVER upserts / NEVER full-array
    try{
      const prev=(tradesSavePromiseRef.current||Promise.resolve()).catch(()=>{});
      const p=prev.then(async()=>{
        savingRef.current.trades=true;
        try{
          if(isReconcile){
            // RECONCILE-ONLY autosave (P2-4B). Derive ID SETS locally; NEVER upsert / NEVER call toTradeRow,
            // NEVER send trade objects or base64 to Supabase. Only deletes ids this tab knew about and that
            // are now gone locally (bounded by knownIds). Still serialized on tradesSavePromiseRef like every
            // other trade write, so it cannot interleave with an in-flight single-row durable save.
            const localIds=new Set((Array.isArray(payload)?payload:[]).map(t=>String(t&&t.id)));
            const res=await db.reconcileDeletedTrades(authUid,localIds,lastSeenRef.current.tradeIds||new Set());
            if(res&&res.ok){
              lastSeenRef.current.tradeIds=localIds;   // adopt local as authoritative ONLY on success / no-op delete
            }else{
              console.warn("[autosave][reconcile] not ok — keeping prior knownIds",{res});
            }
            return res||{ok:false,error:new Error("reconcile returned no result")};
          }
          if(isSingleRow){
            // CLOSE / OPEN / UPDATE single-row path — payload is a single trade OBJECT, written via db.saveTrade.
            // Object-shaped affected-trade guard (an array payload falls through to the retired-path guard below).
            if(info.affectedTradeId!=null&&(!payload||payload.id!==info.affectedTradeId)){
              console.warn("[trade-save][guard] affected trade missing from single-row payload",{source:info.source,affectedTradeId:info.affectedTradeId});
              return {ok:false,error:new Error("Affected trade missing from single-row payload"),guard:"affected_trade_missing"};
            }
            const res=await db.saveTrade(authUid,payload);   // single row — no knownIds, no reconcile
            // OPEN only: register the brand-new id in this tab's known-set so a LATER user delete
            // reconciles (delete propagates to the server). String() matches the full-array path's id
            // type — a type-mismatched id would make localIds.has() miss and wrongly delete the row.
            // CLOSE leaves the set alone: that id is already known, and re-assigning would wipe the
            // set and silently disable reconcile-delete.
            if(info.source==="open"&&res&&res.ok){
              lastSeenRef.current.tradeIds=new Set([...lastSeenRef.current.tradeIds,String(payload.id)]);
            }
            if(!(res&&res.ok))console.warn("[trade-save] saveTrade not ok",{source:info.source,res});
            return res||{ok:false,error:new Error("saveTrade returned no result")};
          }
          // FULL-ARRAY path RETIRED (P2-4C). After P2-4B every source is reconcile (autosave_reconcile) or
          // single-row (close/open/update); the full-array db.saveTrades writer was removed. Reaching here
          // means an unknown/missing source passed an array payload — an impossible path post-P2-4B. Fail
          // LOUD (console.error) and do NOT mutate lastSeenRef (no known-id change for a payload we refuse to write).
          console.error("[trade-save] unexpected full-array save path retired in P2-4C",{source:info.source||null,isArray:Array.isArray(payload)});
          return {ok:false,guard:"fullarray_retired",error:new Error("Unexpected full-array save path retired in P2-4C"),source:info.source||null};
        }catch(e){
          console.warn("[close-save] save threw",{source:info.source,error:e});
          return {ok:false,error:e};
        }finally{
          savingRef.current.trades=false;
        }
      });
      tradesSavePromiseRef.current=p;
      return p;
    }catch(e){
      return Promise.resolve({ok:false,error:e});
    }
  },[authUid]);
  // portfolio_summary persistence:
  //   livePricesRef    — non-reactive snapshot of livePrices, read inside the persistence
  //                      path so livePrices ticks alone do NOT trigger writes.
  //                      Volatile fields (current_equity / unrealized_pl / margin_pct)
  //                      are persisted as snapshots taken at the moment a STABLE input
  //                      (trades / portfolio / step) changes — NOT a realtime feed.
  //   lastSummaryHashRef — JSON.stringify of last written payload; identical payloads
  //                        are skipped before upsert.
  const livePricesRef=useRef({});
  const lastSummaryHashRef=useRef(null);
  // Supabase-first load: fetch all data then render
  useEffect(()=>{
    if(!authUid)return;
    let retryTimer=null;
    db.loadAll(authUid).then(data=>{
      if(!data||!data.ok){
        console.warn("[hydrate] critical-table load failed — keeping dbReady=false (attempt",loadAttempt+1,"of 3)",data&&data.errors);
        if(loadAttempt<2){
          const delay=5000*Math.pow(2,loadAttempt); // 5s, 10s
          retryTimer=setTimeout(()=>setLoadAttempt(a=>a+1),delay);
        }else{
          console.error("[hydrate] permanent load failure after 3 attempts — user must refresh");
        }
        return;
      }
      if(data.partial)console.warn("[hydrate] partial load — proceeding with available tables",data.errors);
      // Trades
      if(data.trades!=null){
        setTrades(data.trades);
        ls.set("tj_trades",data.trades);
      }else{
        console.warn("[trades][hydrate] data.trades==null — keeping initial state");
      }
      // Portfolio — merge remote + backfill stepHistory if empty
      {

  // Guarded by a per-session (per-mount) in-flight set so it can't storm; a failed repair is retried on the

  useEffect(()=>{

    if(pending.length===0)return;
    const liveIds=new Set(trades.map(t=>String(t.id)));

      const cid=m.mergeCommitId||m.id;
      if(mergeRepairInFlight.current.has(cid))return;
      mergeRepairInFlight.current.add(cid);
      clearTimeout(dbTimers.current.trades);   // a queued autosave must not resurrect sources mid-repair
      // ── Duplicate / orphan resolution. A source leg can appear in two durableMergeVersion===1 rows ONLY
      // via a failed-then-retried merge (a successful merge deletes its sources server-side). Gather all
      // durable-merge rows sharing any of this row's legs and elect ONE deterministic survivor:
      //   1) a row whose sources are ALL already consumed (gone) — a REAL completed merge — outranks an
      //      orphan whose sources are still alive (so we NEVER delete a real position to keep an orphan);
      //   2) then a finalized row outranks a pending one;
      //   3) then lowest id (stable). Every colliding row computes the SAME survivor from one trades
      // snapshot → exactly one is kept; the rest are deleted (never finalized). Closes double-count + loss.
      const liveSet=new Set(trades.map(t=>String(t.id)));
      const consumed=t=>Array.isArray(t.mergedFromIds)&&t.mergedFromIds.every(id=>!liveSet.has(String(id)));
      const mfi=new Set((m.mergedFromIds||[]).map(String));
      const group=trades.filter(t=>t&&t.durableMergeVersion===1&&Array.isArray(t.mergedFromIds)&&t.mergedFromIds.some(id=>mfi.has(String(id))));
      const survivor=group.slice().sort((a,b)=>{
        const ac=consumed(a)?0:1,bc=consumed(b)?0:1;
        if(ac!==bc)return ac-bc;                                                  // real (sources consumed) before orphan (sources alive)
        const af=a.mergeDeletePending===true?1:0,bf=b.mergeDeletePending===true?1:0;

          else console.warn("[merge][repair] duplicate delete failed — next reload's repair will remove it",{id:String(m.id)});

        return;

            console.warn("[merge][repair] source delete failed — left pending; backstop/next reload completes",{id:String(m.id)});
            return;
          }
          const remStr=new Set(remaining.map(String));
          lastSeenRef.current.tradeIds=new Set([...lastSeenRef.current.tradeIds].filter(id=>!remStr.has(String(id))));
          console.log("[merge][repair] sources deleted",{id:String(m.id),count:remaining.length});
        }
        const finalized={...m,mergeDeletePending:false,mergeCompletedAt:m.mergeCompletedAt||new Date().toISOString()};
        setTrades(prev=>prev.map(t=>t.id===m.id?finalized:t));
        const sres=await db.saveTrade(authUid,finalized);
        if(sres&&sres.ok)console.log("[merge][repair] finalized",{id:String(m.id)});
        else console.warn("[merge][repair] finalize save failed — retry next load",{id:String(m.id)});
      }catch(e){console.warn("[merge][repair] error",e);}
    });
  },[dbReady,authUid,trades]);

  const prevPendingRef=useRef(0);
