const getNextSeries=(code)=>{
  const CYCLE=["H","M","U","Z"];
  const m=code.match(/^([A-Za-z0-9]+?)([HMUZ])(\d{2})$/);
  if(!m)return "";
  const ni=(CYCLE.indexOf(m[2])+1)%4;
  const ny=ni===0?((+m[3]+1)%100).toString().padStart(2,"0"):m[3];
  return m[1]+CYCLE[ni]+ny;
};

// ─── Save guards ──────────────────────────────────────────────────────────
// Refuse to persist demo/mock trades to production. MOCK_TRADES uses ids m1..m21
// (/^m\d+$/) — that id-shape is the canonical demo signature. Enforced at the single-row
// durable writer db.saveTrade (the full-array db.saveTrades was retired in P2-4C). See P0 invalid-smoke diagnosis 2026-06-15.
const detectUnsafeMockTrades=trades=>{
  if(!Array.isArray(trades))return{unsafe:false,ids:[],reason:null};
  const ids=trades.filter(t=>t&&/^m\d+$/.test(String(t.id))).map(t=>t.id);
  return ids.length>0?{unsafe:true,ids,reason:"mock_demo_trade_ids"}:{unsafe:false,ids:[],reason:null};
};
// Map a failed close-save result to a user-facing message. Guard hits get a
// specific reason; everything else falls back to the generic retry toast.
const closeFailMessage=res=>
  res&&res.guard==="mock_demo_trades"?"Local app loaded demo trades; refusing to save to production."
  :res&&res.guard==="affected_trade_missing"?"Trade not found in local state; reload from production before closing."
  :"บันทึกการปิดไม่สำเร็จ — ลองใหม่อีกครั้ง";
// Map a failed open/add-save result to a user-facing message — mirrors closeFailMessage.
const openFailMessage=res=>
  res&&res.guard==="mock_demo_trades"?"Local app loaded demo trades; refusing to save to production."
  :res&&res.guard==="affected_trade_missing"?"Trade mismatch in local state; reload from production before saving."
  :"บันทึกการเปิดออเดอร์ไม่สำเร็จ — ลองใหม่อีกครั้ง";
// Shared trade→row mapper — SINGLE source of truth for the trades row shape, used by the single-row
// durable writer db.saveTrade (the full-array db.saveTrades writer was retired in P2-4C). The
// columnar+raw shape stays canonical. The two `||` falsy-zero fallbacks are load-bearing —
// remaining_contracts:0 (fully-closed leg) and note:"" must map exactly as below.
const toTradeRow=(uid,t)=>({
  id:t.id, user_id:uid,
  product_id:t.productId, direction:t.direction,
  status:t.status, contracts:t.contracts,
  remaining_contracts:t.remainingContracts||t.contracts,
  entry_price:t.entryPrice, exit_price:t.exitPrice,
  entry_date:t.entryDate, exit_date:t.exitDate,
  note:t.note||null, raw:t,
});

// ─── Supabase DB helpers ──────────────────────────────────────────────────
const db={
  async loadAll(uid){
    try{
      const[t,p,pr,n,ud]=await Promise.all([
        SUPA.from("trades").select("raw").eq("user_id",uid),
        SUPA.from("portfolio").select("data,updated_at").eq("user_id",uid).maybeSingle(),
        SUPA.from("products").select("data,updated_at").eq("user_id",uid).maybeSingle(),
        SUPA.from("notes").select("freeform,daily,updated_at").eq("user_id",uid).maybeSingle(),
        SUPA.from("user_data").select("key,value,updated_at").eq("user_id",uid),
      ]);
      // Per-table errors arrive as {data:null, error:...}. Critical = trades + portfolio.
      const errors={trades:t.error,portfolio:p.error,products:pr.error,notes:n.error,user_data:ud.error};
      const failedAny=Object.values(errors).some(e=>!!e);
      const failedCritical=!!(t.error||p.error);
      if(failedAny)console.warn("[db] loadAll partial failure",errors);
      if(failedCritical){
        console.warn("[db] loadAll critical-table failure — refusing to mark hydrated",errors);
        return{ok:false,fatal:true,errors};
      }
      const udMap={};
      const udMeta={};
      (ud.data||[]).forEach(r=>{
        try{udMap[r.key]=JSON.parse(r.value);}catch{udMap[r.key]=r.value;}
        udMeta[r.key]=r.updated_at||null;
      });
      return{
        ok:true,
        partial:failedAny,
        errors,
        trades:        t.data?.map(r=>r.raw)||null,
        portfolio:     p.data?.data||null,
        portfolioMeta: p.data?.updated_at||null,
        products:      pr.data?.data||null,
        productsMeta:  pr.data?.updated_at||null,
        notesFreeform: n.data?.freeform||null,
        notesDaily:    n.data?.daily||null,
        notesMeta:     n.data?.updated_at||null,
        notifHistory:  udMap["tj_notif_history"]||null,
        patterns:      udMap["tj_patterns"]||null,
        aiKey:         udMap["tj_ai_key"]||null,
        userDataMeta:  udMeta,
      };
    }catch(e){console.warn("[db] loadAll fatal error",e);return{ok:false,fatal:true,error:e};}
  },
  // db.saveTrades (full-array upsert + reconcile-delete) RETIRED in P2-4C. It became unreachable after
  // P2-4B narrowed the autosave to an ids-only reconcile (db.reconcileDeletedTrades) and every durable
  // trade write goes through the single-row db.saveTrade. Removing it eliminates the last full-array
  // base64 upsert (the 57014 source). The now-impossible full-array branch in saveTradesSerialized is
  // replaced by a fail-loud guard (guard:"fullarray_retired"). toTradeRow stays — db.saveTrade uses it.
  // Reconcile-only DELETE backstop (P2-4B). The trades autosave no longer upserts the full array
  // (no toTradeRow, no ~11 MB base64 body, no 57014 risk); it ONLY propagates LOCAL DELETIONS this tab
  // performed but that some path did not already push server-side. Bounded to knownIds: deletes ONLY
  // ids this tab previously knew about and that are now absent locally (removedIds = knownIds − localIds).
  // Rows on the server that this tab never knew about (other tab/device) are NEVER touched. Inputs are
  // ID SETS ONLY — never trade objects. String()-normalised both sides. deletedIds < removedIds is OK
  // (already-gone rows are a valid state); only a real Supabase error fails. Never throws.
  async reconcileDeletedTrades(uid,localIds,knownIds){
    try{
      if(!uid)return{ok:false,error:new Error("reconcileDeletedTrades: missing uid")};
      const local=new Set([...(localIds||[])].map(String));
      const known=[...(knownIds||[])].map(String);
      const removedIds=known.filter(id=>!local.has(id));
      if(removedIds.length===0)return{ok:true,removedIds:[],deletedIds:[]};
      const{data,error}=await SUPA.from("trades").delete().eq("user_id",uid).in("id",removedIds).select("id");
      if(error){console.warn("[db] reconcileDeletedTrades delete error",error);return{ok:false,error,removedIds};}
      const deletedIds=(data||[]).map(r=>String(r.id));
      console.warn("[db] reconcileDeletedTrades ok removed="+removedIds.length+" deleted="+deletedIds.length);
      return{ok:true,removedIds,deletedIds};
    }catch(e){console.warn("[db] reconcileDeletedTrades error",e);return{ok:false,error:e};}
  },
  // Single-row durable CLOSE writer (P0 timeout fix). Upserts ONLY the affected row
  // (~≤1.5 MB vs the full ~11 MB array) so it stays inside the statement-timeout budget.
  // No full-array, no reconcile-delete, no knownIds. .select("id") verifies the row landed
  // (RLS/constraint tripwire) without RETURNING raw. Mock guard runs first. Never throws.
  async saveTrade(uid,trade){
    try{
      if(!uid||!trade||trade.id==null){return{ok:false,error:new Error("saveTrade: missing uid/trade/id")};}
      // Mock/demo guard — array-wrapped (a bare object returns {unsafe:false}). Skips Supabase.
      const mockCheck=detectUnsafeMockTrades([trade]);
      if(mockCheck.unsafe){
        console.warn("[trades][guard] refusing to save mock/demo trades",{ids:mockCheck.ids,reason:mockCheck.reason});
        return{ok:false,error:new Error("Refusing to save mock/demo trades"),guard:"mock_demo_trades",ids:mockCheck.ids};
      }
      const row=toTradeRow(uid,trade);
      // Array-wrapped [row] so `data` is reliably an array of one across supabase-js versions.
      const{data,error}=await SUPA.from("trades").upsert([row],{onConflict:"id"}).select("id");
      if(error){console.warn("[trades][write1] upsert-error",error);return{ok:false,error};}
      const ids=(data||[]).map(r=>r.id);
      // String() BOTH sides: PostgREST returns the bigint id as a JSON string while
      // trade.id from raw is a JS number — strict !== would ALWAYS misfire.
      if(ids.length!==1||String(ids[0])!==String(trade.id)){
        console.warn("[trades][write1] affected!=1 or id mismatch",{got:ids,gotType:typeof ids[0],want:trade.id});
        return{ok:false,error:new Error("single-row upsert did not affect exactly the target row")};
      }
      console.log("[close-save] durable ok (single-row)",{id:String(trade.id)});
      return{ok:true,id:String(trade.id),ids:new Set([String(trade.id)]),mode:"single"};
    }catch(e){console.warn("[db] saveTrade error",e);return{ok:false,error:e};}
  },
  // Batch durable DELETE writer (P2-1B). Deletes ONLY the given ids for this user in ONE
  // statement (.in("id",ids)) and reports which landed via .select("id"). Returns
  // {ok,deletedIds,requestedIds,error}; does NOT hard-fail when deletedIds<requestedIds —
  // already-absent rows are a valid repair state, so the CALLER decides. No full-array, no
  // reconcile-delete, no knownIds. Never throws. (Standalone delete still uses the old path
  // for now; this helper serves durable merge + repair only.)
  async deleteTrades(uid,ids){
    try{
      if(!uid||!Array.isArray(ids)||ids.length===0){return{ok:false,error:new Error("deleteTrades: missing uid/ids"),deletedIds:[],requestedIds:Array.isArray(ids)?ids.map(String):[]};}
      const{data,error}=await SUPA.from("trades").delete().eq("user_id",uid).in("id",ids).select("id");
      if(error){console.warn("[trades][delete-batch] error",error);return{ok:false,error,deletedIds:[],requestedIds:ids.map(String)};}
      const deletedIds=(data||[]).map(r=>String(r.id));
      console.log("[trades][delete-batch] ok",{requested:ids.length,deleted:deletedIds.length});
      return{ok:true,deletedIds,requestedIds:ids.map(String)};
    }catch(e){console.warn("[db] deleteTrades error",e);return{ok:false,error:e,deletedIds:[],requestedIds:(ids||[]).map(String)};}
  },
  async savePortfolio(uid,data,expectedUpdatedAt){
    try{
      const newTs=new Date().toISOString();
      if(expectedUpdatedAt==null){
        // First write — no row to conflict with. Use upsert.
        const{error}=await SUPA.from("portfolio").upsert(
          {user_id:uid,data,updated_at:newTs},
          {onConflict:"user_id"}
        );
        if(error){console.warn("[db] savePortfolio upsert error",error);return{ok:false,error};}
        return{ok:true,updated_at:newTs};
      }
      // Conditional update — only if server's updated_at matches what we last saw.
      const{data:row,error}=await SUPA.from("portfolio")
        .update({data,updated_at:newTs})
        .eq("user_id",uid)
        .eq("updated_at",expectedUpdatedAt)
        .select("updated_at")
        .maybeSingle();
      if(error){console.warn("[db] savePortfolio update error",error);return{ok:false,error};}
      if(!row){
        console.warn("[db] savePortfolio CONFLICT — server moved past expected_updated_at; refusing to overwrite",{expected:expectedUpdatedAt});
        return{ok:false,conflict:true};
      }
      return{ok:true,updated_at:newTs};
    }catch(e){console.warn("[db] savePortfolio error",e);return{ok:false,error:e};}
  },
  async saveProducts(uid,data,expectedUpdatedAt){
    try{
      const newTs=new Date().toISOString();
      if(expectedUpdatedAt==null){
        const{error}=await SUPA.from("products").upsert(
          {user_id:uid,data,updated_at:newTs},
          {onConflict:"user_id"}
        );
        if(error){console.warn("[db] saveProducts upsert error",error);return{ok:false,error};}
        return{ok:true,updated_at:newTs};
      }
      const{data:row,error}=await SUPA.from("products")
        .update({data,updated_at:newTs})
        .eq("user_id",uid)
        .eq("updated_at",expectedUpdatedAt)
        .select("updated_at")
        .maybeSingle();
      if(error){console.warn("[db] saveProducts update error",error);return{ok:false,error};}
      if(!row){
        console.warn("[db] saveProducts CONFLICT — server moved past expected_updated_at",{expected:expectedUpdatedAt});
        return{ok:false,conflict:true};
      }
      return{ok:true,updated_at:newTs};
    }catch(e){console.warn("[db] saveProducts error",e);return{ok:false,error:e};}
  },
  async saveNotes(uid,freeform,daily,expectedUpdatedAt){
    try{
      const newTs=new Date().toISOString();
      if(expectedUpdatedAt==null){
        const{error}=await SUPA.from("notes").upsert(
          {user_id:uid,freeform,daily,updated_at:newTs},
          {onConflict:"user_id"}
        );
        if(error){console.warn("[db] saveNotes upsert error",error);return{ok:false,error};}
        return{ok:true,updated_at:newTs};
      }
      const{data:row,error}=await SUPA.from("notes")

const calcPL=(product,contracts,entryPrice,exitPrice,direction)=>{
  if(exitPrice==null||!product||!contracts||!entryPrice)return 0;
  const ticks=(exitPrice-entryPrice)/product.tickSize;
  return ticks*product.tickValue*contracts*(direction==="Long"?1:-1);
};
const getRoundTripComm=(p)=>{
  if(!p)return 0;
  const withVAT=p.vatEnabled?p.commissionPerLeg*(1+(p.vatRate||0.07)):p.commissionPerLeg;
  return withVAT*2;
};
// ─── Step History Reconstruction ─────────────────────────────────────────────
const reconstructStepHistory=(trades,portfolio,products,thresholds)=>{
  if(!thresholds||thresholds.length===0)return[];
  const timeline=[];
  (portfolio.transactions||[]).forEach(tx=>{
    timeline.push({date:tx.date,delta:tx.type==="deposit"?tx.amount:-tx.amount});
  });
  (trades||[]).filter(t=>t.status==="closed"&&(t.exitDateTime||t.exitDate)).forEach(t=>{
    const prod=resolveProduct(products,t.productId);
    const pl=tradeNetPL(t,prod);
    timeline.push({date:t.exitDateTime||t.exitDate,delta:pl});
  });
  timeline.sort((a,b)=>new Date(a.date)-new Date(b.date));
  let balance=0,prevStep=0;
  const history=[];
  for(const entry of timeline){
    balance+=entry.delta;
    const newStep=thresholds.filter(t=>balance>=t).length;
    if(newStep!==prevStep){
      const lo=Math.min(newStep,prevStep),hi=Math.max(newStep,prevStep);
      for(let s=lo+1;s<=hi;s++){
        const prevEvent=history[history.length-1];
        const daysFromPrev=prevEvent?Math.floor((new Date(entry.date)-new Date(prevEvent.date))/86400000):null;
        history.push({step:s,event:newStep>prevStep?"reached":"dropped",date:entry.date,balance,daysFromPrev});
      }
    }
    prevStep=newStep;
  }
  return history;
};

const calcCBStatus=(txs,trades,portfolio,products,livePrices)=>{
  const txBalance=txs.reduce((s,t)=>s+(t.type==="deposit"?t.amount:-t.amount),0);
  const realizedPL=(trades||[]).filter(t=>t.status==="closed").reduce((s,t)=>{
    const p=resolveProduct(products||[],t.productId);
    return s+(tradeNetPL(t,p)||0);
  },0);
  const unrealizedPL=(trades||[]).filter(t=>t.status==="open"&&t.entryPrice).reduce((s,t)=>{
    const p=resolveProduct(products||[],t.productId);if(!p)return s;
    const lp=(livePrices&&getLivePriceForProduct?getLivePriceForProduct(livePrices,p):null)||t.currentPrice||t.entryPrice;
    return s+((lp-t.entryPrice)/p.tickSize)*p.tickValue*(t.remainingContracts||t.contracts)*(t.direction==="Long"?1:-1);
  },0);
  const equity=txBalance+realizedPL+unrealizedPL;
  const armed=portfolio.cb_armed||false;
  const baseline=portfolio.cb_baseline||0;
  const threshold=portfolio.cb_threshold||0;
  const breached=armed&&threshold>0&&equity<threshold;
  return{armed,baseline,threshold,breached,equity};
};
const reconstructHWM=(trades,portfolio,products)=>{
  const timeline=[];
  (portfolio.transactions||[]).forEach(tx=>{
    timeline.push({date:tx.date,delta:tx.type==="deposit"?tx.amount:-tx.amount});
  });
  (trades||[]).filter(t=>t.status==="closed"&&t.exitDateTime).forEach(t=>{
    const prod=resolveProduct(products,t.productId);
    const pl=tradeNetPL(t,prod);
    timeline.push({date:t.exitDateTime,delta:pl});
  });
  timeline.sort((a,b)=>new Date(a.date)-new Date(b.date));
  let bal=0,hwm=0;
  for(const e of timeline){bal+=e.delta;if(bal>hwm)hwm=bal;}
  return hwm;
};
const calcNetPL=(product,contracts,entryPrice,exitPrice,direction)=>{
  if(!product||exitPrice==null||!contracts||!entryPrice)return 0;
  return calcPL(product,contracts,entryPrice,exitPrice,direction)-getRoundTripComm(product)*contracts;
};
// Use actual broker P/L when available (MT5 imports); fall back to formula for manual trades
// MT5 Positions "Profit" = price-movement P/L only (does NOT include swap or commission)
// "Commission" = broker commission (typically stored as negative number)
// "Swap" = overnight financing (negative = charge, positive = credit)
// Net P/L = Profit + Commission + Swap
const tradeNetPL=(trade,product)=>{
  if(trade&&trade.brokerProfit!=null){
    return (trade.brokerProfit||0)+(trade.commission||0)+(trade.swap||0)+(trade.fee||0);
  }
  return calcNetPL(product,trade?.contracts,trade?.entryPrice,trade?.exitPrice,trade?.direction);
};
function calcWinningPL(trades, products) {
  return (trades||[]).filter(t=>t.status==="closed").reduce((s,t)=>{
    const p=resolveProduct(products||[],t.productId);
    if(!p) return s;
    const pl=tradeNetPL(t,p);
    return pl>0?s+pl:s;
  },0);
}
const buildCanonicalMetrics=(trades,products,portfolio,balance)=>{
  const closed=(trades||[]).filter(t=>t.status==="closed"&&t.exitPrice!=null);
  const bePct=portfolio?.breakevenPct??1.0;
  const getP=t=>resolveProduct(products||[],t.productId);

  // P/L per trade — always broker-first
  const nets=closed.map(t=>tradeNetPL(t,getP(t)));

  // W/L/BE classification
  let wins=[],losses=[],bes=[];
  nets.forEach((n,i)=>{
    const pct=balance>0?Math.abs(n)/balance*100:0;
    if(pct<bePct)bes.push(n);
    else if(n>0)wins.push(n);
    else losses.push(n);
  });
  const totalTrades=nets.length;
  const winRate=totalTrades>0?(wins.length/totalTrades*100):0;
  const totalWin=wins.reduce((s,v)=>s+v,0);
  const totalLoss=losses.reduce((s,v)=>s+v,0);
  const avgWin=wins.length?totalWin/wins.length:0;
  const avgLoss=losses.length?Math.abs(totalLoss/losses.length):0;
  const pf=(totalWin>0&&totalLoss<0)?totalWin/Math.abs(totalLoss):null;
  const rr=avgLoss>0?avgWin/avgLoss:null;

  // Max DD on full equity timeline (deposits + P/L), NOT P/L-only
  const events=[];
  (portfolio?.transactions||[]).forEach(tx=>{
    events.push({date:tx.date,delta:tx.type==="deposit"?tx.amount:-tx.amount});
  });
  closed.forEach(t=>{
    events.push({date:t.exitDateTime,delta:tradeNetPL(t,getP(t))});
  });
  events.sort((a,b)=>new Date(a.date)-new Date(b.date));
  let running=0,peak=0,trough=0,maxDD=0;
  events.forEach(e=>{
    running+=e.delta;
    if(running>peak){peak=running;trough=running;}
    else if(running<trough){trough=running;const dd=peak-trough;if(dd>maxDD)maxDD=dd;}
  });
  const maxDDAbs=maxDD;
  const maxDDPct=peak>0?maxDD/peak*100:0;

  // Commission
  const totalCommission=closed.reduce((s,t)=>{
    const p=getP(t);return s+(p?getRoundTripComm(p)*t.contracts:0);
  },0);

  // Avg hold
  const durations=closed.filter(t=>t.openDateTime&&t.exitDateTime)
    .map(t=>new Date(t.exitDateTime)-new Date(t.openDateTime));
  const avgHoldMs=durations.length?durations.reduce((s,v)=>s+v,0)/durations.length:0;

  // Largest
  const largestWin=wins.length?Math.max(...wins):null;
  const largestLoss=losses.length?Math.min(...losses):null;

  return{
    winRate,wins,losses,bes,
    winsCount:wins.length,lossesCount:losses.length,beCount:bes.length,
    totalTrades,pf,rr,avgWin,avgLoss,
    maxDDAbs,maxDDPct,peakEquity:peak,
    totalCommission,avgHoldMs,nets,
    largestWin,largestLoss,totalWin,totalLoss,
  };
};
const calcPositionValue=(product,contracts,entryPrice)=>{
  if(!product||!entryPrice||!contracts)return 0;
  return contracts*product.contractSize*entryPrice;
};
const calcGearingX=(positionValue,balance)=>balance>0?(positionValue/balance):0;
const calcMargin=(product,contracts)=>product?(product.initialMargin||0)*contracts:0;

const fmtDate=(dt)=>{if(!dt)return"—";try{const d=new Date(dt);const dd=String(d.getDate()).padStart(2,"0");const mm=String(d.getMonth()+1).padStart(2,"0");const yy=String(d.getFullYear()).slice(-2);return dd+"/"+mm+"/"+yy;}catch{return dt;}};
const fmtTime=(dt)=>{if(!dt)return"—";try{return new Date(dt).toLocaleTimeString("th-TH",{timeStyle:"short"});}catch{return"—";}};
const fmtGearing=(g)=>{
  if(g===null||g===undefined||isNaN(g)||!isFinite(g))return"0.00X";
  return Number(g).toFixed(2)+"X";
};
const fmtCompact=(v)=>{
  if(v===null||v===undefined||isNaN(v))return"—";
  const abs=Math.abs(v);
  const sign=v<0?"-":(v>0?"+":"");
  if(abs>=1000000)return sign+(abs/1000000).toLocaleString("en-US",{minimumFractionDigits:1,maximumFractionDigits:1})+"m";
  if(abs>=100000)return sign+(abs/1000).toLocaleString("en-US",{minimumFractionDigits:0,maximumFractionDigits:0})+"K";
  return sign+abs.toLocaleString("en-US",{minimumFractionDigits:0,maximumFractionDigits:0});
};
const fmtRatio=(v,dec=2)=>{
  if(v===null||v===undefined||isNaN(v))return"—";
  return v.toLocaleString("en-US",{minimumFractionDigits:dec,maximumFractionDigits:dec});
};
const gearingColor=(g)=>g>2?"text-red":g>1?"text-yellow":"text-green";
const duration=(a,b)=>{
  if(!a||!b)return"—";
  const d=Math.abs(new Date(b)-new Date(a));
  if(d<60000)return"< 1m";
  const totalMin=Math.floor(d/60000);
  const h=Math.floor(totalMin/60),m=totalMin%60;
  const days=Math.floor(h/24),remH=h%24;
  if(days>=30){const mo=Math.floor(days/30),remD=days%30;return remD>0?`${mo}mo ${remD}d`:`${mo}mo`;}
  if(days>=1)return remH>0?`${days}d ${remH}h`:`${days}d`;
  return h>0?`${h}h ${m}m`:`${m}m`;
};
const localNow=()=>{const n=new Date();return new Date(n-n.getTimezoneOffset()*60000).toISOString().slice(0,16);};
// ── Level-1 hash routing (no router lib, no Netlify config; hash fragments never hit the server). ──
// Keep in sync with navItems keys. An OAuth (#access_token=…) hash is never treated as a page route.
const PAGE_KEYS=["positions","journal","steps","dashboard","calendar","notes","settings"];
function _pageFromHash(){
  try{
    const h=(window.location.hash||"").replace(/^#/,"").trim();
    if(!h||h.includes("access_token"))return null;
    return PAGE_KEYS.includes(h)?h:null;
  }catch{return null;}
}
// Write the page hash. No-op if already matching, if the page isn't allowlisted, or during an auth hash.
// mode "push" = user navigation (real history entry); "replace" = silent cleanup/normalize.
function _syncPageHash(nextPage,mode){
  try{
    if(!PAGE_KEYS.includes(nextPage))return;
    const cur=(window.location.hash||"").replace(/^#/,"").trim();
    if(cur===nextPage||cur.includes("access_token"))return;
    const url=window.location.pathname+window.location.search+"#"+nextPage;
    if(mode==="replace")window.history.replaceState(null,"",url);
    else window.history.pushState(null,"",url);
  }catch{}
}
const fileToBase64=(file)=>new Promise((res,rej)=>{
  const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file);
});

// ── Image reference resolver (P2-5-B, render-only). preImages/postImages stay PLAIN STRING ARRAYS.
// A ref is one of: legacy base64 data URI, an http(s) URL, or a future `trade-images` Storage path
// ({user_id}/{trade_id}/{pre|post}/{image_id}.{ext}). data:/http render as-is (unchanged); a STRICTLY
// matched storage path is signed at render via the authenticated client (private bucket, no service_role,
// in-memory cache). Anything else passes through untouched. No upload, no externalize, no data-shape change.
const isDataImageRef=(ref)=>typeof ref==="string"&&ref.startsWith("data:");
const isHttpImageRef=(ref)=>typeof ref==="string"&&/^https?:\/\//i.test(ref);
// Strict path: exactly 4 segments, side=pre|post, image ext allow-list, segment charset excludes "/" and ":"
// (so it can NEVER match a data: or http(s):// ref), and no "..".
const TRADE_IMG_PATH_RE=/^[A-Za-z0-9_-]+\/[A-Za-z0-9_-]+\/(?:pre|post)\/[A-Za-z0-9_-]+\.(?:jpg|jpeg|png|webp|gif)$/i;
const isTradeImageStoragePath=(ref)=>typeof ref==="string"&&!ref.includes("..")&&TRADE_IMG_PATH_RE.test(ref);
const TRADE_IMG_BUCKET="trade-images";
const TRADE_IMG_SIGN_TTL=3600;            // 1 h signed URL
const _signedImgUrlCache=new Map();       // path → {url, exp(ms)} — in-memory only
async function signTradeImagePath(ref){
  try{
    const now=Date.now();
    const hit=_signedImgUrlCache.get(ref);
    if(hit&&hit.exp>now+60000)return hit.url;   // reuse while >1 min from expiry
    const{data,error}=await SUPA.storage.from(TRADE_IMG_BUCKET).createSignedUrl(ref,TRADE_IMG_SIGN_TTL);
    if(error||!data||!data.signedUrl){
      // Path-safe log only: segment count, NEVER the ref/content (could leak nothing sensitive here, but stay strict).
      console.warn("[img-resolver] sign failed",{segments:String(ref).split("/").length});
      return null;
    }
    _signedImgUrlCache.set(ref,{url:data.signedUrl,exp:now+TRADE_IMG_SIGN_TTL*1000});
    return data.signedUrl;
  }catch(e){console.warn("[img-resolver] sign threw");return null;}
}
// Returns a directly-usable <img src>: data:/http/unknown → the ref itself (synchronous, zero regression);
// strict storage path → signed URL once resolved (null while pending / on failure).
function useResolvedImageSrc(ref){
  const passThrough=isDataImageRef(ref)||isHttpImageRef(ref)||!isTradeImageStoragePath(ref);
  const[resolved,setResolved]=useState(passThrough?ref:null);
  useEffect(()=>{
    let alive=true;
    if(isDataImageRef(ref)||isHttpImageRef(ref)||!isTradeImageStoragePath(ref)){
      setResolved(ref);   // legacy base64 / http(s) / anything not a strict storage path → render as-is
      return;
    }
    const hit=_signedImgUrlCache.get(ref);
    if(hit&&hit.exp>Date.now()+60000){setResolved(hit.url);return;}
    setResolved(null);
    signTradeImagePath(ref).then(u=>{if(alive)setResolved(u);});
    return()=>{alive=false;};
  },[ref]);
  return resolved;
}
// 1×1 transparent GIF — pending/failed signed-URL placeholder (no broken-image icon, no layout jump, no crash).
const _IMG_PENDING_PX="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==";
function ResolvedImage(props){
  const{src,...rest}=props;
  const resolved=useResolvedImageSrc(src);
  return <img src={resolved||_IMG_PENDING_PX} {...rest}/>;
}

// ── Image externalization (P2-5-C, upload-on-commit). Replaces base64 `data:` refs in the trade being
// saved with stable `trade-images` Storage PATH strings (never signed/public URLs). preImages/postImages
// stay PLAIN STRING ARRAYS; mixed path/base64/http is allowed and renders via the P2-5-B resolver. Acts ONLY
// on the trade passed in (no bulk migration). Never mutates the input; never drops an image; on upload
// failure the original base64 is kept (mixed save). Uses the authenticated client only (no service_role),
// bucket trade-images, upsert:false (no overwrite — matches the no-UPDATE-policy RLS). Counts-only logging.
const _IMG_MIME_EXT={"image/png":"png","image/jpeg":"jpg","image/jpg":"jpg","image/webp":"webp","image/gif":"gif"};
const _imgSeg=(s)=>String(s==null?"":s).replace(/[^A-Za-z0-9_-]/g,"");   // sanitize path segment: no "/", no "..", no user text
const _dataUriMime=(ref)=>{const m=/^data:([^;,]+)[;,]/.exec(ref||"");return m?m[1].toLowerCase():null;};
async function _dataUriToBlob(ref){const r=await fetch(ref);return await r.blob();}   // browser-safe data: → Blob
async function _uploadTradeImage(authUid,tradeId,side,ref){
  const mime=_dataUriMime(ref);
  const ext=mime&&_IMG_MIME_EXT[mime];
  if(!ext)return{ok:false,reason:"unsupported_mime"};   // unknown/disallowed type → keep base64
  const path=`${_imgSeg(authUid)}/${_imgSeg(tradeId)}/${side}/${_imgSeg(uid())}.${ext}`;   // {uid}/{tradeId}/{pre|post}/{imageId}.{ext}
  try{
    const blob=await _dataUriToBlob(ref);
    const{error}=await SUPA.storage.from(TRADE_IMG_BUCKET).upload(path,blob,{contentType:mime,upsert:false});
    if(error)return{ok:false,reason:"upload_error"};
    return{ok:true,path};
  }catch(e){return{ok:false,reason:"upload_threw"};}
}
async function externalizeTradeImages(authUid,trade){
  let uploaded=0,failed=0,skipped=0;
  if(!authUid||!trade)return{trade,uploaded,failed,skipped};
  const out={...trade};   // shallow clone; the two image arrays are rebuilt below, input is never mutated
  for(const[field,side] of [["preImages","pre"],["postImages","post"]]){
    const arr=trade[field];
    if(!Array.isArray(arr)){continue;}
    const next=[];
    for(const ref of arr){
      if(isDataImageRef(ref)){
        const res=await _uploadTradeImage(authUid,trade.id,side,ref);
        if(res.ok){next.push(res.path);uploaded++;}       // success → store PATH
        else{next.push(ref);failed++;}                    // failure → keep base64 (never drop)
      }else{next.push(ref);skipped++;}                     // path / http / unknown → keep as-is
    }
    out[field]=next;
  }
  if(uploaded||failed)console.warn("[img-externalize]",{uploaded,failed,skipped});   // counts only — never refs/base64
  return{trade:out,uploaded,failed,skipped};
}

function ImageUploader({images,onChange,maxImages=3,label="📎 แนบรูป",onPreview}){
  const inputRef=useRef();
  const handleFiles=async(e)=>{
    const files=Array.from(e.target.files||[]);
    if(!files.length)return;
    const remaining=maxImages-(images||[]).length;
    if(remaining<=0)return;
    const b64s=await Promise.all(files.slice(0,remaining).map(fileToBase64));
    onChange([...(images||[]),...b64s]);
    e.target.value="";
  };
  const remove=(i)=>onChange((images||[]).filter((_,idx)=>idx!==i));
  return(
    <div>
      <Label>{label} (สูงสุด {maxImages} รูป)</Label>
      <div className="flex flex-wrap gap-2">
        {(images||[]).map((src,i)=>(

// V1 unsaved-changes guard for accumulating trade forms. Reuses ConfirmDialog. No persistence,
// no autosave, no save-draft. guardedClose: busy → no-op (keep existing busy behavior); dirty → ask;
// else close freely. confirmEl must be rendered by the caller (ConfirmDialog is fixed / z-[60]).
function useUnsavedGuard({dirty,busy,onClose}){
  const[ask,setAsk]=useState(false);
  const guardedClose=useCallback(()=>{
    if(busy)return;
    if(dirty)setAsk(true);
    else onClose();
  },[busy,dirty,onClose]);
  const confirmEl=(
    <ConfirmDialog
      state={ask?{open:true,variant:"danger",title:"ปิดโดยไม่บันทึก?",
        message:"มีข้อมูลที่ยังไม่ได้บันทึก ต้องการปิดโดยไม่บันทึกหรือไม่?",
        confirmLabel:"ปิดโดยไม่บันทึก",cancelLabel:"อยู่ต่อ",onConfirm:onClose}:null}
      onCancel={()=>setAsk(false)}/>
  );
  return{guardedClose,confirmEl};
}

// Pure: collapse checkin_events rows into passive activity items.
// Grouped rows (shared context.checkin_group_id) → ONE item. No P/L
// aggregation, no trade-record merge, no fake trade_id, no inference.
// Singleton rows keyed by row id. Sorted newest-first by reply/created time.
function buildCheckinActivity(rows){
  if(!Array.isArray(rows))return[];
  const m=new Map();
  for(const r of rows){
    const ctx=(r&&r.context)||{};
    const gid=ctx.checkin_group_id;
    const key=gid?("g:"+gid):("s:"+r.id);
    let g=m.get(key);
    if(!g){
      g={key,isGroup:!!gid,surface:r.surface,
         ts:r.replied_at||r.created_at||"",
         tagIds:[],tagSeen:new Set(),tradeIds:new Set(),
         legs:Array.isArray(ctx.group_legs)?ctx.group_legs:null,
         price_symbol:ctx.price_symbol||null,
         price_resolution:ctx.price_resolution||null,
         price_status:ctx.price_status||null,
         rowCount:0};
      m.set(key,g);
    }
    g.rowCount++;
    (r.tag_ids||[]).forEach(t=>{if(!g.tagSeen.has(t)){g.tagSeen.add(t);g.tagIds.push(t);}});
    if(r.trade_id)g.tradeIds.add(r.trade_id);
    const t=r.replied_at||r.created_at||"";
    if(t>g.ts)g.ts=t;
    if(!g.legs&&Array.isArray(ctx.group_legs))g.legs=ctx.group_legs;
  }
  return Array.from(m.values()).sort((a,b)=>(b.ts||"").localeCompare(a.ts||""));
}

function ProfitReminderBanner({trades,products,balance}){

    const p=resolveProduct(products||[],t.productId);
    if(!p)return;
    const livePrice=p._livePrice||p.entryPrice;
    const unrealPL=calcNetPL(p,t.contracts,t.entryPrice,livePrice,t.direction);
    if(balance>0&&unrealPL/balance>0.05){
      alerts.push({id:t.id,contract:t.contractCode||p.currentContract,unrealPL,pct:(unrealPL/balance*100).toFixed(1),
        type:"profit",msg:"ทอดสมอกลางพายุ 🪝 — ล็อค profit บางส่วน หรือออกตอนพุ่ง อย่ารอตอนย่อ"});
    }
  });
  if(alerts.length===0)return null;
  return(
    <div className="space-y-1.5 mb-3">
      {alerts.map(a=>(
        <div key={a.id} className="flex items-center gap-3 bg-yellow/5 border border-yellow/20 rounded-xl px-3 py-2.5 text-sm">

          </div>
        </div>
      ))}
    </div>
  );
}

function IMAlertBanner({trades,products,balance,livePrices,liveTimestamps}){
  const usedMargin=(trades||[]).filter(t=>t.status==="open").reduce((s,t)=>{
    const p=resolveProduct(products||[],t.productId);
    return s+(p?(p.initialMargin||0)*(t.remainingContracts||t.contracts):0);
  },0);
  // Gold market hours check (ICT = UTC+7)
  const isGoldMarketOpen=()=>{
    const now=new Date();
    const dayUTC=now.getUTCDay();
    const hourICT=(now.getUTCHours()+7)%24;
    if(dayUTC===6)return false;
    if(dayUTC===0&&hourICT<6)return false;
    return true;
  };
  // Stale price warning: any open trade whose live price is >10 min old
  const staleProducts=useMemo(()=>{
    if(!isGoldMarketOpen())return [];
    const openTrades=(trades||[]).filter(t=>t.status==="open"&&t.entryPrice);
    const seen=new Set();
    return openTrades.filter(t=>{
      if(seen.has(t.productId))return false;
      const p=resolveProduct(products||[],t.productId);
      const key=p?contractToLiveKey(p._baseId||p.id,t.contractCode||p.currentContract,p.baseSymbol):t.productId;
      const ts=liveTimestamps&&(liveTimestamps[key]||liveTimestamps[t.productId]);
      if(!ts)return false;
      seen.add(t.productId);
      return(Date.now()-new Date(ts).getTime())>10*60*1000;
    }).map(t=>t.productId);
  },[trades,products,liveTimestamps]);
  const marginPct=(!balance||balance<=0||usedMargin<=0)?0:usedMargin/balance*100;
  // Broker-style margin level estimate = equity / usedMargin. equity = balance + open unrealized.
  // Omitted (null) if any open trade's live price is missing or stale — never show a precise
  // level estimate built on unreliable prices.
  let imUnreal=0,imPriceComplete=true;
  (trades||[]).filter(t=>t.status==="open"&&t.entryPrice).forEach(t=>{
    const p=resolveProduct(products||[],t.productId);
    const lp=getLivePrice(livePrices,t,p);
    if(lp==null){imPriceComplete=false;return;}
    imUnreal+=calcPL(p,t.contracts,t.entryPrice,lp,t.direction);
  });
  const marginLevelPct=(imPriceComplete&&staleProducts.length===0&&usedMargin>0&&balance>0)
    ?((balance+imUnreal)/usedMargin*100):null;
  if(marginPct<100&&staleProducts.length===0)return null;
  return(
    <div className="space-y-2 mb-3">
      {marginPct>=100&&(
        <div className="flex items-center gap-3 bg-red/5 border border-red/20 rounded-xl px-3 py-2.5 text-sm">
          <span className="text-xl">⚠️</span>
          <div>
            <span className="font-semibold text-red">Margin Alert</span>
            <span className="text-muted ml-2">Initial Margin ใช้ {fmtTHB(usedMargin,0)} ฿ · Usage {marginPct.toFixed(0)}% ของ balance{marginLevelPct!=null?` · Margin level ≈ ${marginLevelPct.toFixed(0)}%`:""}</span>
            <div className="text-muted/50 text-[10px] mt-0.5">{marginLevelPct!=null?"* ประมาณการจาก IM ใน Journal — ยืนยัน Margin Level จริงใน MT5":"* คำนวณจาก usedIM/balance — ยืนยัน Margin Level จริงใน MT5"}</div>
          </div>
        </div>
      )}
      {staleProducts.length>0&&(
        <div className="flex items-center gap-3 bg-yellow/5 border border-yellow/20 rounded-xl px-3 py-2.5 text-sm">
          <span className="text-xl">🕐</span>
          <div>
            <span className="font-semibold text-yellow">ราคาเก่า</span>
            <span className="text-muted ml-2">ราคา live อาจค้างนานกว่า 10 นาที — กด 🔄 Refresh เพื่ออัปเดต</span>
          </div>
        </div>
      )}
    </div>
  );
}
