function OpenTradeForm({products,initialData,balance,openTrades,trades,portfolio,onSubmit,onCancel,showToast}){
  const isEdit=!!initialData;
  const allSeries=useMemo(()=>expandProducts(products),[products]);

  const[step,setStep]=useState(0);
  const[showChecklist,setShowChecklist]=useState(false);
  const[saving,setSaving]=useState(false);
  const savingGuard=useRef(false);   // ref guard: blocks same-tick double-submit before `saving` state commits (a new open generates a fresh id each call → a double-fire would duplicate the row)
  const[f,setF]=useState({
    productId:products[0]?.id||"",direction:"Long",contracts:"1",
    entryPrice:"",currentPrice:"",stopLoss:"",takeProfit:"",
    openDateTime:localNow(),setupType:"ประคองตลาด",preNote:"",preImages:[],
    ...(initialData?{
      ...initialData,
      contracts:String(initialData.contracts||1),
      entryPrice:String(initialData.entryPrice||""),
      currentPrice:String(initialData.currentPrice||initialData.entryPrice||""),
      stopLoss:String(initialData.stopLoss||""),
      takeProfit:String(initialData.takeProfit||""),
      preImages:initialData.preImages||[],
    }:{})
  });
  const set=k=>e=>setF(p=>({...p,[k]:e.target.value}));
  const[initialSnapshot]=useState(()=>JSON.stringify(f));
  const{guardedClose,confirmEl}=useUnsavedGuard({dirty:JSON.stringify(f)!==initialSnapshot,busy:saving,onClose:onCancel});

  const product=useMemo(()=>{
    const pid=f.productId;
    if(pid.endsWith("_next")){const base=pid.replace("_next","");return products.find(p=>p.id===base);}
    return products.find(p=>p.id===pid);
  },[f.productId,products]);

  const selectedSeries=allSeries.find(s=>s.id===f.productId)||allSeries[0];

  const derived=useMemo(()=>{
    const contracts=+f.contracts||0;
    const ep=+f.entryPrice||0;
    const pv=calcPositionValue(product,contracts,ep);
    const gx=calcGearingX(pv,balance);
    const existingPV=(openTrades||[]).filter(t=>t.id!==initialData?.id&&t.status==="open")
      .reduce((s,t)=>{const p=resolveProduct(products,t.productId)||products.find(x=>t.productId.startsWith(x.id));return s+calcPositionValue(p,t.contracts,t.entryPrice);},0);
    const combinedGX=calcGearingX(existingPV+pv,balance);
    const vpc=product&&ep>0?product.contractSize*ep:0;
    const limit=GEARING_LIMITS[f.setupType]||5;
    const maxContracts=vpc>0?Math.floor(limit*balance/vpc):0;
    const tpPL=f.takeProfit&&product?calcNetPL(product,contracts,ep,+f.takeProfit,f.direction):null;
    const slPL=f.stopLoss&&product?calcNetPL(product,contracts,ep,+f.stopLoss,f.direction):null;
    const tpPct=tpPL&&balance?(tpPL/balance*100):null;
    const slPct=slPL&&balance?(slPL/balance*100):null;
    return{pv,gx,combinedGX,existingPV,vpc,limit,maxContracts,tpPL,slPL,tpPct,slPct};
  },[f.productId,f.contracts,f.entryPrice,f.stopLoss,f.takeProfit,f.direction,f.setupType,product,balance,openTrades,initialData]);

  const buildTrade=(status)=>({
    id:initialData?.id||uid(),status,
    productId:f.productId,direction:f.direction,
    contracts:+f.contracts,entryPrice:+f.entryPrice,
    currentPrice:+f.currentPrice||+f.entryPrice,
    stopLoss:f.stopLoss?+f.stopLoss:null,
    takeProfit:f.takeProfit?+f.takeProfit:null,
    openDateTime:f.openDateTime,setupType:f.setupType,preNote:f.preNote,
    preImages:f.preImages||[],postImages:[],partialCloses:[],
    isMerged:initialData?.isMerged||false,
    mergedFromIds:initialData?.mergedFromIds||[],
    subTrades:initialData?.subTrades||[],
    contractCode:initialData?.contractCode||(selectedSeries?.currentContract||product?.currentContract||null),
  });

  const submit=async(status)=>{
    if(!f.productId||!f.entryPrice||!f.contracts){
      showToast("กรุณากรอก Product, Entry Price และ Contracts","error");return;
    }
    if(status==="open"&&balance<=0){
      showToast("ยังไม่มียอดเงินใน Portfolio — ไปที่ Settings เพื่อฝากเงินก่อน","error");return;
    }
    if(status==="open"&&product){
      const reqMargin=calcMargin(product,+f.contracts);
      if(reqMargin>0&&balance<reqMargin){
        showToast(
          `ยอดเงินไม่เพียงพอ — ต้องการ ${fmtTHB(reqMargin,0)} ฿ (${+f.contracts} สัญญา × margin ${fmtTHB(product.initialMargin,0)} ฿)`,
          "error"
        );return;
      }
    }
    if(savingGuard.current)return;   // already saving — ignore re-fire (prevents duplicate new-open rows)
    savingGuard.current=true;setSaving(true);
    // SAVE-FIRST: the parent awaits a durable single-row write and unmounts this form on res.ok.
    // On failure the form stays mounted — re-enable and surface the error, never claim success.
    const res=await onSubmit(buildTrade(status));
    if(!res||!res.ok){
      savingGuard.current=false;setSaving(false);
      // Edit mode (initialData present) gets edit-specific wording; guard messages stay mode-agnostic.
      const failMsg=(res&&res.guard)?openFailMessage(res):(initialData?"บันทึกการแก้ไขไม่สำเร็จ — ลองใหม่อีกครั้ง":openFailMessage(res));
      showToast(failMsg,"error");
    }
  };

  // Cooldown banner: check if today had a big win trade
  const cooldownBanner=(()=>{
    const today2=new Date().toISOString().slice(0,10);
    const threshold=portfolio?.cooldownPct??20;
    const bigWin=(openTrades?.filter(t=>false)||[]) // placeholder - check closed trades via trades prop
    // Actually use trades from prop
    ;
    const recentBigWins=(trades||[]).filter(t=>{
      if(t.status!=="closed"||!t.exitDateTime)return false;
      if(t.exitDateTime.slice(0,10)!==today2)return false;
      const p=resolveProduct(products,t.productId);
      const n=calcNetPL(p,t.contracts,t.entryPrice,t.exitPrice,t.direction);
      return balance>0&&n/balance*100>=threshold;
    });
    if(!recentBigWins.length)return null;
    return(
      <div className="flex items-start gap-2 text-sm mt-2 bg-yellow/5 border border-yellow/30 rounded-xl px-3 py-2.5">
        <span className="text-xl flex-shrink-0">🧊</span>
        <div>
          <p className="font-semibold text-yellow">Cooldown Mode</p>
          <p className="text-xs text-muted mt-0.5">วันนี้ทำกำไรใหญ่แล้ว — ลด position size ลงครึ่งนึง เพื่อรักษากำไรไว้</p>
        </div>
      </div>
    );
  })();
  const gearingBanner=(()=>{
    const{combinedGX,limit,maxContracts}=derived;
    if(!derived.pv||!+f.contracts)return null;
    // Portfolio total gearing (this trade + all open positions)
    const portfolioGX=calcGearingX(derived.existingPV+derived.pv,balance);
    const thisGX=calcGearingX(derived.pv,balance);
    const overLimit=combinedGX>limit;
    const nearLimit=combinedGX>limit*0.7;
    const color=overLimit?"text-red":nearLimit?"text-yellow":"text-green";
    const bg=overLimit?"bg-red/5 border-red/20":nearLimit?"bg-yellow/5 border-yellow/20":"bg-green/5 border-green/20";
    const icon=overLimit?"⚠️":nearLimit?"⚡":"✓";
    return(
      <div className={`text-sm mt-2 border rounded-xl px-3 py-2.5 space-y-1 ${bg}`}>
        <div className={`flex items-center justify-between ${color}`}>
          <span>{icon} ไม้นี้</span>
          <span className="font-bold tabular-nums">{fmtGearing(thisGX)}</span>
        </div>
        <div className={`flex items-center justify-between ${overLimit?"text-red font-semibold":nearLimit?"text-yellow":"text-green"}`}>
          <span>📊 พอร์ตรวม</span>
          <span className="font-bold tabular-nums">{fmtGearing(portfolioGX)}</span>
        </div>
        {overLimit&&<div className="text-red/80 text-xs mt-1">เกิน {limit}X · แนะนำ max {maxContracts} สัญญา</div>}
        {!overLimit&&nearLimit&&<div className="text-yellow/80 text-xs mt-1">ใกล้ขีดจำกัด {limit}X ของ {f.setupType}</div>}
      </div>
    );
  })();

  const TOTAL_STEPS=isEdit?1:7;
  const canNext=(()=>{
    if(step===0)return!!f.productId&&!!f.direction;
    if(step===1)return!!f.setupType;
    if(step===2)return!!f.entryPrice&&+f.entryPrice>0;
    if(step===3)return!!f.contracts&&+f.contracts>0;
    return true;
  })();

  const nextStep=()=>{if(step<TOTAL_STEPS-1)setStep(s=>s+1);};
  const prevStep=()=>{if(step>0)setStep(s=>s-1);};

  const PRODUCT_ICONS={"s50":"🇹🇭","gold":"🥇","silver":"⚪","usdjpy":"💴"};
  const getIcon=(id)=>PRODUCT_ICONS[id.replace("_next","")]||"📊";

  if(isEdit){
    return(<>
      <Modal title="แก้ไข Order" onClose={guardedClose} width="max-w-xl">
        <div className="p-5 space-y-4">
          <div className="grid grid-cols-2 gap-3">
            <div><Label>Setup Type</Label>
              <select value={f.setupType} onChange={set("setupType")} className={clsInput}>
                {SETUP_TYPES.map(s=><option key={s}>{s}</option>)}
              </select>
            </div>
            <div><Label>Product</Label>
              <select value={f.productId} onChange={set("productId")} className={clsInput} disabled>
                {allSeries.map(s=><option key={s.id} value={s.id}>{s.name} ({s.currentContract}) — {s._seriesLabel}</option>)}
              </select>
            </div>
          </div>
          <div><Label>Direction</Label>
            <div className="flex gap-2">
              {["Long","Short"].map(d=>(
                <button key={d} type="button" onClick={()=>setF(p=>({...p,direction:d}))}
                  className={`flex-1 py-2.5 rounded-xl font-semibold text-sm transition ${f.direction===d?(d==="Long"?"bg-green text-black":"bg-red text-white"):"bg-input text-muted hover:text-txt"}`}>
                  {d==="Long"?"▲ Long":"▼ Short"}
                </button>
              ))}
            </div>
          </div>
          <div><Label>Entry Price</Label><input type="number" value={f.entryPrice} onChange={set("entryPrice")} className={clsInput+" no-spin"}/></div>
          <div><Label>Contracts</Label><input type="number" value={f.contracts} onChange={set("contracts")} className={clsInput+" no-spin"}/></div>
          <div className="grid grid-cols-2 gap-3">
            <div><Label>Stop Loss</Label><input type="number" value={f.stopLoss} onChange={set("stopLoss")} className={clsInput+" no-spin"}/></div>
            <div><Label>Take Profit</Label><input type="number" value={f.takeProfit} onChange={set("takeProfit")} className={clsInput+" no-spin"}/></div>
          </div>
          <div><Label>Open Date & Time</Label><input type="datetime-local" value={f.openDateTime} onChange={set("openDateTime")} className={clsInput}/></div>
          <div>
            <Label>Pre-trade Note</Label>
            <textarea value={f.preNote} onChange={set("preNote")} rows={8} className={clsNoteArea}/>
            <TemplateButtons kind="pre" onInsert={tpl=>setF(p=>({...p,preNote:appendTemplate(p.preNote,tpl)}))}/>
          </div>
        </div>
        <div className="flex gap-2 px-5 py-4 border-t border-border flex-shrink-0">
          <button onClick={guardedClose} className={clsBtn("default")}>ยกเลิก</button>
          <button onClick={()=>{if(!f.entryPrice||!f.contracts){showToast("กรุณากรอกข้อมูลให้ครบ","error");return;}onSubmit(buildTrade(initialData.status));}} className={`${clsBtn("yellow")} flex-1`}>✅ ยืนยันแก้ไข</button>
        </div>
      </Modal>
      {confirmEl}
    </>);
  }

  return(
    <div className="fixed inset-0 bg-black/85 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center">
      <div className="fade-in bg-card w-full sm:max-w-lg rounded-t-3xl sm:rounded-2xl border border-border shadow-2xl flex flex-col" style={{maxHeight:"96vh"}}>
        <div className="px-5 pt-5 pb-3 border-b border-border flex-shrink-0">
          <div className="flex items-center justify-between mb-3">
            <span className="text-muted text-xs font-medium">Step {step+1} / {TOTAL_STEPS}</span>
            <button onClick={guardedClose} disabled={saving} className="text-muted hover:text-txt transition text-xl w-8 h-8 flex items-center justify-center rounded-lg hover:bg-input disabled:opacity-30 disabled:cursor-not-allowed">✕</button>
          </div>
          <div className="flex gap-1">
            {Array.from({length:TOTAL_STEPS},(_,i)=>(
              <div key={i} className={`h-1 flex-1 rounded-full transition-all ${i<=step?"bg-yellow":"bg-input"}`}/>
            ))}
          </div>
        </div>

        <div className="flex-1 overflow-y-auto p-5">

          
          {step===0&&(
            <div className="space-y-5">
              <div>
                <p className="text-txt font-semibold text-lg mb-1">เลือก Product</p>
                <p className="text-muted text-sm mb-4">Active = series ปัจจุบัน · Next = series ถัดไป</p>
                <div className="grid grid-cols-2 gap-2.5">
                  {allSeries.map(s=>(
                    <button key={s.id} type="button" onClick={()=>setF(p=>({...p,productId:s.id}))}
                      className={`flex items-center gap-3 rounded-2xl p-4 border transition text-left ${f.productId===s.id?"border-yellow bg-yellow/10":"border-border bg-input/30 hover:border-border/80 hover:bg-input/50"}`}>
                      <span className="text-2xl">{getIcon(s.id)}</span>
                      <div className="min-w-0">
                        <div className="font-semibold text-sm text-txt">{s.currentContract}</div>
                        <div className="text-xs text-muted truncate">{s.name}</div>
                        <span className={`text-[10px] font-semibold px-1.5 py-0.5 rounded mt-0.5 inline-block ${s._seriesLabel==="Active"?"bg-green/10 text-green":"bg-muted/10 text-muted"}`}>{s._seriesLabel}</span>
                      </div>
                    </button>
                  ))}
                </div>
              </div>
              <div>
                <p className="text-txt font-semibold mb-2">Direction</p>
                <div className="flex gap-3">
                  {["Long","Short"].map(d=>(
                    <button key={d} type="button" onClick={()=>setF(p=>({...p,direction:d}))}
                      className={`flex-1 py-4 rounded-2xl font-bold text-lg transition ${f.direction===d?(d==="Long"?"bg-green text-black":"bg-red text-white"):"bg-input text-muted hover:text-txt border border-border"}`}>
                      {d==="Long"?"▲ Long":"▼ Short"}
                    </button>
                  ))}
                </div>
              </div>
            </div>
          )}

          
          {step===1&&(
            <div>
              <p className="text-txt font-semibold text-lg mb-1">Setup Type</p>
              <p className="text-muted text-sm mb-4">เลือกรูปแบบการเทรดครั้งนี้</p>
              <div className="grid grid-cols-2 gap-2.5">
                {SETUP_TYPES.map(s=>(
                  <button key={s} type="button" onClick={()=>setF(p=>({...p,setupType:s}))}
                    className={`py-4 px-3 rounded-2xl border font-semibold text-sm transition ${f.setupType===s?"border-yellow bg-yellow/10 text-yellow":"border-border bg-input/30 text-muted hover:text-txt hover:border-border/80"}`}>
                    {s}
                    <div className="text-xs font-normal mt-0.5 text-muted">{s!=="Other"&&GEARING_LIMITS[s]?`max ${GEARING_LIMITS[s]}X`:""}</div>
                  </button>
                ))}
              </div>
            </div>
          )}

          
          {step===2&&(
            <div className="space-y-4">
              <div className="flex items-center gap-2 text-muted text-sm">
                <span>{getIcon(f.productId)}</span>
                <span>{selectedSeries?.currentContract} · {f.direction==="Long"?"▲ Long":"▼ Short"} · {f.setupType}</span>
              </div>
              <p className="text-txt font-semibold text-lg">Entry Price</p>
              <input type="number" value={f.entryPrice} autoFocus
                onChange={e=>{const v=e.target.value;setF(p=>({...p,entryPrice:v,currentPrice:v}));}}
                placeholder={product?`0.${"0".repeat(product.digits||1)}`:"0"}
                className="w-full bg-input border border-border rounded-2xl px-5 py-5 text-txt text-3xl font-bold text-center focus:outline-none focus:border-yellow/60 no-spin tabular-nums"/>
              {product&&<p className="text-center text-muted text-xs">Tick size: {product.tickSize} · Tick value: {fmtTHB(product.tickValue,0)} ฿</p>}
            </div>
          )}

          
          {step===3&&(
            <div className="space-y-4">
              <div className="flex items-center gap-2 text-muted text-sm">
                <span>{getIcon(f.productId)}</span>
                <span>{selectedSeries?.currentContract} · Entry {fmtNum(+f.entryPrice||0,product?.digits)}</span>
              </div>
              <p className="text-txt font-semibold text-lg">Contracts ({productQuantityLabel(product)})</p>
              <div className="flex items-center gap-3">
                <button type="button" onClick={()=>setF(p=>({...p,contracts:String(Math.max(1,(+p.contracts||1)-1))}))}
                  className="w-14 h-14 rounded-2xl bg-input border border-border text-2xl font-bold flex items-center justify-center hover:bg-[#363c45] transition">−</button>
                <input type="number" value={f.contracts} onChange={set("contracts")}
                  className="flex-1 bg-input border border-border rounded-2xl px-4 py-4 text-txt text-3xl font-bold text-center focus:outline-none focus:border-yellow/60 no-spin tabular-nums"/>
                <button type="button" onClick={()=>setF(p=>({...p,contracts:String((+p.contracts||0)+1)}))}
                  className="w-14 h-14 rounded-2xl bg-input border border-border text-2xl font-bold flex items-center justify-center hover:bg-[#363c45] transition">+</button>
              </div>
              {cooldownBanner}
              {gearingBanner}
              {derived.pv>0&&(
                <div className="grid grid-cols-2 gap-3 mt-2">
                  <div className="bg-input/50 rounded-xl p-3"><span className="text-muted text-xs block">Position Value</span><span className="font-bold">{fmtTHB(derived.pv,0)} ฿</span></div>
                  <div className="bg-input/50 rounded-xl p-3"><span className="text-muted text-xs block">Max Contracts</span><span className="font-bold text-yellow">{derived.maxContracts} สัญญา</span></div>
                </div>
              )}
            </div>
          )}

          
          {step===4&&(
            <div className="space-y-4">
              <p className="text-txt font-semibold text-lg">Stop Loss & Take Profit</p>
              <p className="text-muted text-sm">ไม่บังคับ — กรอกเพื่อดู P/L Preview</p>
              <div>
                <Label>Take Profit</Label>
                <input type="number" value={f.takeProfit} onChange={set("takeProfit")} placeholder="—" className={clsInput+" no-spin"}/>
                {derived.tpPL!=null&&(
                  <div className="mt-2 bg-green/5 border border-green/20 rounded-xl px-4 py-3">
                    <span className="text-green font-bold text-lg">+{fmtTHB(derived.tpPL,0)} ฿</span>
                    {derived.tpPct!=null&&<span className="text-green/70 text-sm ml-2">({derived.tpPct>=0?"+":""}{derived.tpPct?.toFixed(1)}% ของพอร์ต)</span>}
                  </div>
                )}
              </div>
              <div>
                <Label>Stop Loss</Label>
                <input type="number" value={f.stopLoss} onChange={set("stopLoss")} placeholder="—" className={clsInput+" no-spin"}/>
                {derived.slPL!=null&&(
                  <div className="mt-2 bg-red/5 border border-red/20 rounded-xl px-4 py-3">
                    <span className="text-red font-bold text-lg">{fmtTHB(derived.slPL,0)} ฿</span>
                    {derived.slPct!=null&&<span className="text-red/70 text-sm ml-2">({derived.slPct>=0?"+":""}{derived.slPct?.toFixed(1)}% ของพอร์ต)</span>}
                  </div>
                )}
              </div>
            </div>
          )}

          
          {step===5&&(
            <div className="space-y-4">
              <p className="text-txt font-semibold text-lg">วันที่และเวลาเปิด Trade</p>
              <input type="datetime-local" value={f.openDateTime} onChange={set("openDateTime")} className={clsInput}/>
            </div>
          )}

          
          {step===6&&(
            <div className="space-y-4">
              <p className="text-txt font-semibold text-lg">บันทึก Pre-trade</p>
              <div>
                <Label>เหตุผลที่เข้า trade</Label>
                <textarea value={f.preNote} onChange={set("preNote")} rows={8} placeholder="เหตุผล, แนวรับ, pattern..." className={clsNoteArea}/>
                <TemplateButtons kind="pre" onInsert={tpl=>setF(p=>({...p,preNote:appendTemplate(p.preNote,tpl)}))}/>
              </div>
              <ImageUploader images={f.preImages} onChange={imgs=>setF(p=>({...p,preImages:imgs}))} label="📎 แนบรูป Pre-trade"/>
            </div>
          )}

          
          {step===TOTAL_STEPS-1&&step>=6&&(
            <div className="mt-4 space-y-3 border-t border-border pt-4">
              <p className="text-muted text-xs font-semibold uppercase tracking-wide">สรุป Order</p>
              {[
                ["Product",`${selectedSeries?.currentContract} (${selectedSeries?._seriesLabel})`],
                ["Direction",f.direction],["Setup",f.setupType],
                ["Entry",fmtNum(+f.entryPrice||0,product?.digits)],["Contracts",f.contracts],
                ["SL",f.stopLoss||"—"],["TP",f.takeProfit||"—"],
                ["เปิดเมื่อ",fmtDT(f.openDateTime)],
              ].map(([k,v])=>(
                <div key={k} className="flex justify-between text-sm">
                  <span className="text-muted">{k}</span><span className="font-medium">{v}</span>
                </div>
              ))}
              {/* Compact preview only — the editable textarea on the same step shows the full note.
                  Avoid duplicating the entire template body twice on one screen. */}
              {f.preNote
                ?(<div className="space-y-1">
                    <div className="flex justify-between text-[11px]">
                      <span className="text-muted">Pre-trade note</span>
                      <span className="text-muted/60">ดู/แก้ไขในกล่องด้านบน</span>
                    </div>
                    <div className="bg-input/40 rounded-xl px-3 py-2 text-xs text-muted whitespace-pre-wrap line-clamp-3">{f.preNote}</div>
                  </div>)
                :(<div className="text-muted/60 text-[11px]">Pre-trade note: empty</div>)
              }
            </div>
          )}
        </div>

        <div className="flex gap-2 px-5 py-4 border-t border-border flex-shrink-0">
          {step===0?(
            <button onClick={guardedClose} className={clsBtn("default")}>ยกเลิก</button>
          ):(
            <button onClick={prevStep} className={clsBtn("default")}>← ย้อนกลับ</button>
          )}
          {step<TOTAL_STEPS-1?(
            <button onClick={()=>{if(!canNext){showToast("กรุณากรอกข้อมูลให้ครบ","error");return;}nextStep();}}
              disabled={!canNext}
              className={`${clsBtn("yellow")} flex-1 disabled:opacity-30 disabled:cursor-not-allowed`}>ถัดไป →</button>
          ):(
            <>
              <button onClick={()=>submit("draft")} disabled={saving} className={clsBtn("default")+" disabled:opacity-40 disabled:cursor-not-allowed"}>{saving?"กำลังบันทึก…":"💾 Draft"}</button>
              <button onClick={()=>{if(saving)return;if(!f.entryPrice||!f.contracts){showToast("กรุณากรอกข้อมูลให้ครบ","error");return;}setShowChecklist(true);}}
                disabled={saving}
                className={`${clsBtn("yellow")} flex-1 disabled:opacity-40 disabled:cursor-not-allowed`}>✅ Open Trade</button>
            </>
          )}
        </div>
      </div>
      {showChecklist&&(
        <MindsetChecklistModal
          onConfirm={(missedItems)=>{
            setShowChecklist(false);
            if(missedItems&&missedItems.length>0){
              const riskNote="⚠️ เข้าไม้โดยไม่ผ่าน checklist:\n"+missedItems.map(t=>"• "+t).join("\n")+"\n---\n";
              setF(prev=>({...prev,preNote:riskNote+(prev.preNote||"")}));
            }
            submit("open");
          }}
          onSaveDraft={()=>{setShowChecklist(false);submit("draft");}}
          onCancel={()=>setShowChecklist(false)}
        />
      )}
      {confirmEl}
    </div>
  );
}

function CloseTradeForm({trade,product,onClose,onCancel,showToast}){
  const[f,setF]=useState({
    exitPrice:String(trade.currentPrice||trade.entryPrice||""),
    exitDateTime:localNow(),exitReason:"Manual",feeling:"😊",
    tradeRating:3,winLossReason:"",postNote:"",postImages:[],
  });
  const[saving,setSaving]=useState(false);
  const set=k=>e=>setF(p=>({...p,[k]:e.target.value}));
  const[initialSnapshot]=useState(()=>JSON.stringify(f));
  const{guardedClose,confirmEl}=useUnsavedGuard({dirty:JSON.stringify(f)!==initialSnapshot,busy:saving,onClose:onCancel});
  const pl=(product&&f.exitPrice)?calcNetPL(product,trade.contracts,trade.entryPrice,+f.exitPrice,trade.direction):null;
  const tickDiff=(product&&f.exitPrice&&trade.entryPrice)?Math.abs((+f.exitPrice-trade.entryPrice)/product.tickSize):0;
  const showPriceWarning=tickDiff>500;

  const handleSubmit=async()=>{
    if(!f.exitPrice){showToast("กรุณากรอก Exit Price","error");return;}
    if(saving)return;
    setSaving(true);
    const res=await onClose({...f,exitPrice:+f.exitPrice});
    // On durable success the parent unmounts this modal; re-enable only on failure.
    if(!res||!res.ok){setSaving(false);showToast(closeFailMessage(res),"error");}
  };

  return(<>
    <Modal title={`ปิด Order — ${product?.currentContract||"?"}`} onClose={guardedClose} width="max-w-lg" busy={saving}>
      <div className="p-5 space-y-4">
        <div className="bg-input/50 rounded-lg p-3 grid grid-cols-3 gap-3 text-sm">
          <div><span className="text-muted text-xs block">Entry</span><span className="font-semibold">{fmtNum(trade.entryPrice,product?.digits||1)}</span></div>
          <div><span className="text-muted text-xs block">Contracts</span><span className="font-semibold">{trade.contracts}</span></div>
          <div><span className="text-muted text-xs block">Direction</span><DirBadge dir={trade.direction}/></div>
        </div>
        <div className="grid grid-cols-2 gap-3">
          <div>
            <Label>Exit Price</Label>
            <input type="number" value={f.exitPrice} onChange={set("exitPrice")} className={clsInput+" no-spin "+(showPriceWarning?"border-red/60":"")}/>
          </div>
          <div className="bg-input/50 rounded-lg px-3 py-2 flex flex-col justify-center">
            <span className="text-muted text-xs">Net P/L (หัก commission)</span>
            <PLDisplay value={pl} className="text-base"/>
          </div>
        </div>
        {showPriceWarning&&(
          <div className="bg-red/10 border border-red/30 rounded-lg px-3 py-2 text-red text-sm">
            ⚠️ ราคาออกห่างเกิน 500 ticks ({tickDiff.toFixed(0)} ticks) — กรุณาตรวจสอบ
          </div>
        )}
        <div className="grid grid-cols-2 gap-3">
          <div><Label>Exit Date & Time</Label><input type="datetime-local" value={f.exitDateTime} onChange={set("exitDateTime")} className={clsInput}/></div>
          <div><Label>Exit Reason</Label><select value={f.exitReason} onChange={set("exitReason")} className={clsInput}>{EXIT_REASONS.map(r=><option key={r}>{r}</option>)}</select></div>
        </div>
        <div><Label>Trade Rating</Label><Stars value={f.tradeRating} onChange={v=>setF(p=>({...p,tradeRating:v}))}/></div>
        <div>
          <Label>Feeling</Label>
          <div className="flex gap-2">
            {FEELINGS.map(em=>(
              <button key={em} type="button" onClick={()=>setF(p=>({...p,feeling:em}))}
                className={`flex-1 py-2 text-xl rounded-lg transition ${f.feeling===em?"bg-yellow/10 ring-1 ring-yellow/40":"bg-input"}`}>{em}</button>
            ))}
          </div>
        </div>
        <div><Label>Win/Loss Reason</Label><textarea value={f.winLossReason} onChange={set("winLossReason")} rows={2} placeholder="เหตุผลที่ชนะ/แพ้..." className={clsInput+" resize-none"}/></div>
        <div>
          <Label>Post-trade Note</Label>
          <textarea value={f.postNote} onChange={set("postNote")} rows={8} placeholder="บทเรียนที่ได้รับ..." className={clsNoteArea}/>
          <TemplateButtons kind="post" onInsert={tpl=>setF(p=>({...p,postNote:appendTemplate(p.postNote,tpl)}))}/>
        </div>
        <ImageUploader images={f.postImages} onChange={imgs=>setF(p=>({...p,postImages:imgs}))} label="📎 แนบรูป Post-trade"/>
      </div>
      <div className="flex gap-2 px-5 py-4 border-t border-border flex-shrink-0">
        <button onClick={guardedClose} disabled={saving} className={clsBtn("default")+" disabled:opacity-30 disabled:cursor-not-allowed"}>ยกเลิก</button>
        <button onClick={handleSubmit} disabled={saving} className={`${clsBtn("red")} flex-1 disabled:opacity-50 disabled:cursor-not-allowed`}>{saving?"กำลังบันทึก…":"✕ ยืนยันปิด Order"}</button>
      </div>
    </Modal>
    {confirmEl}
  </>);
}

function MergedCloseForm({trade,product,onClose,onCancel,showToast}){
  const openSubs=useMemo(()=>{
    const closedBySubId={};
    (trade.partialCloses||[]).forEach(pc=>{
      closedBySubId[pc.subTradeId]=(closedBySubId[pc.subTradeId]||0)+pc.contracts;
    });
    return(trade.subTrades||[])
      .filter(st=>(closedBySubId[st.id]||0)<st.contracts)
      .map(st=>({...st,contracts:st.contracts-(closedBySubId[st.id]||0)}));
  },[trade.partialCloses,trade.subTrades]);
  const[items,setItems]=useState(()=>openSubs.map(st=>({
    subTradeId:st.id,contracts:st.contracts,entryPrice:st.entryPrice,selected:true,
    exitPrice:String(trade.currentPrice||st.entryPrice||""),exitDateTime:localNow(),exitReason:"Manual",
  })));
  // Declared BEFORE the all-done early-return so hook order is identical on every render
  // of this instance (Rules of Hooks). Shared by the partial path and the all-done branch.
  const[saving,setSaving]=useState(false);
  const handleConfirmClose=async(updated)=>{
    if(saving)return {ok:false};
    setSaving(true);
    const res=await onClose(updated);
    if(!res||!res.ok){setSaving(false);showToast(closeFailMessage(res),"error");}
    return res;
  };
  if(openSubs.length===0&&trade.isMerged)return(
    <Modal title="ปิด Order" onClose={onCancel} width="max-w-xs" busy={saving}>
      <div className="p-5 space-y-4 text-center">
        <div className="text-2xl">✅</div>
        <p className="text-sm text-txt">ปิดครบทุก contracts แล้ว</p>
        <div className="flex gap-2 justify-center">
          <button onClick={onCancel} disabled={saving} className={clsBtn("default")+" disabled:opacity-30 disabled:cursor-not-allowed"}>ยกเลิก</button>
          <button onClick={()=>handleConfirmClose({...trade,status:"closed"})} disabled={saving} className={clsBtn("yellow")+" disabled:opacity-50 disabled:cursor-not-allowed"}>{saving?"กำลังบันทึก…":"ยืนยันปิด Order"}</button>
        </div>
      </div>
    </Modal>
  );
  const[overall,setOverall]=useState({
    tradeRating:trade.tradeRating||3,feeling:trade.feeling||"😊",
    winLossReason:trade.winLossReason||"",postNote:trade.postNote||"",postImages:trade.postImages||[],
  });
  const updateItem=(idx,field,value)=>setItems(prev=>prev.map((it,i)=>i===idx?{...it,[field]:value}:it));
  const[initialSnapshot]=useState(()=>JSON.stringify({items,overall}));
  const{guardedClose,confirmEl}=useUnsavedGuard({dirty:JSON.stringify({items,overall})!==initialSnapshot,busy:saving,onClose:onCancel});
  const sel=items.filter(it=>it.selected);
  const totalC=sel.reduce((s,it)=>s+it.contracts,0);
  const totalPL=sel.reduce((s,it)=>{
    if(!it.exitPrice||!product)return s;
    return s+calcNetPL(product,it.contracts,it.entryPrice,+it.exitPrice,trade.direction);
  },0);
  const contractOffset=(trade.partialCloses||[]).length;
  const handleSubmit=async()=>{
    if(!sel.length){showToast("กรุณาเลือกอย่างน้อย 1 contract","error");return;}
    if(sel.find(it=>!it.exitPrice||+it.exitPrice<=0)){showToast("กรุณากรอก Exit Price ให้ครบ","error");return;}
    const newPCs=sel.map(it=>({
      id:uid(),subTradeId:it.subTradeId,contracts:it.contracts,
      exitPrice:+it.exitPrice,exitDateTime:it.exitDateTime,exitReason:it.exitReason,
      pl:calcNetPL(product,it.contracts,it.entryPrice,+it.exitPrice,trade.direction),
    }));
    const allPCs=[...(trade.partialCloses||[]),...newPCs];
    const closedC=allPCs.reduce((s,pc)=>s+pc.contracts,0);
    const remaining=Math.max(0,trade.contracts-closedC);
    const allDone=remaining===0;
    const avgExit=allPCs.reduce((s,pc)=>s+pc.exitPrice*pc.contracts,0)/trade.contracts;
    const updated={
      ...trade,partialCloses:allPCs,remainingContracts:remaining,status:allDone?"closed":"open",
      ...(allDone?{
        exitPrice:+avgExit.toFixed(product?.digits||1),
        exitDateTime:newPCs[newPCs.length-1].exitDateTime,exitReason:"Manual",
        feeling:overall.feeling,tradeRating:overall.tradeRating,
        winLossReason:overall.winLossReason,postNote:overall.postNote,postImages:overall.postImages,
      }:{}),
    };
    // Durable save via the parent; success toast + modal-close happen only after ok.
    await handleConfirmClose(updated);
  };
  return(<>
    <Modal title={`ปิด ${product?.currentContract||"?"} — ${trade.contracts} contracts total`} onClose={guardedClose} width="max-w-xl" busy={saving}>
      <div className="p-5 space-y-5">
        {(trade.partialCloses||[]).length>0&&(
          <div className="bg-input/40 rounded-lg px-3 py-2.5 text-xs text-muted">
            <span className="font-medium text-orange">ปิดไปแล้ว: </span>
            {(trade.partialCloses||[]).map((pc,i)=>(
              <span key={pc.id} className="mr-2">Contract {i+1} @{fmtNum(pc.exitPrice,product?.digits)}
                <span className={pc.pl>=0?" text-green":" text-red"}> ({pc.pl>=0?"+":""}{fmtTHB(pc.pl,0)}฿)</span>
              </span>
            ))}
          </div>
        )}
        <div>
          <Label>เลือก Contracts ที่ต้องการปิดในครั้งนี้</Label>
          <div className="space-y-3">
            {items.map((item,idx)=>{
              const p=item.exitPrice&&product?calcNetPL(product,item.contracts,item.entryPrice,+item.exitPrice,trade.direction):null;
              return(
                <div key={item.subTradeId} className={`rounded-xl p-3 border transition ${item.selected?"border-yellow/30 bg-yellow/5":"border-border bg-input/20"}`}>
                  <div className="flex items-center gap-3 mb-2">
                    <input type="checkbox" checked={item.selected} onChange={e=>updateItem(idx,"selected",e.target.checked)} className="w-4 h-4 accent-yellow cursor-pointer flex-shrink-0"/>
                    <span className="font-semibold text-sm">Contract {idx+1+contractOffset}</span>
                    <span className="text-muted text-xs">{item.contracts} สัญญา @ entry {fmtNum(item.entryPrice,product?.digits)}</span>
                    {p!==null&&<PLDisplay value={p} className="text-xs ml-auto"/>}
                  </div>
                  {item.selected&&(
                    <div className="grid grid-cols-3 gap-2">
                      <div><Label>Exit Price</Label><input type="number" value={item.exitPrice} onChange={e=>updateItem(idx,"exitPrice",e.target.value)} className={clsInput+" no-spin text-xs py-1.5"}/></div>
                      <div><Label>วันที่/เวลา</Label><input type="datetime-local" value={item.exitDateTime} onChange={e=>updateItem(idx,"exitDateTime",e.target.value)} className={clsInput+" text-xs py-1.5"}/></div>
                      <div><Label>Exit Reason</Label><select value={item.exitReason} onChange={e=>updateItem(idx,"exitReason",e.target.value)} className={clsInput+" text-xs py-1.5"}>{EXIT_REASONS.map(r=><option key={r}>{r}</option>)}</select></div>
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </div>
        {sel.length>0&&(
          <div className="bg-input/50 rounded-lg p-3 flex items-center justify-between">
            <span className="text-muted text-sm">Net P/L รวม ({totalC} สัญญา)</span>
            <PLDisplay value={totalPL} className="text-base"/>
          </div>
        )}
        <div className="border-t border-border pt-4 space-y-3">
          <p className="text-muted text-xs font-medium uppercase tracking-wide">Overall Assessment</p>
          <div><Label>Trade Rating</Label><Stars value={overall.tradeRating} onChange={v=>setOverall(p=>({...p,tradeRating:v}))}/></div>
          <div>
            <Label>Feeling</Label>
            <div className="flex gap-2">
              {FEELINGS.map(em=>(
                <button key={em} type="button" onClick={()=>setOverall(p=>({...p,feeling:em}))}
                  className={`flex-1 py-2 text-xl rounded-lg transition ${overall.feeling===em?"bg-yellow/10 ring-1 ring-yellow/40":"bg-input"}`}>{em}</button>
              ))}
            </div>
          </div>
          <div><Label>Win/Loss Reason</Label><textarea value={overall.winLossReason} onChange={e=>setOverall(p=>({...p,winLossReason:e.target.value}))} rows={2} placeholder="เหตุผล..." className={clsInput+" resize-none"}/></div>
          <div>
            <Label>Post-trade Note</Label>
            <textarea value={overall.postNote} onChange={e=>setOverall(p=>({...p,postNote:e.target.value}))} rows={8} placeholder="บทเรียน..." className={clsNoteArea}/>
            <TemplateButtons kind="post" onInsert={tpl=>setOverall(p=>({...p,postNote:appendTemplate(p.postNote,tpl)}))}/>
          </div>
          <ImageUploader images={overall.postImages} onChange={imgs=>setOverall(p=>({...p,postImages:imgs}))} label="📎 แนบรูป Post-trade"/>
        </div>
      </div>
      <div className="flex gap-2 px-5 py-4 border-t border-border flex-shrink-0">
        <button onClick={guardedClose} disabled={saving} className={clsBtn("default")+" disabled:opacity-30 disabled:cursor-not-allowed"}>ยกเลิก</button>
        <button onClick={handleSubmit} disabled={saving||!sel.length}
          className={`${clsBtn("red")} flex-1 disabled:opacity-30 disabled:cursor-not-allowed`}>
          {saving?"กำลังบันทึก…":`✕ ปิด ${totalC} contracts ที่เลือก`}
        </button>
      </div>
    </Modal>
    {confirmEl}
  </>);
}

function TemplateButtons({kind,onInsert}){
  const quick=kind==="pre"?PRE_TRADE_QUICK_TEMPLATE:POST_TRADE_QUICK_TEMPLATE;
  const full =kind==="pre"?PRE_TRADE_FULL_TEMPLATE :POST_TRADE_FULL_TEMPLATE;
  return(
    <div className="flex gap-2 mt-1.5">
      <button type="button" onClick={()=>onInsert(quick)}
        className={clsBtn("ghost","sm")+" text-[11px]"}>ใส่ Quick template</button>
      <button type="button" onClick={()=>onInsert(full)}
        className={clsBtn("ghost","sm")+" text-[11px]"}>ใส่ Full template</button>
    </div>
  );
}

function NoteField({label,value,onSave,editable=true,templateKind,onDirtyChange}){
  const[editing,setEditing]=useState(false);
  const[draft,setDraft]=useState(value||"");
  const[saving,setSaving]=useState(false);
  // Surface unsaved-typed state to an optional parent guard. Dirty = actively editing with a changed draft.
  useEffect(()=>{onDirtyChange&&onDirtyChange(editing&&draft!==(value||""));},[editing,draft,value,onDirtyChange]);
  const start=()=>{setDraft(value||"");setEditing(true);};
  const cancel=()=>setEditing(false);
  // Await onSave so a durable-save failure keeps the editor open instead of falsely claiming saved.
  // Legacy sync callers return undefined → treated as success (close), preserving existing behavior.
  const save=async()=>{
    if(saving)return;
    setSaving(true);
    const res=await onSave(draft);
    setSaving(false);
    if(res&&res.ok===false)return;   // explicit failure (incl. busy) → keep editing open
    setEditing(false);
  };
  if(editing){
    return(
      <div>
        <span className="text-muted text-xs font-medium block mb-1.5">{label}</span>
        <textarea value={draft} onChange={e=>setDraft(e.target.value)} rows={templateKind?8:3} autoFocus
          className={(templateKind?clsNoteArea:(clsInput+" resize-none"))+" text-sm"}/>
        {templateKind&&<TemplateButtons kind={templateKind} onInsert={tpl=>setDraft(d=>appendTemplate(d,tpl))}/>}
        <div className="flex gap-2 mt-2">
          <button onClick={cancel} disabled={saving} className={clsBtn("default","sm")}>ยกเลิก</button>
          <button onClick={save} disabled={saving} className={clsBtn("yellow","sm")}>{saving?"กำลังบันทึก...":"💾 บันทึก"}</button>
        </div>
      </div>
    );
  }
  return(
    <div className="group relative">
      <div className="flex items-center justify-between mb-1.5">
        <span className="text-muted text-xs font-medium">{label}</span>
        {editable&&<button onClick={start}
          className="opacity-0 group-hover:opacity-100 transition-opacity text-xs text-muted hover:text-yellow px-1">✏️</button>}
      </div>
      {value
        ?<p onClick={editable?start:undefined}
            className={`text-sm text-txt leading-relaxed whitespace-pre-wrap bg-input/30 rounded-lg px-3 py-2.5 ${editable?"cursor-pointer hover:bg-input/50 transition-colors":""}`}>
            {value}
          </p>
        :(editable
          ?<button onClick={start}
              className="text-sm text-muted/50 hover:text-muted transition-colors py-1.5 px-1">
              + เพิ่ม note...
            </button>
          :null)
      }
    </div>
  );
}

function TradeDetailModal({trade,product,onClose,onCommitUpdate,onDelete,showConfirm,showToast}){
  const[lightbox,setLightbox]=useState(null);
  // Esc closes the image lightbox (the Modal itself has no Esc handler, so this is conflict-free).
  React.useEffect(()=>{
    if(!lightbox)return;
    const onKey=(e)=>{if(e.key==="Escape"){e.stopPropagation();setLightbox(null);}};
    window.addEventListener("keydown",onKey);
    return()=>window.removeEventListener("keydown",onKey);
  },[lightbox]);
  const isEditable=!!onCommitUpdate;
  const grossPL=trade.exitPrice!=null?calcPL(product,trade.contracts,trade.entryPrice,trade.exitPrice,trade.direction):null;
  const netPL=trade.exitPrice!=null?calcNetPL(product,trade.contracts,trade.entryPrice,trade.exitPrice,trade.direction):null;
  const preImages=trade.preImages||[];
  const postImages=trade.postImages||[];

  // Durable single-row meta save. CRITICAL in-flight guard: each call builds a WHOLE-row payload
  // from the current `trade` prop, and db.saveTrade upserts that whole row. If a second save ran
  // before the parent refreshed props, it would rebuild from the STALE prop and overwrite the
  // first edit (data loss). So while a save is in flight we BLOCK (not enqueue) the second attempt.
  const metaSavingRef=React.useRef(false);
  const[metaSaving,setMetaSaving]=React.useState(false);
  const commitMeta=async(updated)=>{
    if(!onCommitUpdate)return {ok:false};
    if(metaSavingRef.current){   // in-flight: do NOT build a second whole-row payload from stale props
      showToast&&showToast("กำลังบันทึก...","info");
      return {ok:false,busy:true};
    }
    metaSavingRef.current=true;setMetaSaving(true);
    try{
      const res=await onCommitUpdate(updated);
      if(!res||!res.ok)showToast&&showToast("บันทึกไม่สำเร็จ ลองอีกครั้ง","error");
      return res;
    }finally{metaSavingRef.current=false;setMetaSaving(false);}
  };
  const saveNote=(field)=>(val)=>commitMeta({...trade,[field]:val});

  const ImageSection=({images,note,label})=>{
    if(!images.length&&!note)return null;
    return(
      <div>
        <span className="text-muted text-xs font-medium block mb-2">{label}</span>
        {images.length>0&&(
          <div className={`grid gap-2 ${images.length===1?"grid-cols-1":images.length===2?"grid-cols-2":"grid-cols-3"}`}>
            {images.map((src,i)=>(
              <div key={i}
                onClick={()=>setLightbox({src,caption:label+" "+(i+1)+"/"+images.length})}
                className="cursor-zoom-in rounded-xl overflow-hidden bg-black/20 relative group">
                <ResolvedImage src={src} className="w-full object-cover rounded-xl transition group-hover:opacity-90"
                  style={{height:images.length===1?"auto":160,display:"block",minHeight:images.length===1?120:"auto"}}/>
                <div className="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 transition">
                  <span className="text-white/90 bg-black/50 rounded-full px-3 py-1 text-xs">🔍 ขยาย</span>
                </div>
              </div>
            ))}
          </div>
        )}
        {note&&<p className="text-sm text-muted leading-relaxed whitespace-pre-wrap mt-2 bg-input/30 rounded-lg px-3 py-2">{note}</p>}
      </div>
    );
  };

  const[editMode,setEditMode]=React.useState(false);
  const[editFields,setEditFields]=React.useState({setupType:trade.setupType||"",exitReason:trade.exitReason||"",tradeRating:trade.tradeRating||0,feeling:trade.feeling||""});
  const[noteDirty,setNoteDirty]=React.useState({});   // {pre?,post?} — NoteField typed-but-uncommitted drafts (folded into guardedClose below)
  // Closed-trade correction v1: ONLY manual, standalone, fully-closed trades — exclude merged / partial / MT5-broker.
  // P/L is derived from exitPrice at render (tradeNetPL → calcNetPL), so a corrected exitPrice recomputes everywhere; nothing persisted to migrate.
  const isCorrectable=trade.status==="closed"&&trade.exitPrice!=null&&!trade.isMerged&&!(trade.partialCloses&&trade.partialCloses.length)&&trade.brokerProfit==null;
  const[correction,setCorrection]=React.useState({exitPrice:trade.exitPrice!=null?String(trade.exitPrice):"",exitDateTime:trade.exitDateTime||""});
  function saveEdits(){
    let payload={...trade,...editFields};
    if(isCorrectable){
      const px=Number(correction.exitPrice);
      if(!Number.isFinite(px)||px<=0){showToast&&showToast("ราคาปิดต้องเป็นตัวเลขมากกว่า 0","error");return;}   // reject empty / 0 / negative / NaN
      payload={...payload,exitPrice:px,exitDateTime:correction.exitDateTime||trade.exitDateTime};   // empty datetime → keep existing (never erase)
    }
    commitMeta(payload).then(res=>{if(res&&res.ok)setEditMode(false);});
  }
  // V1.1 unsaved guard for editMode accumulated fields ONLY. editDirty compares editFields to the
  // CURRENT trade prop (which updates after a successful save → not dirty on re-edit). Gated by editMode,
  // so view mode and immediately-saved notes/images never trigger it. Lightbox close stays independent.
  const editDirty=editMode&&JSON.stringify(editFields)!==JSON.stringify({setupType:trade.setupType||"",exitReason:trade.exitReason||"",tradeRating:trade.tradeRating||0,feeling:trade.feeling||""});
  // Correction inputs live in the editMode panel; numeric compare of exitPrice vs the CURRENT trade prop (so "2715.0"==2715, and not dirty after save).
  const correctionDirty=editMode&&isCorrectable&&(Number(correction.exitPrice)!==trade.exitPrice||(correction.exitDateTime||"")!==(trade.exitDateTime||""));
  const anyNoteDirty=!!(noteDirty.pre||noteDirty.post);   // a NoteField has a typed, uncommitted draft
  // Modal close (backdrop / ✕ / ปิด) loses editFields, the correction inputs, and any open note draft → guard on any.
  const{guardedClose,confirmEl}=useUnsavedGuard({dirty:editDirty||correctionDirty||anyNoteDirty,busy:metaSaving,onClose});
  // Exiting editMode (ยกเลิก) discards editFields + correction inputs (both in the editMode panel); note draft survives → exclude it.
  const{guardedClose:guardedCancelEdit,confirmEl:cancelEditConfirmEl}=useUnsavedGuard({dirty:editDirty||correctionDirty,busy:metaSaving,onClose:()=>setEditMode(false)});
  return(
    <>
      <Modal title={`รายละเอียด — ${trade.contractCode||product?.currentContract||"—"}`} onClose={guardedClose} width="max-w-lg">
        <div className="p-5 space-y-4">

            <DirBadge dir={trade.direction}/><StatusBadge status={trade.status}/>
            {trade.isMerged&&<span className="px-2 py-0.5 rounded text-xs font-semibold bg-yellow/10 text-yellow border border-yellow/20">⊕ Merged</span>}
          </div>
          <div className="grid grid-cols-2 gap-2 text-sm">
            {[
              ["Product",product?.name||"—"],["Contract",trade.contractCode||product?.currentContract||"—"],
              ["Contracts",String(trade.contracts)],["Direction",trade.direction],
              ["Entry Price",fmtNum(trade.entryPrice,product?.digits)],
              ["Exit Price",trade.exitPrice!=null?fmtNum(trade.exitPrice,product?.digits):"—"],
              ["Gross P/L","__GROSS__"],["Net P/L","__NET__"],
              ["Duration",duration(trade.openDateTime,trade.exitDateTime)],
              ["Setup",trade.setupType||"—"],["Exit Reason",trade.exitReason||"—"],
              ["Commission",(product&&trade.contracts)?`-${fmtTHB(getRoundTripComm(product)*trade.contracts,0)} ฿`:"—"],
            ].map(([lbl,val])=>(
              <div key={lbl} className="bg-input/40 rounded-lg px-3 py-2">
                <span className="text-muted text-xs block">{lbl}</span>
                {val==="__GROSS__"?<PLDisplay value={grossPL} className="text-sm"/>
                 :val==="__NET__"?<PLDisplay value={netPL} className="text-sm font-bold"/>
                 :<span className="font-medium">{val}</span>}
              </div>
            ))}
          </div>
          {trade.tradeRating>0&&<div><span className="text-muted text-xs block mb-1">Rating</span><Stars value={trade.tradeRating}/></div>}
          {trade.feeling&&<div><span className="text-muted text-xs block mb-1">Feeling</span><span className="text-2xl">{trade.feeling}</span></div>}
          {trade.winLossReason&&<div><span className="text-muted text-xs block mb-1">Win/Loss Reason</span><p className="text-sm bg-input/40 rounded-lg px-3 py-2">{trade.winLossReason}</p></div>}

          {isEditable?(
            <>
              <ImageUploader
                images={preImages}
                onChange={imgs=>{commitMeta({...trade,preImages:imgs});}}
                onPreview={src=>setLightbox({src,caption:"📸 Pre-trade"})}
                label="📸 Pre-trade รูป"/>
              <NoteField label="📸 Pre-trade Note" value={trade.preNote} onSave={saveNote("preNote")} editable={true} templateKind="pre" onDirtyChange={d=>setNoteDirty(m=>m.pre===d?m:{...m,pre:d})}/>
              <ImageUploader
                images={postImages}
                onChange={imgs=>{commitMeta({...trade,postImages:imgs});}}
                onPreview={src=>setLightbox({src,caption:"📝 Post-trade"})}
                label="📝 Post-trade รูป"/>
              <NoteField label="📝 Post-trade Note" value={trade.postNote} onSave={saveNote("postNote")} editable={true} templateKind="post" onDirtyChange={d=>setNoteDirty(m=>m.post===d?m:{...m,post:d})}/>
            </>
          ):(
            <>
              <ImageSection images={preImages} note={trade.preNote} label="📸 Pre-trade"/>
              <ImageSection images={postImages} note={trade.postNote} label="📝 Post-trade"/>
            </>
          )}

          {trade.isMerged&&(trade.subTrades||[]).length>0&&(
            <div>
              <span className="text-muted text-xs block mb-2">Sub-trade Breakdown</span>
              <div className="space-y-1.5">
                {(trade.subTrades||[]).map((s,i)=>{
                  const spl=s.exitPrice!=null?calcNetPL(product,s.contracts,s.entryPrice,s.exitPrice,trade.direction):null;
                  return(
                    <div key={s.id} className="flex items-center justify-between bg-input/40 rounded-lg px-3 py-2 text-sm">
                      <span className="text-muted">Contract {i+1}</span>
                      <span>{s.contracts} contracts @ {fmtNum(s.entryPrice,product?.digits)}</span>
                      <PLDisplay value={spl} className="text-xs"/>
                    </div>
                  );
                })}
              </div>
            </div>
          )}
        </div>
        <div className="px-5 py-4 border-t border-border flex-shrink-0 space-y-2">
          {editMode&&(
            <div className="bg-input/30 border border-border rounded-xl p-3 space-y-2">
              <div className="text-muted text-xs font-semibold mb-1">✏️ แก้ไขข้อมูล</div>

                  <label className="text-muted text-[10px] block mb-1">Exit Reason</label>
                  <input value={editFields.exitReason} onChange={e=>setEditFields(p=>({...p,exitReason:e.target.value}))} className={clsInput+" text-xs py-1"} placeholder="TP/SL/manual..."/>
                </div>

                <button onClick={guardedCancelEdit} className={clsBtn("ghost")}>ยกเลิก</button></>
            }
            <button onClick={guardedClose} className={clsBtn("default")+" flex-1"}>ปิด</button>
          </div>

function UpdatePriceModal({trade,product,onSubmit,onCancel}){
  const[price,setPrice]=useState(String(trade.currentPrice||trade.entryPrice||""));
  const[busy,setBusy]=useState(false);
  const pl=price?calcPL(product,trade.contracts,trade.entryPrice,+price,trade.direction):null;
  const submit=async()=>{
    if(!price||busy)return;   // minimal busy guard: blocks double-submit
    setBusy(true);
    const res=await onSubmit(+price);   // parent awaits durable update; clears modal only on ok
    if(!res||!res.ok)setBusy(false);    // success unmounts the modal; re-enable only on failure
  };
  return(
    <Modal title={`บันทึกราคา — ${product?.currentContract||"?"}`} onClose={onCancel} width="max-w-xs">
      <div className="p-5 space-y-3">
        <div><Label>Current Price</Label><input type="number" value={price} onChange={e=>setPrice(e.target.value)} className={clsInput+" no-spin"} autoFocus/></div>
        <div className="text-sm text-muted">Entry: <span className="text-txt">{fmtNum(trade.entryPrice,product?.digits)}</span></div>
        {pl!==null&&<div className="bg-input/50 rounded-lg px-3 py-2"><span className="text-muted text-xs block">Unrealized P/L</span><PLDisplay value={pl}/></div>}
      </div>
      <div className="flex gap-2 px-5 py-4 border-t border-border flex-shrink-0">
        <button onClick={onCancel} disabled={busy} className={clsBtn("default")}>ยกเลิก</button>
        <button onClick={submit} disabled={busy} className={`${clsBtn("yellow")} flex-1`}>{busy?"กำลังบันทึก…":"💾 บันทึกราคา"}</button>
      </div>
    </Modal>
  );
}

const fetchYahooPrice=async(sym)=>{
  try{
    const r=await fetch(`/.netlify/functions/price?sym=${encodeURIComponent(sym)}`,{cache:"no-store"});
    if(!r.ok)throw new Error("status "+r.status);
    const d=await r.json();
    if(d?.price!=null&&!isNaN(d.price))return+d.price;
    throw new Error("no price in response");
  }catch(e){throw new Error("price fetch failed: "+e.message);}
};

// Live prices — Supabase realtime + Netlify cron fallback
function useLivePrices(products,openTrades){
  const[livePrices,setLivePrices]=useState(()=>{try{return JSON.parse(localStorage.getItem("tj_live_prices")||"{}");}catch{return{};}});
  const[liveTimestamps,setLiveTimestamps]=useState({});
  const[liveErrors,setLiveErrors]=useState({});
  const[fetching,setFetching]=useState(false);
  const fetchingRef=useRef(false);
  const productsRef=useRef(products);
  useEffect(()=>{productsRef.current=products;},[products]);

  const applyPrices=useCallback((newPrices,newTs)=>{
    try{localStorage.setItem("tj_live_prices",JSON.stringify(newPrices));}catch{}
    setLivePrices(prev=>({...prev,...newPrices}));
    setLiveTimestamps(prev=>({...prev,...newTs}));
  },[]);

  const fetchFromSupabase=useCallback(async()=>{
    try{
      const{prices,timestamps}=await db.loadLivePrices();
      if(Object.keys(prices).length>0){applyPrices(prices,timestamps);return true;}
    }catch{}
    return false;
  },[applyPrices]);

  const fetchNow=useCallback(async()=>{
    if(fetchingRef.current)return;
    fetchingRef.current=true;setFetching(true);
    await fetchFromSupabase();
    fetchingRef.current=false;setFetching(false);
  },[fetchFromSupabase]);

  useEffect(()=>{
    fetchNow();
    const channel=SUPA.channel("live_prices_rt")
      .on("postgres_changes",{event:"*",schema:"public",table:"live_prices"},()=>fetchFromSupabase())
      .subscribe();
    // Realtime is the PRIMARY live-price path. This setInterval is only a fallback
    // that re-syncs in case the realtime channel disconnects silently. The
    // visibility-change listener below also forces a fresh fetch when the tab
    // becomes visible. 5-minute cadence keeps Supabase reads low while still
    // self-healing on realtime drop.
    const t=setInterval(()=>{if(!document.hidden)fetchNow();},5*60*1000);
    const v=()=>{if(!document.hidden)fetchNow();};
    document.addEventListener("visibilitychange",v);
    return()=>{SUPA.removeChannel(channel);clearInterval(t);document.removeEventListener("visibilitychange",v);};
  },[fetchNow,fetchFromSupabase]);

  return{prices:livePrices,timestamps:liveTimestamps,errors:liveErrors,fetchNow,fetching};
}

function TVWidget({tvSymbol,productId}){
  const idRef=useRef(`tv_${productId}_${Math.random().toString(36).slice(2)}`);
  const containerRef=useRef();
  const loadedRef=useRef(false);
  useEffect(()=>{
    if(!containerRef.current||loadedRef.current)return;
    loadedRef.current=true;
    containerRef.current.id=idRef.current;
    const load=()=>{
      if(!window.TradingView||!containerRef.current)return;
      new window.TradingView.widget({
        autosize:true,symbol:tvSymbol,interval:"15",
        timezone:"Asia/Bangkok",theme:"dark",style:"1",locale:"th",
        toolbar_bg:"#1E2329",enable_publishing:false,
        hide_side_toolbar:true,hide_top_toolbar:false,
        container_id:idRef.current,
      });
    };
    if(window.TradingView){load();return;}
    // Only add script once globally
    if(!document.getElementById("tv-script")){
      const script=document.createElement("script");
      script.id="tv-script";
      script.src="https://s3.tradingview.com/tv.js";
      script.async=true;
      script.onload=()=>document.querySelectorAll("[data-tv-pending]").forEach(el=>{
        el.removeAttribute("data-tv-pending");

    // Poll until TradingView loaded
    const poll=setInterval(()=>{if(window.TradingView){clearInterval(poll);load();}},300);
    return()=>clearInterval(poll);
  },[]);// run once only
  return<div ref={containerRef} style={{height:220}} className="rounded-lg overflow-hidden tv-widget-wrap"/>;
}

    buckets.get(key).push(t.id);

  const buckets=new Map();

function PagePositions({trades,products,productRegistry,balance,portfolio,onCommitOpen,onCommitExecuteDraft,onCommitClose,onCommitUpdate,onCommitMerge,onDeleteTrade,showConfirm,showToast,livePrices:livePricesProp,liveTimestamps:liveTimestampsProp,liveErrors:liveErrorsProp,fetchPricesFn}){

  const draftTrades=useMemo(()=>trades.filter(t=>t.status==="draft"),[trades]);

  // G2 render-only trade-group mock — READ-ONLY flag; no code writes tj_trade_group_mock. Default off.
  const mockGroupsOn=useMemo(()=>{try{return localStorage.getItem("tj_trade_group_mock")==="1";}catch{return false;}},[]);
  const mockGroups=useMemo(()=>mockGroupsOn?getTradeMockGroups(openTrades):[],[mockGroupsOn,openTrades]);
  // G2 grouping preview UI v0.1 — READ-ONLY flag; no code writes tj_trade_group_ui_v01. Default off.
  const groupUiV01On=useMemo(()=>{try{return localStorage.getItem("tj_trade_group_ui_v01")==="1";}catch{return false;}},[]);

  const livePrices=livePricesProp||{};
  const liveTimestamps=liveTimestampsProp||{};
  const liveErrors=liveErrorsProp||{};

  const totalPV=useMemo(()=>{
    if(!openTrades.length)return 0;
    return openTrades.reduce((s,t)=>{const p=resolveProduct(products,t.productId);return s+calcPositionValue(p,t.contracts,t.entryPrice);},0);
  },[openTrades,products]);
  const totalGearingX=useMemo(()=>calcGearingX(totalPV,balance),[totalPV,balance]);

    const avgCurrent=sel.reduce((s,t)=>s+(t.currentPrice||t.entryPrice)*t.contracts,0)/totalC;
    const base=sel[0];
    const p=products.find(p=>p.id===base.productId);
    const digs=p?.digits||1;
    const merged={
      ...base,id:uid(),contracts:totalC,
      entryPrice:+avgEntry.toFixed(digs),currentPrice:+avgCurrent.toFixed(digs),
      isMerged:true,mergedFromIds:mergeIds,preImages:[],partialCloses:[],
      remainingContracts:totalC,
      preNote:`[Merged ${sel.length} positions — avg entry ${avgEntry.toFixed(digs)}]\n`
        +sel.map(t=>`• ${t.contracts} contracts @${t.entryPrice}`).join("\n"),
      subTrades:sel.map(t=>({id:t.id,contracts:t.contracts,entryPrice:t.entryPrice,exitPrice:null})),

    // P2-1B: durable merge (merged-first + marker repair) replaces the old local-only
    // forEach(onDeleteTrade)+onAddTrade that relied on the full-array autosave for persistence.
    const sourceIds=sel.map(t=>t.id);

            <button onClick={()=>setShowForm(true)}
              className="px-5 py-2.5 rounded-xl font-bold text-sm bg-yellow text-black hover:bg-yellow/90 transition ml-auto">
              + เปิด Order
            </button>
          </div>
        </div>
        {/* Stats row */}
        <div className="px-5 py-3 flex gap-6 overflow-x-auto">
              <div className="flex-shrink-0">
                <span className="text-muted text-[10px] block">Position Value</span>
                <span className="text-sm font-semibold text-yellow tabular-nums">{openTrades.length?`${fmtTHB(totalPV,0)} ฿`:"0 ฿"}</span>

                  return(<div><span className={`text-xs font-semibold ${winRate&&+winRate>=50?"text-green":winRate?"text-red":"text-muted"}`}>{winRate?`${winRate}%`:"—"}</span><div className="flex items-center gap-1 mt-0.5 flex-wrap"><span className="text-[10px] font-bold px-1 py-0.5 rounded bg-green/15 text-green">{wX}W</span><span className="text-[10px] font-bold px-1 py-0.5 rounded bg-red/15 text-red">{lX}L</span>{beX>0&&<span className="text-[10px] font-bold px-1 py-0.5 rounded bg-muted/15 text-muted">{beX}BE</span>}</div></div>);

          :<div className="mb-3 text-xs text-muted bg-card border border-dashed border-border rounded-lg px-3 py-2">🧪 Trade-group mock (dev): ไม่มีกลุ่ม — ต้องมี open positions ≥2 ที่ product+direction เดียวกัน</div>

            onCancel={()=>setClosingTrade(null)} showToast={showToast}/>

          }}

              updated.preNote=riskNote+(executingDraft.preNote||"");
            }
            setExecutingSaving(true);
            const res=await onCommitExecuteDraft(updated);   // SAVE-FIRST: durable single-row write before success

            if(res&&res.ok){setExecutingDraft(null);setExecutingSaving(false);showToast("Execute trade แล้ว ✅","success");}
            else{setExecutingSaving(false);showToast(openFailMessage(res),"error");}
          }}
          onSaveDraft={()=>{
            if(executingSaving)return;
            setExecutingDraft(null);
            showToast("ยังคงเป็น Draft อยู่","info");
          }}
          onCancel={()=>{if(!executingSaving)setExecutingDraft(null);}}
        />
      )}
    </div>
  );
}

function TdTicks({t,p,onClick}){
  if(!p||t.exitPrice==null)return<td className="px-3 py-2.5 text-muted text-xs hidden md:table-cell text-right">—</td>;
  var tks=((t.exitPrice-t.entryPrice)/p.tickSize)*(t.direction==="Long"?1:-1);
  return<td onClick={onClick} className={"px-3 py-2.5 tabular-nums text-xs font-medium cursor-pointer whitespace-nowrap hidden md:table-cell text-right "+(tks>=0?"text-green":"text-red")}>{tks>=0?"+":""}{tks.toFixed(1)}</td>;
}

function PageJournal({trades,products,balance,portfolio,onCommitUpdate,onDeleteTrade,onCommitImport,onProductsChange,onBalanceSet,onTransactions,showConfirm,showToast}){
  const[detail,setDetail]=useState(null);
  const[showImport,setShowImport]=useState(false);
  const initFilters={product:"",direction:"",setup:"",rating:"",dateFrom:"",dateTo:""};
  const[filters,setFilters]=useState(initFilters);
  const[sortKey,setSortKey]=useState("exitDateTime");
  const[sortAsc,setSortAsc]=useState(false);
  const setFlt=k=>e=>setFilters(p=>({...p,[k]:e.target.value}));

  const closed=useMemo(()=>trades.filter(t=>t.status==="closed"),[trades]);

  const filtered=useMemo(()=>{
    let r=[...closed];

        var isDate=(sortKey==="openDateTime"||sortKey==="exitDateTime");

function parseBrokerDate(v){
  if(!v)return null;
  // SheetJS cellDates:true returns Date objects
  if(v instanceof Date){
    var y=v.getFullYear();
    var mo=String(v.getMonth()+1).padStart(2,"0");
    var d=String(v.getDate()).padStart(2,"0");
    var h=String(v.getHours()).padStart(2,"0");
    var mi=String(v.getMinutes()).padStart(2,"0");
    return y+"-"+mo+"-"+d+"T"+h+":"+mi;
  }
  // SheetJS serial number fallback (raw:true without cellDates)
  if(typeof v==="number"&&v>40000){
    var epoch=new Date(Math.round((v-25569)*86400*1000));
    return parseBrokerDate(epoch);
  }
  // String "4/8/2025" or "2025-08-04"
  var str=String(v).trim();
  if(!str)return null;
  if(str.includes("-")&&str.length>=10)return str.slice(0,16)||str;
  var parts=str.split(" ");
  var datePart=parts[0],timePart=parts[1]||"00:00";
  var dp=datePart.split("/");
  if(dp.length<3)return null;
  var dd=dp[0],mm=dp[1],yy=dp[2];
  return yy+"-"+mm.padStart(2,"0")+"-"+dd.padStart(2,"0")+"T"+timePart;
}

function loadSheetJS(cb){
  if(window.XLSX){cb();return;}
  var s=document.createElement("script");
  s.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
  s.onload=cb;
  document.head.appendChild(s);
}

// Normalize column key: trim + collapse double spaces
function normCol(s){return String(s).trim().replace(/\s+/g," ");}

// Dynamic product resolver — rebuilt each parse using current products list
// Known typo corrections: maps bad prefix → {correctedCode, baseSymbol, productId}
var TYPO_CORRECTIONS=[
  {test:function(su){return su.startsWith("SO50");}, fix:function(s){return"S50"+s.slice(4);}, base:"S50"},
];

// Map contractCode → live_prices key (e.g. "GOM26" + product "gold" baseSymbol "GO" → "gold_m26")
function contractToLiveKey(productId,contractCode,baseSymbol){
  if(!contractCode||!baseSymbol)return productId;
  var series=contractCode.toUpperCase().slice(baseSymbol.length);
  if(!series)return productId;
  return productId+"_"+series.toLowerCase();
}
// Lookup live price for a trade: use contractCode to find exact series key, fallback to productId
function getLivePrice(livePrices,trade,product){
  if(!livePrices||!product)return null;
  var key=contractToLiveKey(product._baseId||product.id,trade.contractCode||product.currentContract,product.baseSymbol);
  if(livePrices[key]!=null)return livePrices[key];
  return livePrices[product._baseId||product.id]??null;
}
// Lookup live price for a product (no specific trade): use product's currentContract
function getLivePriceForProduct(livePrices,product){
  if(!livePrices||!product)return null;
  var pid=product._baseId||product.id;
  var key=contractToLiveKey(pid,product.currentContract,product.baseSymbol);
  if(livePrices[key]!=null)return livePrices[key];
  return livePrices[pid]??null;
}

function resolveProductCode(v,products){
  var s=String(v||"").trim();
  if(!s)return{productId:null,contractCode:s};
  var su=s.toUpperCase();
  // Try exact contractCode match first
  var exact=(products||[]).find(function(p){return p.currentContract===s||(p.nextContract&&p.nextContract===s);});
  if(exact)return{productId:exact._baseId||exact.id,contractCode:s};
  // Try prefix match (baseSymbol)
  var prefix=(products||[]).find(function(p){return su.startsWith(p.baseSymbol.toUpperCase());});
  if(prefix)return{productId:prefix._baseId||prefix.id,contractCode:s};
  // Check typo corrections — return as unknown but with suggestion metadata
  for(var i=0;i<TYPO_CORRECTIONS.length;i++){
    var tc=TYPO_CORRECTIONS[i];
    if(tc.test(su)){
      var suggested=tc.fix(s);
      // Check if the corrected code already exists in products (user already accepted suggestion)
      var fixedExact=(products||[]).find(function(p){
        return p.currentContract===suggested||(p.nextContract&&p.nextContract===suggested);
      });
      if(fixedExact)return{productId:fixedExact._baseId||fixedExact.id,contractCode:suggested};
      // Otherwise return as unknown with suggestion metadata
      return{productId:null,contractCode:s,_typoSuggestion:{original:s,suggested:suggested,base:tc.base}};
    }
  }
  // Standard unknown fallbacks (these still hard-map, no typo suggestion needed)
  if(su.startsWith("GO"))return{productId:"gold",contractCode:s};
  if(su.startsWith("SVF"))return{productId:"silver",contractCode:s};
  if(su.startsWith("USDJPY"))return{productId:"usdjpy",contractCode:s};
  return{productId:null,contractCode:s};
}

// ─── ProductRegistry (Phase 1 facade) ────────────────────────────────────────
// Pure, runtime-only facade over the EXISTING product array + helpers. It centralizes
// product / symbol / live-price ACCESS behind one object and adds a runtime `kind` seam
// for future asset-class work. It changes NO existing behavior: every method delegates to
// the canonical top-level helpers (resolveProduct / expandProducts / contractToLiveKey /
// getLivePrice / getLivePriceForProduct / resolveProductCode), which stay the single source
// of truth, so the existing 40+ call sites are untouched. `kind` is RUNTIME-ONLY — never
// written back into a product, Supabase, or localStorage.
function productKind(product){
  if(!product)return "unknown";
  // Runtime-only inference (Phase 3B; precedence corrected Phase 3G). NEVER mutates the product and
  // is NEVER persisted — derived on read, like the Phase-2A price source. The EXPLICIT identity
  // marker `assetKind` wins FIRST; `manualPriceOnly` is only a price-source/feed flag, so a
  // manually-priced stock is still a stock. With neither marker the product is a TFEX future
  // (today's only real kind), so the four DEFAULT_PRODUCTS — and any current product — classify
  // exactly as before.
  if(product.assetKind==="stock"||product.assetKind==="crypto"||product.assetKind==="manual")return product.assetKind;
  if(product.manualPriceOnly===true)return "manual";
  // Futures markers: a series contract, a roll contract, a fixed initial margin, or a TFEX (TXx)
  // category. All four defaults carry these; absence still defaults to futures to preserve behavior.
  return "tfex_futures";
}
// Phase-3E kind-aware UI vocabulary (DISPLAY-ONLY — no math, no thresholds, no persistence).
// Futures keep today's exact labels so current UI is byte-identical; only EXPLICIT non-futures
// kinds get new labels, so unknown/unresolved products also keep the futures label (no regression).
function productQuantityLabel(product){
  var k=productKind(product);
  if(k==="stock")return "หุ้น";
  if(k==="crypto"||k==="manual")return "หน่วย";
  return "สัญญา";   // tfex_futures + unknown/undefined — unchanged
}
function productExposureLabel(product){
  var k=productKind(product);
  return (k==="stock"||k==="crypto"||k==="manual")?"Exposure":"Gearing";   // futures + unknown → "Gearing"
}
// Phase-2A read-only price-source classifier. `live` is the ALREADY-RESOLVED getLivePrice()
// value (number) or null/undefined. Mirrors PositionCard's displayPrice fallback EXACTLY:
// live → manual(currentPrice) → entry(entryPrice) → missing. Returns metadata only; it does
// NOT change which number the UI shows (the card keeps computing displayPrice itself).
function classifyPriceSource(live,currentPrice,entryPrice){
  if(live!=null)return{source:"live",price:live};
  if(currentPrice)return{source:"manual",price:currentPrice};
  if(entryPrice)return{source:"entry",price:entryPrice};
  return{source:"missing",price:null};
}
function createProductRegistry(products){
  var list=Array.isArray(products)?products:[];
  return {
    raw:list,
    resolve:function(pid){return resolveProduct(list,pid);},
    expand:function(){return expandProducts(list);},
    resolveCode:function(code){return resolveProductCode(code,list);},
    // Mirrors getLivePrice's key derivation exactly (see getLivePrice above).
    priceKeyForTrade:function(trade,product){
      var p=product||resolveProduct(list,trade&&trade.productId);
      if(!p)return (trade&&trade.productId)||null;
      return contractToLiveKey(p._baseId||p.id,(trade&&trade.contractCode)||p.currentContract,p.baseSymbol);
    },
    resolveLivePrice:function(trade,livePrices,product){
      return getLivePrice(livePrices,trade,product||resolveProduct(list,trade&&trade.productId));
    },
    resolveLivePriceForProduct:function(product,livePrices){
      return getLivePriceForProduct(livePrices,product);
    },
    // Phase-2A seam (read-only): classify the SOURCE of a trade's displayed price. Resolves
    // live via the SAME getLivePrice() the UI uses, then classifies (live/manual/entry/missing).
    // isStale is always false in 2A — distinguishing real staleness from normal market-closed
    // needs market-hours logic and is deferred. Pure; no writes, no product mutation.
    priceStatus:function(trade,livePrices,liveTimestamps,liveErrors,product){
      var p=product||resolveProduct(list,trade&&trade.productId);
      var live=getLivePrice(livePrices,trade,p);
      var base=classifyPriceSource(live,trade&&trade.currentPrice,trade&&trade.entryPrice);
      var liveKey=p?contractToLiveKey(p._baseId||p.id,(trade&&trade.contractCode)||p.currentContract,p.baseSymbol):(trade&&trade.productId)||null;
      var updatedAt=liveTimestamps?(liveTimestamps[liveKey]??liveTimestamps[trade&&trade.productId]??null):null;
      return{source:base.source,price:base.price,liveKey:liveKey,updatedAt:updatedAt,isStale:false,hasError:!!(liveErrors&&trade&&liveErrors[trade.productId])};
    },
    kind:function(product){return productKind(product);},
    // Dev-only diagnostics — console warnings ONLY. Never alters math, price selection,
    // persistence, or product objects. Kind-aware (Phase 3B) but stays SILENT for the four valid
    // futures; new warnings only fire for malformed or (future) non-futures product shapes.
    warnInvariants:function(){
      list.forEach(function(p){
        if(!p||!p.id)return;
        var kind=productKind(p);
        // Economic triple — required by calcPL / calcPositionValue for every tradable kind.
        if(!(p.tickSize>0)||!(p.tickValue>0)||!(p.contractSize>0)){
          console.warn("[product-registry] missing/invalid economic triple (tickSize/tickValue/contractSize)",{id:p.id,kind:kind,tickSize:p.tickSize,tickValue:p.tickValue,contractSize:p.contractSize});
        }else{
          var implied=p.tickValue/p.tickSize;
          if(Math.abs(implied-p.contractSize)>Math.max(1e-6,p.contractSize*1e-6)){
            console.warn("[product-registry] contractSize != tickValue/tickSize",{id:p.id,contractSize:p.contractSize,impliedFromTicks:implied});
          }
        }
        if(!p.baseSymbol)console.warn("[product-registry] product missing baseSymbol",{id:p.id});
        // Futures need a current contract; non-futures legitimately don't — but a non-futures
        // product carrying futures-only fields is likely a mis-tagged shape worth flagging.
        if(kind==="tfex_futures"){
          if(!p.currentContract)console.warn("[product-registry] futures product missing currentContract",{id:p.id});
        }else if(p.currentContract||p.nextContract||p.series||p.initialMargin){
          console.warn("[product-registry] non-futures product unexpectedly has futures-only fields",{id:p.id,kind:kind});
        }
      });
    },
  };
}
