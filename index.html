function UnknownProductErrors({errors,onCancel,products,onProductsChange,onReparse}){
  const[open,setOpen]=useState(true);
  const[created,setCreated]=useState({});
  const[creating,setCreating]=useState(null);// code being created

  // Group by product code
  var groups={};
  errors.forEach(function(e){var k=e._rawProduct||"?";groups[k]=(groups[k]||0)+1;});
  var keys=Object.keys(groups);

  function findBase(code){
    if(!code)return null;
    var c=String(code).toUpperCase();
    if(c.startsWith("SO50"))c="S50"+c.slice(4);
    return(products||[]).find(function(p){return c.startsWith(p.baseSymbol.toUpperCase());})||null;
  }

  // Get typo suggestion for a code (from parsed errors that have _typoSuggestion)
  function getTypoSuggestion(code){
    var e=(errors||[]).find(function(e){return (e._rawProduct===code||e.contractCode===code)&&e._typoSuggestion;});
    return e?e._typoSuggestion:null;
  }

  function quickAddWithCode(originalCode,useCode){
    var base=findBase(useCode);
    if(!base)return;
    var newId=base.id+"_"+useCode.toLowerCase().replace(/[^a-z0-9]/g,"");
    var newProduct={...base,id:newId,currentContract:useCode,nextContract:"",series:useCode.slice(-3),_isLegacy:true,_baseId:base.id};
    onProductsChange&&onProductsChange(function(prev){
      if(prev.find(function(p){return p.id===newId;}))return prev;
      return [...prev,newProduct];
    });
    setCreated(function(p){return{...p,[originalCode]:newId};});
    setCreating(null);
  }

  function quickAdd(code){
    var base=findBase(code);
    if(!base)return;
    var newId=base.id+"_"+code.toLowerCase().replace(/[^a-z0-9]/g,"");
    var newProduct={...base,id:newId,currentContract:code,nextContract:"",series:code.slice(-3),_isLegacy:true,_baseId:base.id};
    onProductsChange&&onProductsChange(function(prev){
      if(prev.find(function(p){return p.id===newId;}))return prev;
      return [...prev,newProduct];
    });
    setCreated(function(p){return{...p,[code]:newId};});
    setCreating(null);
  }

  var anyCreated=Object.keys(created).length>0;

  return(
    <div className="mb-3 bg-red/5 border border-red/20 rounded-xl overflow-hidden text-xs">
      <button onClick={()=>setOpen(p=>!p)}
        className="w-full flex items-center justify-between px-3 py-2.5 text-red/80 hover:bg-red/10 transition">
        <span>⚠️ <strong>{errors.length} แถว</strong> ไม่รู้จัก product ({keys.length} code) — จะไม่ถูก import</span>
        <span className="text-muted">{open?"▲":"▼"}</span>
      </button>
      {open&&(
        <div className="border-t border-red/20 divide-y divide-red/10">
          {keys.map(function(k){
            var base=findBase(k);
            var done=!!created[k];
            var isCreating=creating===k;
            return(
              <div key={k} className="px-3 py-2.5">
                {/* Row: code + count + status */}
                <div className="flex items-center justify-between gap-2 mb-1.5">
                  <div className="flex items-center gap-2">
                    <span className="font-mono bg-input px-1.5 py-0.5 rounded text-txt font-semibold">{k}</span>
                    <span className="text-muted">{groups[k]} แถว</span>
                    {done&&<span className="text-green font-semibold">✓ เพิ่มแล้ว</span>}
                    {!done&&!base&&<span className="text-muted/60 italic">ไม่รู้จัก prefix</span>}
                  </div>
                  {!done&&base&&!isCreating&&(
                    <button onClick={function(){setCreating(k);}}
                      className="px-2.5 py-1 rounded-lg bg-yellow/20 text-yellow hover:bg-yellow/30 transition font-semibold shrink-0">
                      + เพิ่ม Product นี้
                    </button>
                  )}
                </div>
                {/* Typo suggestion banner */}
                {!done&&!isCreating&&getTypoSuggestion(k)&&(
                  <TypoBanner
                    typo={getTypoSuggestion(k)}
                    hasBase={!!findBase(getTypoSuggestion(k).suggested)}
                    onAccept={function(){quickAddWithCode(k,getTypoSuggestion(k).suggested);}}
                    onManual={function(){setCreating(k);}}
                  />
                )}
                {/* Normal suggestion text — only if no typo */}
                {!done&&base&&!isCreating&&!getTypoSuggestion(k)&&(
                  <p className="text-muted/70 text-[11px]">
                    → ใช้ setting เดียวกับ <strong className="text-txt">{base.name}</strong> ({base.baseSymbol}) ได้เลย — tickSize, tickValue, margin เหมือนกัน
                  </p>
                )}
                {/* Inline confirm card */}
                {isCreating&&base&&(
                  <div className="mt-2 bg-input/40 border border-yellow/20 rounded-xl p-3 space-y-2">
                    <div className="font-semibold text-yellow text-[11px] mb-1">✦ สร้าง Product ใหม่จาก {base.name}</div>
                    <div className="grid grid-cols-2 gap-x-4 gap-y-1 text-[11px]">
                      {[
                        ["Contract Code",k],
                        ["Base",base.baseSymbol],
                        ["Contract Size",fmtNum(base.contractSize,0)+" หน่วย"],
                        ["Tick Size / Value",fmtNum(base.tickSize,base.tickSize<1?2:1)+" = ฿"+fmtNum(base.tickValue,0)],
                        ["Initial Margin","฿"+fmtNum(base.initialMargin,0)+" / สัญญา"],
                        ["Commission","฿"+fmtNum(base.commissionPerLeg,0)+" / leg"],
                      ].map(function(row){return(
                        <div key={row[0]}><span className="text-muted">{row[0]}</span><br/><span className="text-txt font-medium">{row[1]}</span></div>
                      );})}
                    </div>
                    <div className="flex gap-2 pt-1">
                      <button onClick={function(){quickAdd(k);}}
                        className="flex-1 py-1.5 rounded-lg bg-yellow text-black font-semibold hover:bg-yellow/90 transition text-xs">
                        ✓ ยืนยัน สร้าง {k}
                      </button>
                      <button onClick={function(){setCreating(null);}}
                        className="px-3 py-1.5 rounded-lg bg-input text-muted hover:text-txt transition text-xs">
                        ยกเลิก
                      </button>
                    </div>
                  </div>
                )}
              </div>
            );
          })}
          {anyCreated&&(
            <div className="px-3 py-2.5">
              <button onClick={onReparse}
                className="w-full py-2 rounded-lg bg-green/10 text-green border border-green/20 hover:bg-green/20 transition font-semibold">
                🔄 Import ใหม่พร้อม {Object.keys(created).length} product ที่เพิ่งสร้าง
              </button>
            </div>
          )}
          {!anyCreated&&(
            <div className="px-3 py-2.5 text-muted/60">
              หรือจัดการเองใน <button onClick={onCancel} className="underline text-yellow/70">Settings → Products</button>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function parseMT5Date(v){
  if(!v)return null;
  if(v instanceof Date){
    var y=v.getFullYear(),mo=String(v.getMonth()+1).padStart(2,"0"),d=String(v.getDate()).padStart(2,"0");
    var h=String(v.getHours()).padStart(2,"0"),mi=String(v.getMinutes()).padStart(2,"0");
    return y+"-"+mo+"-"+d+"T"+h+":"+mi;
  }
  if(typeof v==="number"&&v>40000)return parseBrokerDate(v);
  var s=String(v).trim();
  var m=s.match(/^(\d{4})\.(\d{2})\.(\d{2})\s+(\d{2}):(\d{2})/);
  if(m)return m[1]+"-"+m[2]+"-"+m[3]+"T"+m[4]+":"+m[5];
  return parseBrokerDate(v);
}

function parseMT5Num(v){
  if(v==null||v==="")return null;
  if(typeof v==="number")return v;
  var n=parseFloat(String(v).replace(/[\s,]/g,""));
  return isNaN(n)?null:n;
}

function parseMT5Positions(rows,products){
  // Find "Positions" section header
  var posStart=-1;
  for(var i=0;i<rows.length;i++){
    if(String(rows[i][0]||"").trim()==="Positions"){posStart=i;break;}
  }
  if(posStart<0)return{trades:[],errors:[]};
  // Data starts 2 rows after section header (skip column header row)
  var dataStart=posStart+2;
  // Find next section boundary
  var dataEnd=rows.length;
  for(var i=dataStart;i<rows.length;i++){
    var c=String(rows[i][0]||"").trim();
    if(c==="Orders"||c==="Deals"||c==="Open Positions"||c==="Results"){dataEnd=i;break;}
  }
  var goodRows=[],badRows=[];
  for(var i=dataStart;i<dataEnd;i++){
    var row=rows[i];
    // Positions columns: Time,Position,Symbol,Type,Volume,Price,S/L,T/P,Time(close),Price(close),Commission,Swap,Profit
    var openTimeRaw=String(row[0]||"").trim();
    var positionId=String(row[1]||"").trim();
    var symbol=String(row[2]||"").trim();
    var type=String(row[3]||"").trim().toLowerCase();
    if(!openTimeRaw||!symbol)continue;
    var volume=parseMT5Num(row[4])||0;
    var openPrice=parseMT5Num(row[5])||0;
    var sl=parseMT5Num(row[6]);
    var tp=parseMT5Num(row[7]);
    var closeTimeRaw=String(row[8]||"").trim();
    var closePrice=parseMT5Num(row[9]);
    var commission=parseMT5Num(row[10])||0;
    var swap=parseMT5Num(row[11])||0;
    var profit=parseMT5Num(row[12])||0;
    // Strip futures contract suffix [HMUZ]\d{2} to get base symbol (e.g. S50U25→S50, GOZ25→GO)
    var baseSymbol=symbol.replace(/[HMUZ]\d{2}$/i,"");
    var resolved=resolveProductCode(baseSymbol,products);
    if(!resolved.productId)resolved=resolveProductCode(symbol,products);
    var trade={
      id:"mt5_"+positionId+"_"+Math.random().toString(36).slice(2),
      mt5PositionId:positionId,
      productId:resolved.productId,
      contractCode:symbol,
      direction:type==="buy"?"Long":"Short",
      contracts:volume,
      entryPrice:openPrice,
      exitPrice:(closePrice!=null&&closePrice!==0)?closePrice:null,
      openDateTime:parseMT5Date(openTimeRaw),
      exitDateTime:closeTimeRaw?parseMT5Date(closeTimeRaw):null,
      stopLoss:(sl&&sl!==0)?sl:null,
      takeProfit:(tp&&tp!==0)?tp:null,
      commission:commission,
      swap:swap,
      brokerProfit:profit,
      status:(closePrice!=null&&closePrice!==0)?"closed":"open",
      setupType:"Other",postNote:"",preImages:[],postImages:[],
      partialCloses:[],isMerged:false,mergedFromIds:[],subTrades:[],
    };
    if(!trade.productId)badRows.push({...trade,_rawProduct:symbol,_raw:row});
    else goodRows.push({...trade,_raw:row});
  }
  return{trades:goodRows,errors:badRows};
}

function parseMT5OpenPositions(rows,products){
  var openStart=-1;
  for(var i=0;i<rows.length;i++){
    if(String(rows[i][0]||"").trim()==="Open Positions"){openStart=i;break;}
  }
  if(openStart<0)return{trades:[],errors:[]};
  var dataStart=openStart+2;
  var dataEnd=rows.length;
  for(var i=dataStart;i<rows.length;i++){
    var c=String(rows[i][0]||"").trim();
    if(c==="Results"||c==="Balance:"||c===""){
      // detect end by empty row or summary rows
      var allEmpty=rows[i].every(function(v){return String(v||"").trim()==="";});
      if(c==="Results"||c==="Balance:"){dataEnd=i;break;}
      if(allEmpty&&i>dataStart+1){dataEnd=i;break;}
    }
  }
  var goodRows=[],badRows=[];
  for(var i=dataStart;i<dataEnd;i++){
    var row=rows[i];
    // Columns: Time,Position,Symbol,Type,Volume,Price,S/L,T/P,Market Price,Swap,[empty],Profit,Comment
    var openTimeRaw=String(row[0]||"").trim();
    var positionId=String(row[1]||"").trim();
    var symbol=String(row[2]||"").trim();
    var type=String(row[3]||"").trim().toLowerCase();
    if(!openTimeRaw||!symbol||!positionId)continue;
    var volume=parseMT5Num(row[4])||0;
    var openPrice=parseMT5Num(row[5])||0;
    var sl=parseMT5Num(row[6]);
    var tp=parseMT5Num(row[7]);
    var marketPrice=parseMT5Num(row[8]);
    if(!volume||!openPrice)continue;
    var baseSymbol=symbol.replace(/[HMUZ]\d{2}$/i,"");
    var resolved=resolveProductCode(baseSymbol,products);
    if(!resolved.productId)resolved=resolveProductCode(symbol,products);
    var trade={
      id:"mt5_"+positionId+"_"+Math.random().toString(36).slice(2),
      mt5PositionId:positionId,
      productId:resolved.productId,
      contractCode:symbol,
      direction:type==="buy"?"Long":"Short",
      contracts:volume,
      entryPrice:openPrice,
      exitPrice:null,
      openDateTime:parseMT5Date(openTimeRaw),
      exitDateTime:null,
      stopLoss:(sl&&sl!==0)?sl:null,
      takeProfit:(tp&&tp!==0)?tp:null,
      currentPrice:marketPrice||null,
      status:"open",
      setupType:"Other",postNote:"",preImages:[],postImages:[],
      partialCloses:[],isMerged:false,mergedFromIds:[],subTrades:[],
    };
    if(!trade.productId)badRows.push({...trade,_rawProduct:symbol,_raw:row});
    else goodRows.push({...trade,_raw:row});
  }
  return{trades:goodRows,errors:badRows};
}

function parseMT5Deals(rows){
  // Find "Deals" section header
  var dealsStart=-1;
  for(var i=0;i<rows.length;i++){
    if(String(rows[i][0]||"").trim()==="Deals"){dealsStart=i;break;}
  }
  if(dealsStart<0)return{balanceEvents:[],commPerLeg:{}};
  var dataStart=dealsStart+2;
  var dataEnd=rows.length;
  for(var i=dataStart;i<rows.length;i++){
    var c=String(rows[i][0]||"").trim();
    if(c==="Open Positions"||c==="Results"||/^Balance:/i.test(c)){dataEnd=i;break;}
    // Also stop on blank-then-summary row patterns
  }
  var balanceEvents=[];
  // commissions[baseSymbol] = {totalComm, totalLots}
  var commAcc={};
  for(var i=dataStart;i<dataEnd;i++){
    var row=rows[i];
    var time=String(row[0]||"").trim();
    if(!time)continue;
    var symbol=String(row[2]||"").trim();
    var type=String(row[3]||"").trim().toLowerCase();
    var volume=parseMT5Num(row[5])||0;
    var commAmt=parseMT5Num(row[8])||0;
    var feeAmt=parseMT5Num(row[9])||0;
    var profit=parseMT5Num(row[11]);
    var comment=String(row[13]||"").trim();
    if(type==="balance"&&!symbol){
      // Skip zero-amount "Adjust Equity" rows only; non-zero ones are real balance adjustments
      if(/adjust\s*equity/i.test(comment)&&Math.abs(profit||0)<1)continue;
      var txType=(profit!=null&&profit<0)?"withdraw":"deposit";
      balanceEvents.push({
        date:parseMT5Date(time),
        amount:Math.abs(profit||0),
        rawProfit:profit||0,
        type:txType,
        comment:comment,
      });
    } else if(symbol&&volume>0&&(commAmt!==0||feeAmt!==0)){
      // Accumulate commission + fee for auto-detect
      var base=symbol.replace(/[HMUZ]\d{2}$/i,"");
      if(!commAcc[base])commAcc[base]={totalComm:0,totalFee:0,totalLots:0};
      commAcc[base].totalComm+=Math.abs(commAmt);
      commAcc[base].totalFee+=Math.abs(feeAmt);
      commAcc[base].totalLots+=volume;
    }
  }
  // commissionPerLeg = totalComm / totalLots (per deal = one side)
  var commPerLeg={};
  var feePerLeg={};
  Object.keys(commAcc).forEach(function(base){
    var d=commAcc[base];
    if(d.totalLots>0){
      commPerLeg[base]=Math.round(d.totalComm/d.totalLots);
      feePerLeg[base]=d.totalFee/d.totalLots;
    }
  });
  return{balanceEvents,commPerLeg,feePerLeg};
}

function ExcelImportModal({products,existingTrades,balance,onImport,onCancel,onProductsChange,onBalanceSet,onTransactions}){
  const[step,setStep]=useState("upload");
  const[parsed,setParsed]=useState([]);
  const[errors,setErrors]=useState([]);
  const[selected,setSelected]=useState(new Set());
  const[loading,setLoading]=useState(false);
  const[dragOver,setDragOver]=useState(false);
  const[currentFile,setCurrentFile]=useState(null);
  const[format,setFormat]=useState("thus");
  const[dealEvents,setDealEvents]=useState([]);
  const[dealSel,setDealSel]=useState(new Set());
  const[dealNotes,setDealNotes]=useState({});
  const[importing,setImporting]=useState(false);
  const[importProgress,setImportProgress]=useState({done:0,total:0});
  const[importReport,setImportReport]=useState(null);

  function processFile(file,currentProducts){
    setCurrentFile(file);
    setLoading(true);
    loadSheetJS(function(){
      var reader=new FileReader();
      reader.onload=function(e){
        var wb=XLSX.read(e.target.result,{type:"array",cellDates:true});
        var ws=wb.Sheets[wb.SheetNames[0]];
        // Skip row 1 (metadata), use row 2 as headers, parse dates as Date objects
        // raw:true + cellDates:true in XLSX.read → Date objects for date cells, numbers for numerics
        var rowsRaw=XLSX.utils.sheet_to_json(ws,{defval:"",range:1,raw:true,cellDates:true});
        var goodRows=[],badRows=[];
        rowsRaw.forEach(function(row){
          // Normalize keys: trim all column names
          var normRow={};
          Object.keys(row).forEach(function(k){normRow[normCol(k)]=row[k];});
          // Skip completely empty rows (Excel reserves blank rows)
          if(!normRow["Order"]&&!normRow["Product"])return;
          var trade={setupType:"Other",postNote:"",preImages:[],postImages:[],partialCloses:[],isMerged:false,mergedFromIds:[],subTrades:[],id:"imp_"+Date.now()+"_"+Math.random().toString(36).slice(2)};
          Object.keys(COLUMN_MAP).forEach(function(col){
            if(normRow[col]!==undefined&&normRow[col]!==""){
              Object.assign(trade,COLUMN_MAP[col](normRow[col],currentProducts));
            }
          });
          if(!trade.productId)badRows.push({...trade,_raw:normRow,_rawProduct:normRow["Product"]||"?"});
          else{if(trade.exitPrice!=null&&trade.exitPrice!==0)trade.status="closed";goodRows.push({...trade,_raw:normRow});}
        });
        setParsed(goodRows);
        setErrors(badRows);
        var sel=new Set();
        goodRows.forEach(function(_,i){sel.add(i);});
        setSelected(sel);
        setLoading(false);
        setStep("preview");
      };
      reader.readAsArrayBuffer(file);
    });
  }

  function processMT5File(file,currentProducts){
    setCurrentFile(file);
    setLoading(true);
    loadSheetJS(function(){
      var reader=new FileReader();
      reader.onload=function(e){
        var wb=XLSX.read(e.target.result,{type:"array",raw:true,cellDates:false});
        var ws=wb.Sheets[wb.SheetNames[0]];
        var rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:"",raw:true});
        // Parse positions (trades)
        var result=parseMT5Positions(rows,currentProducts);
        var existingPosIds=new Set((existingTrades||[]).map(function(t){return t.mt5PositionId;}).filter(Boolean));
        var goodRows=result.trades.filter(function(t){return!existingPosIds.has(t.mt5PositionId);});
        setParsed(goodRows);
        setErrors(result.errors);
        // Also parse open positions and merge
        var openResult=parseMT5OpenPositions(rows,currentProducts);
        var existingOpenIds=new Set((existingTrades||[]).map(function(t){return t.mt5PositionId;}).filter(Boolean));
        var openRows=openResult.trades.filter(function(t){return!existingOpenIds.has(t.mt5PositionId);});
        var allGood=goodRows.concat(openRows);
        var allErrors=result.errors.concat(openResult.errors);
        setParsed(allGood);
        setErrors(allErrors);
        var sel=new Set();
        allGood.forEach(function(_,i){sel.add(i);});
        setSelected(sel);
        // Parse deals (balance events + commission)
        var dealsResult=parseMT5Deals(rows);
        var events=dealsResult.balanceEvents;
        setDealEvents(events);
        // Pre-select all deal events
        var dSel=new Set();
        events.forEach(function(_,i){dSel.add(i);});
        setDealSel(dSel);
        setDealNotes({});
        // Auto-update commission if detected
        if(Object.keys(dealsResult.commPerLeg).length>0&&onProductsChange){
          var updated=false;
          var newProducts=currentProducts.map(function(p){
            var detectedComm=dealsResult.commPerLeg[p.baseSymbol];
            if(detectedComm&&detectedComm!==p.commissionPerLeg){
              updated=true;
              return{...p,commissionPerLeg:detectedComm};
            }
            return p;
          });
          if(updated)onProductsChange(newProducts);
        }
        // Apply fee per leg to each trade
        if(Object.keys(dealsResult.feePerLeg).length>0){
          allGood.forEach(function(t){
            var base=(t.contractCode||"").replace(/[HMUZ]\d{2}$/i,"");
            var fpl=dealsResult.feePerLeg[base]||0;
            if(fpl>0){
              var legs=t.status==="closed"?2:1;
              t.fee=-(fpl*t.contracts*legs);
            }
          });
          setParsed([...allGood]);
        }
        setLoading(false);
        // Go to deals step first, then preview
        setStep(events.length>0?"deals":"preview");
      };
      reader.readAsArrayBuffer(file);
    });
  }

  function handleFile(file){
    if(!file)return;
    if(format==="mt5")processMT5File(file,products);
    else processFile(file,products);
  }

  function isDuplicate(t){
    if(t.mt5PositionId){
      return(existingTrades||[]).some(function(e){return e.mt5PositionId===t.mt5PositionId;});
    }
    return(existingTrades||[]).some(function(e){
      return e.productId===t.productId&&e.openDateTime===t.openDateTime&&e.entryPrice===t.entryPrice;
    });
  }

  function confirmDeals(){
    // Import selected deal events as portfolio transactions
    if(dealSel.size>0&&onTransactions){
      var txs=[...dealSel].map(function(i){
        var ev=dealEvents[i];
        return{id:uid(),type:ev.type,date:ev.date,amount:ev.amount,note:dealNotes[i]!==undefined?dealNotes[i]:ev.comment};
      }).sort(function(a,b){return new Date(a.date)-new Date(b.date);});
      onTransactions(txs);
    }
    setStep("preview");
  }

  async function confirmImport(){
    var newTrades=[...selected].map(function(i){
      var t=parsed[i];
      return{...t,id:uid(),_raw:undefined};
    });
    setImporting(true);
    setImportProgress({done:0,total:newTrades.length});
    var report;
    try{
      // onImport === durable commitImportTrades(trades,onProgress) → returns {saved,failed,skipped}.
      report=await onImport(newTrades,function(done,total){setImportProgress({done:done,total:total});});
    }catch(e){
      report={saved:[],failed:newTrades.map(function(t){return{id:t.id,mt5PositionId:t.mt5PositionId||null,error:(e&&e.message)||"import error"};}),skipped:[]};
    }
    setImporting(false);
    setImportReport(report||{saved:[],failed:[],skipped:[]});
    setStep("done");
  }

  function toggleAll(){
    if(selected.size===parsed.length)setSelected(new Set());
    else{var s=new Set();parsed.forEach(function(_,i){s.add(i);});setSelected(s);}
  }

  return(
    <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-4"
      style={{background:"rgba(11,14,17,0.80)",backdropFilter:"blur(4px)"}}
      onClick={function(e){if(e.target===e.currentTarget)onCancel();}}>
      <div className="bg-card border border-border rounded-2xl w-full max-w-3xl shadow-2xl fade-in flex flex-col max-h-[90vh]">
        <div className="flex items-center justify-between px-5 pt-4 pb-3 flex-shrink-0">
          <div>
            <span className="font-bold text-txt">📥 Import Excel</span>
            <span className="text-muted text-xs ml-3">{step==="upload"?"อัปโหลดไฟล์ broker":step==="deals"?"ตรวจสอบ Deposits / Withdrawals":"ตรวจสอบและเลือก trades"}</span>
          </div>
          <button onClick={onCancel} className="text-muted hover:text-txt text-xl leading-none">✕</button>
        </div>
        <div className="flex border-b border-border/40 flex-shrink-0 px-1">
          {[["thus","THUS Format"],["mt5","MT5 Format"]].map(function(pair){
            var f=pair[0],label=pair[1];
            return(
              <button key={f}
                onClick={function(){if(f!==format){setFormat(f);setStep("upload");setParsed([]);setErrors([]);setSelected(new Set());}}}
                className={"px-4 py-2.5 text-sm font-medium border-b-2 -mb-px transition "+(format===f?"border-yellow text-yellow":"border-transparent text-muted hover:text-txt")}>
                {label}
              </button>
            );
          })}
        </div>

        {step==="upload"&&(
          <div className="p-8 flex flex-col items-center gap-4">
            {balance<=0&&format!=="mt5"&&(
              <div className="w-full flex items-start gap-3 bg-yellow/10 border border-yellow/30 rounded-xl px-4 py-3">
                <span className="text-xl mt-0.5">⚠️</span>
                <div className="flex-1">
                  <div className="font-semibold text-yellow text-sm">ต้องตั้งเงินทุนก่อน Import</div>
                  <div className="text-muted text-xs mt-0.5 leading-relaxed">ระบบต้องทราบเงินเริ่มต้นเพื่อคำนวณ Step threshold ให้ถูกต้อง<br/>ไปที่ <strong className="text-txt">Settings → Portfolio → เพิ่ม Deposit</strong> ก่อน แล้วค่อยกลับมา Import</div>
                </div>
                <button onClick={onCancel}
                  className="shrink-0 px-3 py-1.5 rounded-lg bg-yellow text-black text-xs font-bold hover:bg-yellow/90 transition">
                  ไปตั้งค่า
                </button>
              </div>
            )}
            {balance<=0&&format==="mt5"&&(
              <div className="w-full flex items-center gap-3 bg-blue-500/10 border border-blue-500/30 rounded-xl px-4 py-3">
                <span className="text-xl">ℹ️</span>
                <div className="text-blue-300 text-xs leading-relaxed">MT5 Format จะดึง Deposit / Withdrawal จากไฟล์ให้อัตโนมัติ — ไม่ต้องตั้งค่าก่อน</div>
              </div>
            )}
            <div
              onDragOver={function(e){e.preventDefault();var canUpload=balance>0||format==="mt5";if(canUpload)setDragOver(true);}}
              onDragLeave={function(){setDragOver(false);}}
              onDrop={function(e){e.preventDefault();setDragOver(false);var canUpload=balance>0||format==="mt5";if(!canUpload)return;var f=e.dataTransfer.files[0];if(f)handleFile(f);}}
              onClick={function(){var canUpload=balance>0||format==="mt5";if(!canUpload)return;document.getElementById("xlsx-input").click();}}
              className={(function(){var canUpload=balance>0||format==="mt5";return"border-2 border-dashed rounded-2xl p-10 w-full text-center transition "+(canUpload?"cursor-pointer "+(dragOver?"border-yellow bg-yellow/5":"border-border/50 hover:border-yellow/50 bg-input/20"):"cursor-not-allowed opacity-40 border-border/30 bg-input/10");})()}>
              {loading?(
                <div className="text-yellow text-3xl animate-spin">⟳</div>
              ):(
                <>
                  <div className="text-4xl mb-3">📊</div>
                  <div className="text-txt font-semibold mb-1">วาง {format==="mt5"?".csv / .xlsx":".xlsx"} ที่นี่ หรือคลิกเพื่อเลือกไฟล์</div>
                  <div className="text-muted text-xs">{format==="mt5"?"รองรับ ReportHistory*.csv จาก MT5 (Pi Securities)":"รองรับ .xlsx, .xls จาก broker TFEX T053"}</div>
                </>
              )}
            </div>
            <input id="xlsx-input" type="file" accept={format==="mt5"?".csv,.xlsx,.xls":".xlsx,.xls"} className="hidden"
              disabled={balance<=0&&format!=="mt5"}
              onChange={function(e){var canUpload=balance>0||format==="mt5";if(e.target.files[0]&&canUpload)handleFile(e.target.files[0]);}}/>
            {errors.length>0&&(
              <div className="text-yellow/80 text-xs bg-yellow/5 border border-yellow/20 rounded-lg px-3 py-2 w-full text-center">
                ⚠️ {errors.length} แถวไม่รู้จัก product — จะแสดงรายละเอียดใน preview
              </div>
            )}
          </div>
        )}

        {step==="deals"&&(
          <>
            <div className="overflow-y-auto flex-1 p-4">
              <div className="mb-3 text-xs text-muted bg-input/30 border border-border/30 rounded-xl px-3 py-2 leading-relaxed">
                พบ <span className="text-txt font-semibold">{dealEvents.length}</span> รายการฝาก/ถอน — เลือกรายการที่ต้องการนำเข้า portfolio และแก้ไข Note ได้ตามต้องการ
              </div>
              {dealEvents.length===0?(
                <p className="text-muted text-sm text-center py-8">ไม่พบรายการ Deposit / Withdrawal</p>
              ):(
                <div className="space-y-2">
                  {(function(){
                    var DEPOSIT_PRESETS=["เงินทุนเริ่มต้น","เพิ่มทุน","โอนจากบัญชีอื่น","อื่นๆ"];
                    var WITHDRAW_PRESETS=["ลดทุน","ฉุกเฉิน","ปิดบัญชี","อื่นๆ"];
                    var WITHDRAW_TYPE_LABELS={
                      "withdraw":"ถอนทั่วไป",
                      "profit_withdrawal":"บันทึกการถอนกำไร (10%)"
                    };
                    return dealEvents.map(function(ev,i){
                      var chk=dealSel.has(i);
                      var curType=dealEvents[i].type;
                      var curNote=dealNotes[i]!==undefined?dealNotes[i]:ev.comment;
                      var isDeposit=curType==="deposit";
                      var presets=isDeposit?DEPOSIT_PRESETS:WITHDRAW_PRESETS;
                      return(
                        <div key={i} className={"border rounded-xl px-3 py-2.5 transition "+(chk?"border-border/60 bg-input/10":"border-border/20 opacity-40")}>
                          <div className="flex items-center gap-2 mb-2">
                            <input type="checkbox" checked={chk}
                              onChange={function(){var s=new Set(dealSel);s.has(i)?s.delete(i):s.add(i);setDealSel(s);}}
                              className="accent-yellow cursor-pointer shrink-0"/>
                            <span className="text-muted text-xs whitespace-nowrap">{ev.date?.slice(0,10)}</span>
                            <span className={"text-xs font-bold tabular-nums "+(isDeposit?"text-green":"text-red")}>
                              {isDeposit?"+":"-"}{ev.amount.toLocaleString("th-TH",{maximumFractionDigits:0})} ฿
                            </span>
                            <span className="text-muted/50 text-[10px] truncate flex-1">{ev.comment}</span>
                          </div>
                          {/* Type selector — deposit stays simple, withdrawal has 2 options */}
                          <div className="flex gap-1.5 flex-wrap mb-2">
                            {isDeposit?(
                              <span className="px-2 py-0.5 rounded text-[10px] bg-green/20 text-green font-medium">ฝากเงิน</span>
                            ):(
                              Object.keys(WITHDRAW_TYPE_LABELS).map(function(t){
                                return(
                                  <button key={t}
                                    onClick={function(){var evCopy=[...dealEvents];evCopy[i]={...evCopy[i],type:t};setDealEvents(evCopy);}}
                                    className={"px-2.5 py-0.5 rounded text-[10px] border transition "+(curType===t?"bg-red/20 border-red/50 text-red":"bg-input/50 border-border text-muted hover:text-txt")}>
                                    {WITHDRAW_TYPE_LABELS[t]}
                                  </button>
                                );
                              })
                            )}
                          </div>
                          {/* Note presets */}
                          <div className="flex gap-1 flex-wrap mb-1.5">
                            {presets.map(function(p){
                              return(
                                <button key={p}
                                  onClick={function(){setDealNotes(function(prev){var n={...prev};n[i]=p;return n;});}}
                                  className={"px-2 py-0.5 rounded text-[10px] border transition "+(curNote===p?"bg-yellow/20 border-yellow text-yellow":"bg-input/50 border-border text-muted hover:text-txt")}>
                                  {p}
                                </button>
                              );
                            })}
                          </div>
                          <input type="text" value={curNote}
                            onChange={function(e){setDealNotes(function(prev){var n={...prev};n[i]=e.target.value;return n;});}}
                            className="bg-input border border-border/50 rounded px-2 py-0.5 text-xs text-txt w-full"/>
                        </div>
                      );
                    });
                  })()}
                </div>
              )}
            </div>
            <div className="p-4 border-t border-border/40 flex-shrink-0 flex items-center justify-between gap-3">
              <span className="text-muted text-xs">เลือก <span className="text-txt font-semibold">{dealSel.size}</span> จาก {dealEvents.length} รายการ</span>
              <div className="flex gap-2">
                <button onClick={function(){setStep("upload");}}
                  className={clsBtn("ghost","sm")}>← กลับ</button>
                <button onClick={confirmDeals}
                  className={clsBtn("yellow","sm")}>
                  {dealSel.size>0?"Import "+dealSel.size+" transactions + ":""}ดูรายการ trades →
                </button>
              </div>
            </div>
          </>
        )}

        {step==="preview"&&(
          <>
            <div className="overflow-y-auto flex-1 p-4">
              {/* Balance warning with inline set */}
              {balance<=0&&format!=="mt5"&&<BalanceSetBannerWithDate parsed={parsed} onBalanceSet={onBalanceSet}/>}
              {/* Unknown products breakdown */}
              {errors.length>0&&(
                <UnknownProductErrors errors={errors} onCancel={onCancel}
                  products={products} onProductsChange={onProductsChange}
                  onReparse={function(){if(currentFile)processFile(currentFile,products);}}/>
              )}
              {parsed.length===0?(
                <p className="text-muted text-sm text-center py-8">ไม่พบ trade ที่สามารถ import ได้</p>
              ):(
                <div className="overflow-x-auto">
                  <table className="w-full text-xs">
                    <thead>
                      <tr className="text-muted border-b border-border/40">
                        <th className="pb-2 font-medium text-center w-8">#</th>
                        <th className="text-left pb-2 font-medium pr-2">
                          <input type="checkbox" checked={selected.size===parsed.length}
                            onChange={toggleAll} className="accent-yellow cursor-pointer"/>
                        </th>
                        <th className="text-left pb-2 font-medium">Product</th>
                        <th className="pb-2 font-medium">Direction</th>
                        <th className="text-right pb-2 font-medium">Lots</th>
                        <th className="text-right pb-2 font-medium">Entry</th>
                        <th className="text-right pb-2 font-medium">Exit</th>
                        <th className="text-left pb-2 font-medium pl-2">Date Open</th>
                        <th className="pb-2 font-medium">W/L</th>
                        <th className="text-left pb-2 font-medium pl-2">Remark</th>
                      </tr>
                    </thead>
                    <tbody>
                      {parsed.map(function(t,i){
                        var dup=isDuplicate(t);
                        var chk=selected.has(i);
                        return(
                          <tr key={i} className={"border-b border-border/20 "+
                            (dup?"bg-yellow/5":"")}>
                            <td className="py-1.5 text-center text-muted/50 text-[10px] w-8 tabular-nums">{i+1}</td>
                            <td className="py-1.5 pr-2">
                              <input type="checkbox" checked={chk}
                                onChange={function(){var s=new Set(selected);s.has(i)?s.delete(i):s.add(i);setSelected(s);}}
                                className="accent-yellow cursor-pointer"/>
                            </td>
                            <td className="py-1.5">
                              <span className="font-semibold text-txt">{t.contractCode||t.productId}</span>
                              {dup&&<span className="ml-1 text-[10px] px-1.5 py-0.5 bg-yellow/20 text-yellow rounded font-semibold">ซ้ำ</span>}
                            </td>
                            <td className="py-1.5 text-center">
                              <span className={"text-[10px] font-bold px-1.5 py-0.5 rounded "+
                                (t.direction==="Long"?"bg-green/20 text-green":"bg-red/20 text-red")}>
                                {t.direction==="Long"?"L":"S"}
                              </span>
                            </td>
                            <td className="py-1.5 text-right tabular-nums text-muted">{t.contracts}</td>
                            <td className="py-1.5 text-right tabular-nums">{fmtNum(t.entryPrice,t.entryPrice>=100?1:2)}</td>
                            <td className="py-1.5 text-right tabular-nums text-muted">{t.exitPrice!=null?fmtNum(t.exitPrice,t.exitPrice>=100?1:2):"—"}</td>
                            <td className="py-1.5 pl-2 text-muted whitespace-nowrap">{t.openDateTime?.slice(0,10)||"—"}</td>
                            <td className="py-1.5 text-center">{(()=>{
                              if(t.status!=="closed"||t.exitPrice==null)return<span className="text-[10px] px-1.5 py-0.5 rounded bg-yellow/10 text-yellow/70">open</span>;
                              const p=resolveProduct(products,t.productId);
                              const net=p?calcNetPL(p,t.contracts,t.entryPrice,t.exitPrice,t.direction):null;
                              if(net==null)return<span className="text-muted text-[10px]">—</span>;
                              return net>0
                                ?<span className="text-[10px] font-bold px-1.5 py-0.5 rounded bg-green/20 text-green">W</span>
                                :<span className="text-[10px] font-bold px-1.5 py-0.5 rounded bg-red/20 text-red">L</span>;
                            })()}</td>
                            <td className="py-1.5 pl-2 text-muted max-w-[140px] truncate">{t.preNote||"—"}</td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                  {errors.length>0&&(
                    <div className="mt-3 text-red/70 text-xs bg-red/10 border border-red/20 rounded-lg px-3 py-2">
                      ⚠️ {errors.length} แถวไม่รู้จัก product ถูกข้ามไป
                    </div>
                  )}
                </div>
              )}
            </div>
            <div className="p-4 border-t border-border/40 flex-shrink-0 flex items-center justify-between gap-3">
              <span className="text-muted text-xs">เลือก <span className="text-txt font-semibold">{selected.size}</span> จาก {parsed.length} แถว</span>
              <div className="flex gap-2">
                <button onClick={function(){setStep("upload");setParsed([]);setErrors([]);setSelected(new Set());}}
                  className={clsBtn("ghost","sm")}>← กลับ</button>
                <button onClick={confirmImport} disabled={selected.size===0||importing}
                  className={clsBtn("yellow","sm")+((selected.size===0||importing)?" opacity-40 cursor-not-allowed":"")}>
                  {importing?("กำลังนำเข้า "+importProgress.done+"/"+importProgress.total):("นำเข้า "+selected.size+" trades")}
                </button>
              </div>
            </div>
          </>
        )}

        {step==="done"&&importReport&&(
          <>
            <div className="overflow-y-auto flex-1 p-4">
              <div className="text-center py-4">
                <div className="text-4xl mb-2">{importReport.failed.length>0?"⚠️":"✅"}</div>
                <div className="text-txt font-semibold">นำเข้าสำเร็จ {importReport.saved.length} รายการ</div>
                {importReport.failed.length>0&&(
                  <div className="text-red text-sm mt-1">บันทึกไม่สำเร็จ {importReport.failed.length} รายการ</div>
                )}
                {importReport.skipped.length>0&&(
                  <div className="text-yellow text-sm mt-1">ข้าม (ซ้ำในไฟล์) {importReport.skipped.length} รายการ</div>
                )}
              </div>
              {importReport.failed.length>0&&(
                <div className="mt-3 text-xs bg-red/10 border border-red/20 rounded-lg px-3 py-2 space-y-0.5">
                  <div className="text-red/80 font-semibold mb-1">รายการที่บันทึกไม่สำเร็จ — เปิด Import อีกครั้งเพื่อลองใหม่ได้:</div>
                  {importReport.failed.map(function(f,i){
                    return <div key={i} className="text-muted break-all">• {String(f.id)}{f.mt5PositionId?(" (pos "+f.mt5PositionId+")"):""} — {String(f.error)}</div>;
                  })}
                </div>
              )}
              {importReport.skipped.length>0&&(
                <div className="mt-2 text-xs bg-yellow/10 border border-yellow/20 rounded-lg px-3 py-2 space-y-0.5">
                  <div className="text-yellow/80 font-semibold mb-1">ข้ามรายการซ้ำในไฟล์ (mt5PositionId เดียวกัน):</div>
                  {importReport.skipped.map(function(s,i){
                    return <div key={i} className="text-muted break-all">• {String(s.id)}{s.mt5PositionId?(" (pos "+s.mt5PositionId+")"):""}</div>;
                  })}
                </div>
              )}
            </div>
            <div className="p-4 border-t border-border/40 flex-shrink-0 flex items-center justify-end gap-2">
              <button onClick={onCancel} className={clsBtn("yellow","sm")}>เสร็จสิ้น</button>
            </div>
          </>
        )}
      </div>
    </div>
  );
}

function OvertradeDet({overtrades,getUnit,balance,products}){
  const[expanded,setExpanded]=React.useState(false);
  const show=expanded?overtrades:overtrades.slice(0,5);
  return(
    <div className="bg-orange-500/5 border border-orange-500/20 rounded-xl p-3">
      <div className="mb-2">
        <span className="text-orange-400 text-xs font-semibold">⚠️ Overtrade Detector — ไม้ที่ใช้ size ใหญ่กว่าค่าเฉลี่ยของ product นั้น + ขาดทุน ({overtrades.length} ไม้)</span>
      </div>
      <div className="space-y-1.5">
        {show.map(function(t){
          var unit=getUnit(t.productId);
          var p=t._p||resolveProduct(products||[],t.productId);
          var pv=p?calcPositionValue(p,t.contracts,t.entryPrice):0;
          var gearing=balance>0?pv/balance:0;
          var loss=p?calcNetPL(p,t.contracts,t.entryPrice,t.exitPrice,t.direction):0;
          var sym=p?p.baseSymbol||p.name:t.productId;
          var prodAvg=t._prodAvg||0;
          return(
            <div key={t.id} className="bg-input/30 rounded-lg px-2.5 py-1.5">
              <div className="flex items-center gap-2 text-xs flex-wrap">
                <span className="text-txt font-semibold whitespace-nowrap">{t.contractCode||t.productId}</span>
                <DirBadge dir={t.direction}/>
                <span className="text-muted">{t.contracts} lots</span>
                <span className="text-muted mx-0.5">·</span>
                <span className="text-orange-400 font-medium">{fmtGearing(gearing)}</span>
                <span className="text-muted mx-0.5">·</span>
                <span className="text-red font-medium">{fmtTHB(loss,0)} ฿</span>
                <span className="text-muted/50 ml-auto">{fmtDate(t.exitDateTime)}</span>
              </div>
              <div className="text-[10px] text-muted/70 mt-0.5 pl-0.5">ใช้ {t.contracts}c (avg {prodAvg.toFixed(1)}c สำหรับ {sym}) · gearing {gearing.toFixed(2)}X · ขาดทุน {fmtTHB(Math.abs(loss),0)} ฿</div>
            </div>
          );
        })}
      </div>
      {overtrades.length>5&&(
        <button onClick={()=>setExpanded(p=>!p)}
          className="mt-2 w-full text-center text-muted/60 text-[10px] hover:text-muted transition py-1">
          {expanded?"▲ ย่อ":"▼ ดูทั้งหมด "+overtrades.length+" ไม้"}
        </button>
      )}
    </div>
  );
}

function PageDashboard({trades,products,balance,portfolio}){
  const SETUP_COLORS={"ประคองตลาด":"#3B82F6","สวนเทรนด์":"#F59E0B","Sideway":"#8B5CF6","Snow Ball":"#06B6D4","Scalp":"#F97316","Run-Trend":"#0ECB81","Other":"#848E9C"};
  const PROD_COLORS={gold:"#F0B90B",s50:"#3B82F6",silver:"#9CA3AF",usdjpy:"#8B5CF6"};
  const PROD_NAME={gold:"GOLD",s50:"S50",silver:"SILVER",usdjpy:"USDJPY"};

  const[timeFilter,setTimeFilter]=useState("all");
  const[activeSetups,setActiveSetups]=useState(()=>new Set(SETUP_TYPES));

  const getP=useCallback(t=>resolveProduct(products||[],t.productId),[products]);

  const allClosed=useMemo(()=>(trades||[]).filter(t=>t.status==="closed"&&t.exitDateTime).sort((a,b)=>new Date(a.exitDateTime)-new Date(b.exitDateTime)),[trades]);

  const closed=useMemo(()=>{
    var r=allClosed;
    if(timeFilter!=="all"){
      var now=new Date();
      var cutoff;
      if(timeFilter==="ytd"){
        cutoff=new Date(now.getFullYear(),0,1);
      }else{
        var months=timeFilter==="3m"?3:timeFilter==="6m"?6:12;
        cutoff=new Date(now.getFullYear(),now.getMonth()-months,now.getDate());
      }
      r=r.filter(t=>new Date(t.exitDateTime)>=cutoff);
    }
    if(activeSetups.size<SETUP_TYPES.length){
      r=r.filter(t=>activeSetups.has(t.setupType||"Other"));
    }
    return r;
  },[allClosed,timeFilter,activeSetups]);

  const metrics=useMemo(()=>{
    if(!closed.length)return null;
    const m=buildCanonicalMetrics(closed.map(t=>({...t,status:"closed"})),products,portfolio,balance);
    const fmtMs=ms=>{const h=Math.floor(ms/3600000),m2=Math.floor((ms%3600000)/60000);return h>=24?Math.floor(h/24)+"d "+h%24+"h":h>0?h+"h "+m2+"m":m2+"m";};
    return{...m,fmtMs};
  },[closed,products,portfolio,balance]);

  const equityPoints=useMemo(()=>{
    const events=[];
    (portfolio?.transactions||[]).forEach(tx=>{
      events.push({date:tx.date,delta:tx.type==="deposit"?tx.amount:-tx.amount,setup:"_tx"});
    });
    closed.forEach(t=>{
      events.push({date:t.exitDateTime,delta:tradeNetPL(t,getP(t)),setup:t.setupType||"Other"});
    });
    events.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
    var cum=0;
    return events.map(e=>{cum+=e.delta;return{date:e.date.slice(0,10),cum,setup:e.setup};});
  },[closed,getP,portfolio?.transactions]);

  const bySetup=useMemo(()=>{
    var m={};
    closed.forEach(t=>{
      var net=calcNetPL(getP(t),t.contracts,t.entryPrice,t.exitPrice,t.direction);
      var k=t.setupType||"Other";
      if(!m[k])m[k]={wins:0,losses:0,pnl:0};
      m[k].pnl+=net;
      if(net>0)m[k].wins++;else m[k].losses++;
    });
    return Object.entries(m).map(([name,v])=>({
      name,wins:v.wins,losses:v.losses,pnl:v.pnl,
      total:v.wins+v.losses,
      winPct:v.wins/(v.wins+v.losses)*100,
      avgPL:v.pnl/(v.wins+v.losses)
    })).sort((a,b)=>b.avgPL-a.avgPL);
  },[closed,getP]);

  const byProduct=useMemo(()=>{
    var m={};
    closed.forEach(t=>{
      var net=calcNetPL(getP(t),t.contracts,t.entryPrice,t.exitPrice,t.direction);
      var k=t.productId;
      if(!m[k])m[k]={count:0,pnl:0};
      m[k].count++;m[k].pnl+=net;
    });
    return Object.entries(m).map(([id,v])=>({id,count:v.count,pnl:v.pnl,avgPL:v.pnl/v.count}));
  },[closed,getP]);

  const monthlyPL=useMemo(()=>{
    var m={};
    closed.forEach(t=>{
      var net=calcNetPL(getP(t),t.contracts,t.entryPrice,t.exitPrice,t.direction);
      var key=t.exitDateTime.slice(0,7);
      if(!m[key])m[key]={pnl:0,count:0};
      m[key].pnl+=net;m[key].count++;
    });
    return Object.entries(m).sort((a,b)=>a[0].localeCompare(b[0])).map(([k,v])=>({month:k,pnl:v.pnl,count:v.count}));
  },[closed,getP]);

  const durationBuckets=useMemo(()=>{
    var BUCKETS=[
      {label:"<1h",      min:0,          max:3600000},
      {label:"1–8h",     min:3600000,    max:28800000},
      {label:"8h–1d",    min:28800000,   max:86400000},
      {label:"1–3d",     min:86400000,   max:259200000},
      {label:"3–7d",     min:259200000,  max:604800000},
      {label:">7d",      min:604800000,  max:Infinity},
    ];
    return BUCKETS.map(b=>{
      var ts=closed.filter(t=>t.openDateTime&&t.exitDateTime).filter(t=>{
        var dur=new Date(t.exitDateTime)-new Date(t.openDateTime);
        return dur>=b.min&&dur<b.max;
      });
      var nets=ts.map(t=>calcNetPL(getP(t),t.contracts,t.entryPrice,t.exitPrice,t.direction));
      var avgPL=nets.length?nets.reduce((s,v)=>s+v,0)/nets.length:null;
      var winsB=nets.filter(v=>v>0).length;
      var winPct=nets.length?winsB/nets.length*100:null;
      var tksArr=ts.filter(t=>t.exitPrice!=null).map(t=>{var p=getP(t);return p?((t.exitPrice-t.entryPrice)/p.tickSize)*(t.direction==="Long"?1:-1):null;}).filter(v=>v!=null);
      var avgTkDur=tksArr.length?tksArr.reduce((s,v)=>s+v,0)/tksArr.length:null;
      return{label:b.label,trades:ts.length,avgPL,winPct,avgTkDur};
    }).filter(b=>b.trades>0);
  },[closed,getP]);

  const commStats=useMemo(()=>{
    const byProduct={};
    let total=0;
    closed.forEach(t=>{
      const p=getP(t);
      if(!p)return;
      const c=getRoundTripComm(p)*t.contracts;
      total+=c;
      if(!byProduct[p.id])byProduct[p.id]={name:p.name,total:0,count:0};
      byProduct[p.id].total+=c;
      byProduct[p.id].count+=1;
    });
    return{total,byProduct};
  },[closed,getP]);

    const traderStyle=useMemo(()=>{
    if(!metrics||!closed.length)return null;
    const wr=metrics.winRate||0;
    const pf=metrics.pf||0;
    const rr=metrics.rr||0;
    const maxDD=metrics.maxDDAbs||0;
    const avgHoldHrs=closed.reduce((s,t)=>{
      if(!t.openDateTime||!t.exitDateTime)return s;
      return s+(new Date(t.exitDateTime)-new Date(t.openDateTime));
    },0)/Math.max(1,closed.length)/3600000;
    const isScalper=avgHoldHrs<8;
    const isPosition=avgHoldHrs>=72;
    if(wr>=65&&pf>=1.8&&maxDD<balance*0.08)
      return{icon:"🎯",name:"นักซุ่มยิง",
        desc:"Win Rate สูง ควบคุม drawdown ได้ดีเยี่ยม เลือก setup อย่างระมัดระวัง",
        strengths:["Accuracy สูง ("+wr.toFixed(0)+"%)","DD ต่ำ","วินัยดีมาก"],
        watchOut:["อาจพลาด big move เพราะ selective เกิน","RR อาจต่ำถ้า cut กำไรเร็ว"]};
    if(wr<50&&pf>=1.5&&rr>=2.5)
      return{icon:"🦁",name:"นักล่าของใหญ่",
        desc:"ชนะน้อยครั้งแต่แต่ละครั้งได้กำไรมาก ต้องทนใจกับการแพ้บ่อย",
        strengths:["Avg Win ใหญ่ (RR "+rr.toFixed(1)+"x)","PF ดี","ทนแรงกดดันได้"],
        watchOut:["ต้องทนแพ้ติดต่อกันหลายครั้ง","ต้องการทุนพอรับ drawdown"]};
    if(isScalper&&wr>=55&&pf>=1.2)
      return{icon:"⚡",name:"Scalper",
        desc:"เข้าออกเร็ว ทำกำไรจากการเคลื่อนไหวระยะสั้น ต้องการ execution ดีมาก",
        strengths:["เข้าออกไว avg "+avgHoldHrs.toFixed(0)+" ชม","ไม่ค้างข้ามคืน","Win Rate "+wr.toFixed(0)+"%"],
        watchOut:["ค่าคอมสะสมเยอะ","ต้องมี discipline เข้าออกตาม plan"]};
    if(isPosition&&pf>=1.3)
      return{icon:"🏔️",name:"Position Trader",
        desc:"ถือยาว เน้นเทรนด์ใหญ่ ต้องทนกับ floating loss ระหว่างทาง",
        strengths:["ถือเฉลี่ย "+Math.round(avgHoldHrs/24)+" วัน","ไม่ over-trade","เก็บเทรนด์ได้เต็มที่"],
        watchOut:["ต้องการเงินทุนมาก","Drawdown อาจสูงระหว่างถือ"]};
    if(wr>=50&&pf>=1.1)
      return{icon:"🏃",name:"Consistent Trader",
        desc:"สม่ำเสมอ สะสมกำไรต่อเนื่อง ยังพัฒนา edge ได้อีกมาก",
        strengths:["Win Rate "+wr.toFixed(0)+"%","Steady income","ไม่ over-risk"],
        watchOut:["หา setup ที่ให้ RR สูงขึ้น","เพิ่ม conviction ในไม้ที่ชนะ"]};
    return{icon:"🚧",name:"กำลังพัฒนา Edge",
      desc:"ข้อมูลยังไม่พอสรุปสไตล์ชัดเจน — เทรดต่อไปและทบทวน system",
      strengths:["มีประสบการณ์ตลาด","กล้าตัดสินใจ"],
      watchOut:["ลด position size ลงก่อน","บันทึกทุก trade และหา pattern","ทบทวน setup criteria"]};
  },[metrics,balance,closed]);

  var polarToCartesian=function(cx,cy,r,angleDeg){
    var rad=(angleDeg-90)*Math.PI/180;
    return{x:cx+r*Math.cos(rad),y:cy+r*Math.sin(rad)};
  };

  if(!allClosed.length)return(
    <div className="flex items-center justify-center min-h-[60vh]">
      <div className="text-center space-y-2"><div className="text-5xl">📊</div><h2 className="text-xl font-semibold">Dashboard</h2><p className="text-muted text-sm">ยังไม่มี closed trades</p></div>
    </div>
  );

  var MetricCard=function({label,value,sub,color,icon}){
    color=color||"text-txt";
    return(
      <div className="bg-card border border-border rounded-xl p-4">
        <div className="flex items-start justify-between mb-2"><span className="text-muted text-xs font-medium">{label}</span>{icon&&<span className="text-lg">{icon}</span>}</div>
        <div className={"text-xl font-bold tabular-nums "+color}>{value}</div>
        {sub&&<div className="text-muted text-xs mt-1">{sub}</div>}
      </div>
    );
  };

  return(
    <div className="space-y-5">

      
      <div className="bg-card border border-border rounded-xl p-3 flex flex-wrap gap-3 items-center sticky top-0 z-10">
        <div className="flex gap-1">
          {[["all","ทั้งหมด"],["ytd","YTD"],["3m","3M"],["6m","6M"],["1y","1Y"]].map(function(item){
            var v=item[0],l=item[1];
            return(
              <button key={v} onClick={()=>setTimeFilter(v)}
                className={"px-3 py-1.5 rounded-lg text-xs font-semibold transition "+(timeFilter===v?"bg-yellow text-black":"bg-input/60 text-muted hover:text-txt")}>
                {l}
              </button>
            );
          })}
        </div>
        <div className="w-px h-5 bg-border"/>
        <div className="flex flex-wrap gap-1.5">
          {SETUP_TYPES.map(s=>(
            <button key={s} onClick={()=>setActiveSetups(function(prev){var n=new Set(prev);n.has(s)?n.delete(s):n.add(s);return n;})}
              className={"px-2 py-0.5 rounded text-[10px] font-medium transition border "+(activeSetups.has(s)?"border-transparent":"border-border bg-input/30 opacity-40")}
              style={activeSetups.has(s)?{background:SETUP_COLORS[s]+"22",color:SETUP_COLORS[s],borderColor:SETUP_COLORS[s]+"44"}:{}}>
              {s}
            </button>
          ))}
        </div>
        {closed.length!==allClosed.length&&<span className="text-muted text-xs ml-auto">{closed.length}/{allClosed.length} trades</span>}
      </div>

      {!metrics?(
        <div className="bg-card border border-border border-dashed rounded-2xl p-14 text-center space-y-3">
          <div className="text-5xl">📊</div>
          <p className="text-txt font-semibold text-lg">ยังไม่มีข้อมูลเพียงพอ</p>
          <p className="text-muted text-sm leading-relaxed">ปิด trade อย่างน้อย 1 ไม้<br/>เพื่อดู Dashboard analytics</p>
        </div>
      ):(
        <div className="space-y-5">

        
        <div className="grid grid-cols-2 md:grid-cols-3 gap-3">
          <MetricCard label="Win Rate" icon="🎯"
            value={metrics.winRate.toFixed(1)+"%"}
            sub={metrics.winsCount+"W / "+metrics.lossesCount+"L · "+metrics.totalTrades+" ไม้"}
            color={metrics.winRate>=50?"text-green":"text-red"}/>
          {(()=>{
            const hwm=portfolio?.peakEquity||0;
            if(!hwm)return null;
            const balNow=balance||0;
            const ddPct=hwm>balNow?(hwm-balNow)/hwm*100:0;
            // HWM Equity Layer 2 card intentionally hidden 2026-05-12:
            // duplicate of canonical HWM Balance and confused by including
            // unrealized P/L from open positions. The Layer-2 equity-HWM hook +
            // Yahoo fetch path were removed 2026-07-02 (quarantine ended); no UI consumer.
            return(
              <MetricCard label="HWM (Balance)" icon="🏔️"
                value={fmtTHB(hwm,0)+" ฿"}
                sub={ddPct>0?"DD: -"+ddPct.toFixed(1)+"%":"At peak ✅"}
                color={ddPct>=20?"text-red":ddPct>=10?"text-yellow":"text-green"}/>
            );
          })()}
          <MetricCard label="Profit Factor" icon="⚖️"
            value={metrics.pf?fmtRatio(metrics.pf,2)+"x":"—"}
            sub={"กำไรรวม ÷ ขาดทุนรวม · >1 = profitable"}
            color={metrics.pf&&metrics.pf>=1?"text-green":"text-red"}/>
          
          <MetricCard label="Max Drawdown" icon="📉"
            value={"-"+metrics.maxDDPct.toFixed(1)+"%"}

const MT5_INBOX_FLAG="tj_mt5_inbox";

// Mask the MT5 login so it survives screenshots without exposing the full account number.
function _mt5MaskAccount(acct){
  if(acct===null||acct===undefined||acct==="")return"—";
  const s=String(acct);
  if(s.length<=6)return s.replace(/.(?=.)/g,"•");
  return s.slice(0,3)+"•••"+s.slice(-3);
}
// Static (JIT-safe) chip classes per state — no template-constructed class names.
function _mt5StateChipCls(state){
  switch(state){
    case"needs_mapping":return"bg-yellow/15 text-yellow border border-yellow/20";
    case"new":return"bg-orange/15 text-orange border border-orange/20";
    case"group_suggested":return"bg-orange/15 text-orange border border-orange/20";
    case"grouped":return"bg-green/15 text-green border border-green/20";
    case"materialized":return"bg-green/15 text-green border border-green/20";
    case"dismissed":return"bg-input text-muted border border-border";
    default:return"bg-input text-muted border border-border";
  }
}
// SSF / dangerous multiplier — must never be mapped to a stock preset (csize 1). Awareness only.
function _mt5IsSsfRisk(r){
  const cls=(r.instrument_class||"").toString().toLowerCase();
  return cls==="ssf"||(Number(r.contract_size)>=1000);
}
// Section bucket by kind: 'open' | 'closed' (close/partial) | 'other' (balance/unknown/etc).
function _mt5Bucket(r){
  const k=(r.kind||"").toString().toLowerCase();
  if(k==="open")return"open";
  if(k==="close"||k==="partial")return"closed";
  return"other";
}
// Instrument classes where contract size must be checked before mapping.
function _mt5NeedsSizeCheck(cls){
  const c=(cls||"").toString().toLowerCase();
  return c==="futures"||c==="ssf"||c==="option"||c==="unknown"||c==="";
}
// Derivative/SSF-style symbol that must NOT be mapped to a stock by name alone (e.g. DELTAU26).
function _mt5IsDerivativeName(r){
  const cls=(r.instrument_class||"").toString().toLowerCase();
  const sym=(r.symbol_raw||"").toString().toUpperCase();
  return cls==="ssf"||/^DELTA[A-Z]\d/.test(sym)||_mt5IsSsfRisk(r);
}
function _mt5NoProduct(r){return r.product_id_candidate===null||r.product_id_candidate===undefined||r.product_id_candidate==="";}
// Read-only sort keys (desc): parse ISO timestamps; null/invalid sink to the bottom.
function _mt5TimeKey(v){if(!v)return -Infinity;const t=Date.parse(v);return isNaN(t)?-Infinity:t;}
function _mt5OpenSortKey(r){return Math.max(_mt5TimeKey(r.last_seen_open_at),_mt5TimeKey(r.open_time),_mt5TimeKey(r.mt5_time));}
function _mt5ClosedSortKey(r){return Math.max(_mt5TimeKey(r.close_time),_mt5TimeKey(r.mt5_time));}

// Local-only triage (0D-2): dismissed row keys live in localStorage. No backend write, no RPC.
const MT5_DISMISSED_KEY="tj_mt5_inbox_dismissed";
// Stable local triage key. source_account is used internally only (never rendered).
function _mt5RowKey(r){
  const has=v=>v!==null&&v!==undefined&&v!=="";
  const acct=has(r.source_account)?String(r.source_account):"";
  const bucket=_mt5Bucket(r);
  if(bucket==="open"&&has(r.position_id))return`open:${acct}:${r.position_id}`;
  if(bucket==="closed"&&has(r.deal_id))return`deal:${acct}:${r.deal_id}`;
  const fb=has(r.id)?r.id:(has(r.ticket)?r.ticket:r.mt5_time);
  return`row:${acct}:${fb}`;
}

// Local-only product mapping PREVIEW (0D-3): NOT real mapping. localStorage only — no DB/RPC/draft/materialize.
const MT5_PREVIEW_KEY="tj_mt5_inbox_product_preview";
// "current / next" contract pair for a product (or single / baseSymbol / "—").
function _mt5ContractPair(p){
  if(!p)return"—";
  const cur=p.currentContract||"",nxt=p.nextContract||"";
  if(cur&&nxt)return`${cur} / ${nxt}`;
  return cur||nxt||p.baseSymbol||"—";
}
// Consistent product-family label for the preview dropdown (no query):
//   "<Name> — <cur> / <nxt> · csize <n>"  + " · matches row: <sym> (current|next)" when the row matches.
// All options share this shape so Gold isn't shown U-only while others show M/U. product_id is unchanged.
function _mt5PreviewLabel(p,rowSym){
  if(!p)return"";
  const name=p.name||p.baseSymbol||p.id||"";
  const cur=p.currentContract||"",nxt=p.nextContract||"";
  const csize=(p.contractSize===null||p.contractSize===undefined||p.contractSize==="")?"—":String(p.contractSize);
  const contracts=(cur&&nxt)?`${cur} / ${nxt}`:(cur||nxt||"");
  let label=contracts?`${name} — ${contracts} · csize ${csize}`:`${name} · csize ${csize}`;
  const rs=(rowSym||"").toString().toUpperCase();
  if(cur&&rs&&rs===cur.toUpperCase())label+=` · matches row: ${rowSym} (current)`;
  else if(nxt&&rs&&rs===nxt.toUpperCase())label+=` · matches row: ${rowSym} (next)`;
  return label;
}

  if(isClosed&&r.position_id!==null&&r.position_id!==undefined&&r.position_id!==""){
    relHint=(openIds&&openIds.has(String(r.position_id)))
      ? `Matches open staging position ${r.position_id}`
      : "No matching open staging row currently loaded";
  }
  const kindCopy=isOpen
    ? "This is an MT5 open-position staging row. It has not created or changed a Journal position."
    : isClosed
      ? "This is an MT5 historical deal staging row. It is not linked to a Journal trade yet."
      : "This is an MT5 staging row (balance/other). It is not a Journal trade.";
  return(
    <div className="bg-input/30 border border-border/40 rounded-lg p-3 text-xs">
      <div className="flex flex-wrap items-center gap-1.5 mb-2">
        <span className={"px-2 py-0.5 rounded font-semibold "+_mt5StateChipCls(r.state)}>{r.state}</span>
        <span className="px-2 py-0.5 rounded font-medium bg-input text-muted border border-border">{r.kind}</span>
        <span className="font-semibold text-txt">{r.symbol_raw}</span>
        {r.normalized_symbol&&r.normalized_symbol!==r.symbol_raw&&<span className="text-muted">({r.normalized_symbol})</span>}
        {r.side&&<span className={(String(r.side).toLowerCase()==="buy")?"text-green font-medium":"text-red font-medium"}>{String(r.side).toUpperCase()}</span>}
        <span className="text-muted" title="masked account">{_mt5MaskAccount(r.source_account)}</span>
        {reseen&&<span className="px-1.5 py-0.5 rounded text-[10px] bg-yellow/15 text-yellow border border-yellow/20">re-seen</span>}
        {onToggleDismiss&&<button onClick={onToggleDismiss} title={dismissed?"Restore to main Inbox on this browser":"Hide from main Inbox on this browser"} className={"ml-auto "+clsBtn("ghost","sm")}>{dismissed?"Undo":"Dismiss"}</button>}
      </div>
      <div className="flex flex-wrap gap-1 mb-2">
        <span className="px-1.5 py-0.5 rounded text-[10px] bg-input text-muted border border-border">Staging only</span>
        <span className="px-1.5 py-0.5 rounded text-[10px] bg-input text-muted border border-border">Not a Journal trade</span>
        {needsMapping&&<span className="px-1.5 py-0.5 rounded text-[10px] bg-yellow/15 text-yellow border border-yellow/20">Needs mapping</span>}
        {noProduct&&<span className="px-1.5 py-0.5 rounded text-[10px] bg-input text-muted border border-border">No product mapped</span>}
      </div>
      <div className="text-[11px] text-muted mb-2">{kindCopy}</div>
      {dismissed&&<div className="text-[11px] text-muted mb-2">Dismissed locally — not changed in MT5 or Supabase</div>}
      {needsMapping&&<div className="text-[11px] text-yellow/90 mb-2">No Journal draft/trade has been created from this row.</div>}
      {relHint&&<div className="text-[11px] text-muted mb-2">{relHint}</div>}
      {deriv&&(
        <div className="text-[11px] text-orange bg-orange/10 border border-orange/20 rounded px-2 py-1 mb-2">
          Derivative/SSF-style symbol — do not map by name alone.{ssf?` (contract_size ${String(r.contract_size)} — never a stock preset csize 1)`:""}
        </div>
      )}
      {sizeCheck&&!deriv&&<div className="text-[11px] text-muted mb-2">Check contract size before mapping.</div>}
      {showPreview&&(
        <div className="mt-1 mb-2 rounded-lg border border-border/50 bg-input/20 px-2.5 py-2">
          <div className="text-[11px] font-semibold text-txt mb-1">Mapping preview <span className="text-muted font-normal">(local only)</span></div>
          <div className="text-[11px] text-muted mb-1">No real product mapped</div>
          <div className="text-[11px] mb-1.5">
            {(preview&&preview.label)

          </div>
          <Mt5PreviewControls preview={preview} products={products} onSet={onSetPreview} onClear={onClearPreview} rowSym={r.symbol_raw||r.normalized_symbol}/>
          {previewProduct&&(
            <div className="text-[10px] text-muted mt-1.5 leading-relaxed bg-input/20 rounded px-2 py-1">
              <div>MT5 row: {r.symbol_raw||"—"} · csize {(r.contract_size===null||r.contract_size===undefined||r.contract_size==="")?"—":String(r.contract_size)} · {r.instrument_class||"—"}</div>
              <div>Preview product: {previewProduct.name||previewProduct.baseSymbol||previewProduct.id} · {_mt5ContractPair(previewProduct)} · csize {(previewProduct.contractSize===null||previewProduct.contractSize===undefined||previewProduct.contractSize==="")?"—":String(previewProduct.contractSize)}</div>
              <div>Series match: {seriesMatch}</div>

      <div className="grid grid-cols-1 sm:grid-cols-2 gap-x-4 gap-y-0.5">
        {isOpen&&fld("position_id",r.position_id)}

        {isClosed&&fld("position_id",r.position_id)}
        {isClosed&&fld("order_id",r.order_id)}
        {isClosed&&fld("side",r.side)}
        {isClosed&&fld("volume",r.volume)}
        {isClosed&&fld("price",r.price)}
        {isClosed&&fld("close_time",r.close_time)}
        {isClosed&&fld("mt5_time",r.mt5_time)}
        {isClosed&&fld("broker_profit",r.broker_profit)}
        {isClosed&&fld("commission",r.commission)}
